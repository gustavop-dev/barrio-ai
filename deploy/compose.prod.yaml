# Barrio AI en un servidor 24/7: PWA + Django + dos workers (general y acciones) + piloto automático + PostgreSQL.
# Uso (en el servidor, desde esta carpeta):
#   docker compose -f compose.prod.yaml --env-file .env pull && docker compose -f compose.prod.yaml --env-file .env up -d
name: barrio-ai
# Images are built by GitHub Actions (.github/workflows/barrio-ai.yml) and pulled from GHCR;
# `build` stays only as a local fallback (docker compose build).
x-app: &app
  image: ghcr.io/gustavop-dev/barrio-ai-api:${BARRIO_TAG:-latest}
  build:
    context: ../agentes-linkedin/infra
    additional_contexts:
      equipo: ../agentes-linkedin/equipos
  env_file: .env
  environment:
    DATABASE_URL: postgresql://knowledge:${POSTGRES_PASSWORD}@db:5432/knowledge
    SOURCE_ROOT: /workspace
    DJANGO_HTTPS: "true"
    DJANGO_ALLOWED_HOSTS: ${BARRIO_DOMAIN},api,127.0.0.1,localhost
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${BARRIO_DOMAIN}
    # Private files of the capture button and the Galería; the image creates it owned by app (uid 10001).
    MEDIA_ROOT: /app/media
  # Every app service shares the media volume: the autopilot's policy and worker-acciones read the post images
  # (imagenes.issues and the upload to LinkedIn). Without it they saw «Imagen no disponible» and discarded the piece.
  volumes:
    - ./conocimiento:/workspace:ro
    - media:/app/media
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_DB: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar .env}
    volumes: ["knowledge-db:/var/lib/postgresql/data", "./backups:/backups"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
  migrate:
    <<: *app
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py bootstrap_local"]
    depends_on: {db: {condition: service_healthy}}
    restart: "no"
  api:
    <<: *app
    command: ["sh", "-c", "python manage.py collectstatic --noinput --verbosity 0 && exec gunicorn linkedin_backend.wsgi:application --bind 0.0.0.0:8787 --workers 2 --timeout 300 --forwarded-allow-ips='*'"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
  worker:
    <<: *app
    # General lane: LLM work, network reads, metrics and transcriptions. LinkedIn writes go to worker-acciones.
    command: ["python", "manage.py", "runworker", "--lane", "general"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_health", "--lane", "general"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 330s  # a transcription may take up to ASSEMBLYAI_TIMEOUT_S (300 s)
  worker-acciones:
    <<: *app
    # Actions lane: execute_action and reconcile_action only, so a write never waits behind slow jobs.
    command: ["python", "manage.py", "runworker", "--lane", "acciones"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_health", "--lane", "acciones"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 90s  # one LinkedIn write with its pre-check and read-back
  autopilot:
    <<: *app
    command: ["python", "manage.py", "autopiloto"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import time,pathlib; assert time.time()-float(pathlib.Path('/tmp/barrio-autopilot-heartbeat').read_text())<180"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
  web:
    # Static PWA + reverse proxy with automatic HTTPS (Let's Encrypt). Only public service.
    image: ghcr.io/gustavop-dev/barrio-ai-web:${BARRIO_TAG:-latest}
    build:
      # The PWA imports compartido/ (shared with the native app): build from the repository root.
      context: ..
      dockerfile: oficina/Dockerfile
    environment:
      BARRIO_DOMAIN: ${BARRIO_DOMAIN:?Configurar .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
    logging: *logging
  navegador:
    # LinkedIn without Unipile (docs/plan-linkedin-directo.md): one Chromium per account that makes every call from
    # the logged-in page. OFF until the `navegador` profile is named: a plain `up -d` does not start it. Internal network
    # only: no host port and nothing in the Caddyfile; the backend reaches it at http://navegador:8790 with the token.
    profiles: ["navegador"]
    image: ghcr.io/gustavop-dev/barrio-ai-navegador:${BARRIO_TAG:-latest}
    build:
      context: ../agentes-linkedin/navegador
      additional_contexts:
        directo: ../agentes-linkedin/infra/src/linkedin_directo
    # A fixed name: Chromium's profile lock names the machine, and a recreated container must still be "this machine".
    hostname: navegador
    environment:
      NAVEGADOR_TOKEN: ${NAVEGADOR_TOKEN:-}
      # Budgets: empty = the service's own defaults (navegador/ajustes.py, README «Topes frente al ritmo real»).
      NAVEGADOR_LECTURAS_HORA: ${NAVEGADOR_LECTURAS_HORA:-}
      NAVEGADOR_LECTURAS_DIA: ${NAVEGADOR_LECTURAS_DIA:-}
      NAVEGADOR_ESCRITURAS_HORA: ${NAVEGADOR_ESCRITURAS_HORA:-}
      NAVEGADOR_ESCRITURAS_DIA: ${NAVEGADOR_ESCRITURAS_DIA:-}
      NAVEGADOR_COMENTARIOS_DIA: ${NAVEGADOR_COMENTARIOS_DIA:-}
      NAVEGADOR_REACCIONES_DIA: ${NAVEGADOR_REACCIONES_DIA:-}
      NAVEGADOR_SEGUIMIENTOS_DIA: ${NAVEGADOR_SEGUIMIENTOS_DIA:-}
      NAVEGADOR_INVITACIONES_DIA: ${NAVEGADOR_INVITACIONES_DIA:-}
      NAVEGADOR_ACEPTACIONES_DIA: ${NAVEGADOR_ACEPTACIONES_DIA:-}
      NAVEGADOR_PAUSA_MIN: ${NAVEGADOR_PAUSA_MIN:-3}
      NAVEGADOR_PAUSA_MAX: ${NAVEGADOR_PAUSA_MAX:-7}
      # Internet exit (empty = straight out); a change of exit is refused until accepted (README «Salida a internet»).
      NAVEGADOR_PROXY: ${NAVEGADOR_PROXY:-}
      NAVEGADOR_PROXY_CUENTAS: ${NAVEGADOR_PROXY_CUENTAS:-}
      NAVEGADOR_PROXY_USUARIO: ${NAVEGADOR_PROXY_USUARIO:-}
      NAVEGADOR_PROXY_CLAVE: ${NAVEGADOR_PROXY_CLAVE:-}
    volumes: ["navegador-datos:/datos"]  # browser profiles (sessions), stops, budgets and write records
    shm_size: 1gb  # Chromium needs more shared memory than Docker's 64 MB default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
    stop_grace_period: 60s  # a call in flight finishes and the browser closes its profile cleanly
    restart: unless-stopped
    logging: *logging
volumes:
  knowledge-db:
  media:
  caddy-data:
  caddy-config:
  navegador-datos:
