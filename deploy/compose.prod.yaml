# Barrio AI en un servidor 24/7: PWA + Django + dos workers (general y acciones) + piloto automático + PostgreSQL.
# Uso (en el servidor, desde esta carpeta):
#   docker compose -f compose.prod.yaml --env-file .env pull && docker compose -f compose.prod.yaml --env-file .env up -d
#
# Memory (organizaciones, phase 7; deploy/README.md «Memoria del servidor»). The server has 4 GB (about 3.8 GiB for
# processes) and 1 vCPU. Measured on 13/11/2026 (docs/plan-linkedin-directo.md, «Servidor actual»): about 2.4 GB
# available with the whole stack up and no browser; one account's browser open took its container to about 1 GiB and
# left about 1.5 GB available. A second account's browser should leave about 0.5 GB: «two accounts fit, just».
# The caps below are ceilings, not reservations (their sum is more than the RAM: each only stops ITS service from
# running away). What they buy: a runaway (a Chromium, a third browser, a leak in a worker) is killed inside its own
# container, which Docker restarts, before the kernel's global OOM killer picks a victim on the host. PostgreSQL is the
# one never capped: a hard limit would make it the victim inside its own cgroup; instead it reserves memory
# (mem_reservation = cgroup memory.low, reclaimed last) and the global OOM killer avoids it (oom_score_adj).
# Per-service numbers are estimates from the aggregate above (no per-service measurement exists yet): measure with
# `docker stats --no-stream` on the server and adjust (README «Memoria del servidor»).
name: barrio-ai
# Images are built by GitHub Actions (.github/workflows/barrio-ai.yml) and pulled from GHCR;
# `build` stays only as a local fallback (docker compose build).
x-app: &app
  image: ghcr.io/gustavop-dev/barrio-ai-api:${BARRIO_TAG:-latest}
  build:
    context: ../agentes-linkedin/infra
    additional_contexts:
      equipo: ../agentes-linkedin/equipos
  env_file: .env
  environment:
    DATABASE_URL: postgresql://knowledge:${POSTGRES_PASSWORD}@db:5432/knowledge
    SOURCE_ROOT: /workspace
    DJANGO_HTTPS: "true"
    DJANGO_ALLOWED_HOSTS: ${BARRIO_DOMAIN},api,127.0.0.1,localhost
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${BARRIO_DOMAIN}
    # Private files of the capture button and the Galería; the image creates it owned by app (uid 10001).
    MEDIA_ROOT: /app/media
  # Every app service shares the media volume: the autopilot's policy and worker-acciones read the post images
  # (imagenes.issues and the upload to LinkedIn). Without it they saw «Imagen no disponible» and discarded the piece.
  volumes:
    - ./conocimiento:/workspace:ro
    - media:/app/media
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "5"}
services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_DB: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar .env}
    volumes: ["knowledge-db:/var/lib/postgresql/data", "./backups:/backups"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No hard cap: the database must never be the process an OOM kills. 512 MB reserved (memory.low): the image's
    # shared_buffers is 128 MB, plus one backend per Django process (api ×2, two workers, the autopilot; ~10–20 MB each),
    # plus maintenance_work_mem for pgvector; under pressure the kernel reclaims the other containers first. And the
    # global OOM killer scores it far below everything else (-500; not -1000: a runaway query can still be stopped).
    mem_reservation: 512m
    oom_score_adj: -500
    restart: unless-stopped
    logging: *logging
  migrate:
    <<: *app
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py bootstrap_local"]
    depends_on: {db: {condition: service_healthy}}
    mem_limit: 512m  # one Django process, once per deploy (migrations and bootstrap_local)
    restart: "no"
  api:
    <<: *app
    command: ["sh", "-c", "python manage.py collectstatic --noinput --verbosity 0 && exec gunicorn linkedin_backend.wsgi:application --bind 0.0.0.0:8787 --workers 2 --timeout 300 --forwarded-allow-ips='*'"]
    # The gunicorn master and 2 workers (each a whole Django with the knowledge library, ~150–250 MB) plus an upload or
    # an export in flight. Over the cap the kernel kills one worker and gunicorn starts another: a request fails, the
    # service stays (its healthcheck sees it otherwise).
    mem_limit: 768m
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
  worker:
    <<: *app
    # General lane: LLM work, network reads, metrics and transcriptions. LinkedIn writes go to worker-acciones.
    command: ["python", "manage.py", "runworker", "--lane", "general"]
    # The heaviest app process: LLM answers, image and infographic rendering, transcription uploads, analytics imports.
    mem_limit: 768m
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_health", "--lane", "general"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 330s  # a transcription may take up to ASSEMBLYAI_TIMEOUT_S (300 s)
  worker-acciones:
    <<: *app
    # Actions lane: execute_action and reconcile_action only, so a write never waits behind slow jobs.
    command: ["python", "manage.py", "runworker", "--lane", "acciones"]
    mem_limit: 512m  # one write at a time and its read-back; the post's image upload is the largest thing it holds
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_health", "--lane", "acciones"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 90s  # one LinkedIn write with its pre-check and read-back
  autopilot:
    <<: *app
    command: ["python", "manage.py", "autopiloto"]
    mem_limit: 512m  # one Django process that only reads the database and queues jobs
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import time,pathlib; assert time.time()-float(pathlib.Path('/tmp/barrio-autopilot-heartbeat').read_text())<180"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
  web:
    # Static PWA + reverse proxy with automatic HTTPS (Let's Encrypt). Only public service.
    image: ghcr.io/gustavop-dev/barrio-ai-web:${BARRIO_TAG:-latest}
    build:
      # The PWA imports compartido/ (shared with the native app): build from the repository root.
      context: ..
      dockerfile: oficina/Dockerfile
    environment:
      BARRIO_DOMAIN: ${BARRIO_DOMAIN:?Configurar .env}
      # The /conectar/ route of the Caddyfile (Conectar LinkedIn desde la app): off unless true.
      LINKEDIN_CONEXION_APP: ${LINKEDIN_CONEXION_APP:-false}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 256m  # Caddy: TLS, static files and the reverse proxy (tens of MB)
    restart: unless-stopped
    logging: *logging
  navegador:
    # LinkedIn directo (docs/plan-linkedin-directo.md): one Chromium per account that makes every call from
    # the logged-in page. OFF until the `navegador` profile is named: a plain `up -d` does not start it. Internal network
    # only: no host port and nothing in the Caddyfile; the backend reaches it at http://navegador:8790 with the token.
    profiles: ["navegador"]
    image: ghcr.io/gustavop-dev/barrio-ai-navegador:${BARRIO_TAG:-latest}
    build:
      context: ../agentes-linkedin/navegador
      additional_contexts:
        directo: ../agentes-linkedin/infra/src/linkedin_directo
    # A fixed name: Chromium's profile lock names the machine, and a recreated container must still be "this machine".
    hostname: navegador
    environment:
      NAVEGADOR_TOKEN: ${NAVEGADOR_TOKEN:-}
      # Budgets: empty = the service's own defaults (navegador/ajustes.py, README «Topes frente al ritmo real»).
      NAVEGADOR_LECTURAS_HORA: ${NAVEGADOR_LECTURAS_HORA:-}
      NAVEGADOR_LECTURAS_DIA: ${NAVEGADOR_LECTURAS_DIA:-}
      NAVEGADOR_ESCRITURAS_HORA: ${NAVEGADOR_ESCRITURAS_HORA:-}
      NAVEGADOR_ESCRITURAS_DIA: ${NAVEGADOR_ESCRITURAS_DIA:-}
      NAVEGADOR_COMENTARIOS_DIA: ${NAVEGADOR_COMENTARIOS_DIA:-}
      NAVEGADOR_REACCIONES_DIA: ${NAVEGADOR_REACCIONES_DIA:-}
      NAVEGADOR_SEGUIMIENTOS_DIA: ${NAVEGADOR_SEGUIMIENTOS_DIA:-}
      NAVEGADOR_INVITACIONES_DIA: ${NAVEGADOR_INVITACIONES_DIA:-}
      NAVEGADOR_ACEPTACIONES_DIA: ${NAVEGADOR_ACEPTACIONES_DIA:-}
      NAVEGADOR_PAUSA_MIN: ${NAVEGADOR_PAUSA_MIN:-3}
      NAVEGADOR_PAUSA_MAX: ${NAVEGADOR_PAUSA_MAX:-7}
      # Close an account's browser after this many idle minutes (empty or 0 = never, the default). Kept off on purpose:
      # it does not lower the peak and every reopen is one more feed load (deploy/README.md «Memoria del servidor»).
      NAVEGADOR_CIERRE_INACTIVO_MIN: ${NAVEGADOR_CIERRE_INACTIVO_MIN:-}
      # An account's browser opens only with this many MiB free (the host's MemAvailable and what is left under this
      # container's cap, the smaller): ~900 MiB a browser takes, plus ~200 MiB that must stay for the database and the
      # workers. Below it the call gets 503 `memoria` («no salió nada») and the backend retries later. With two browsers
      # open (~0.5 GB left) a third never opens. 0 turns it off. README «Memoria».
      NAVEGADOR_MEMORIA_MINIMA_MB: ${NAVEGADOR_MEMORIA_MINIMA_MB:-1100}
      # Internet exit (empty = straight out); a change of exit is refused until accepted (README «Salida a internet»).
      NAVEGADOR_PROXY: ${NAVEGADOR_PROXY:-}
      NAVEGADOR_PROXY_CUENTAS: ${NAVEGADOR_PROXY_CUENTAS:-}
      NAVEGADOR_PROXY_USUARIO: ${NAVEGADOR_PROXY_USUARIO:-}
      NAVEGADOR_PROXY_CLAVE: ${NAVEGADOR_PROXY_CLAVE:-}
      # Conectar LinkedIn desde la app (README «Conectar desde la app»): off unless true. The remote view listens on
      # 8791 of the internal network only while a login lasts; Caddy reaches it at /conectar/ behind the backend's check.
      NAVEGADOR_CONEXION: ${LINKEDIN_CONEXION_APP:-}
      NAVEGADOR_CONEXION_MIN: ${NAVEGADOR_CONEXION_MIN:-}
    volumes: ["navegador-datos:/datos"]  # browser profiles (sessions), stops, budgets and write records
    shm_size: 1gb  # Chromium needs more shared memory than Docker's 64 MB default (what it uses counts in mem_limit)
    # Two accounts' browsers: ~1 GiB measured with one open (service, Xvfb and Chromium), ~0.9 GiB more for the second,
    # so ~1.9–2.0 GiB, plus the login browser of «Conectar desde la app» (it replaces the account's own page). 2.25 GiB
    # leaves ~10 % for a heavy feed; a third browser or a runaway renderer is killed HERE (Chromium restarts its page,
    # the call gets 503/504 and is retried) instead of the host's OOM killer reaching the database. The global OOM killer
    # also prefers this container (oom_score_adj 300; Chromium raises its renderers' own score further).
    mem_limit: 2304m
    oom_score_adj: 300
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
    stop_grace_period: 60s  # a call in flight finishes and the browser closes its profile cleanly
    restart: unless-stopped
    logging: *logging
  rodaje:
    # Phase 4's soak run (docs/plan-linkedin-directo.md «Fase 4», navegador README «Rodaje»): ONE test account doing a
    # production day through the running navegador service, day after day. OFF until the `rodaje` profile is named, and
    # it needs `navegador` up (no depends_on: across profiles it would not start alone). It talks to that service only:
    # no backend, no database. Its daily summaries go next to the account in the same volume.
    profiles: ["rodaje"]
    image: ghcr.io/gustavop-dev/barrio-ai-navegador:${BARRIO_TAG:-latest}
    entrypoint: ["python", "-m", "navegador", "rodaje"]  # no virtual screen: it opens no browser
    environment:
      NAVEGADOR_TOKEN: ${NAVEGADOR_TOKEN:-}
      NAVEGADOR_URL: http://navegador:8790
      # Empty = the soak's own defaults (navegador/rodaje.py; deploy/.env.example lists them).
      RODAJE_CUENTA: ${RODAJE_CUENTA:-}
      RODAJE_HORARIO: ${RODAJE_HORARIO:-}
      RODAJE_ZONA: ${RODAJE_ZONA:-}
      RODAJE_ESCALA: ${RODAJE_ESCALA:-}
      RODAJE_REACCIONES: ${RODAJE_REACCIONES:-}
      RODAJE_SEGUIMIENTOS: ${RODAJE_SEGUIMIENTOS:-}
      RODAJE_INVITACIONES: ${RODAJE_INVITACIONES:-}
      RODAJE_ACEPTACIONES: ${RODAJE_ACEPTACIONES:-}
      RODAJE_COMENTARIOS: ${RODAJE_COMENTARIOS:-}
      RODAJE_RESPUESTAS: ${RODAJE_RESPUESTAS:-}
      RODAJE_TEXTOS: ${RODAJE_TEXTOS:-}
      RODAJE_LUGAR: ${RODAJE_LUGAR:-}
      RODAJE_BUSQUEDAS: ${RODAJE_BUSQUEDAS:-}
    volumes: ["navegador-datos:/datos"]
    mem_limit: 256m  # a Python HTTP client of the navegador service: it opens no browser
    # A stop ends the process (3 or 4); started again, it waits for the next day and checks the stop before any call.
    restart: unless-stopped
    logging: *logging
volumes:
  knowledge-db:
  media:
  caddy-data:
  caddy-config:
  navegador-datos:
