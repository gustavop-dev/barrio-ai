# cubre: TUR-15, TUR-16, TUR-17
# Tu turno › «Lo que el equipo sabe de ti»: the seed's three confirmed facts with their topic, visibility and origin;
# a new one added by hand (Privado by default, «Lo añadiste tú», first on the list); «preferencia.equipos» retired,
# which takes it off the list; and «ProjectApp» edited into a new version («v2»), which moves it to the top.
appId: co.projectapp.office
name: Tu turno · lo que sabe el equipo
tags: [turno]
---
- runFlow: comun/entrar.yaml
- tapOn:
    id: top-tu-turno
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: turno-list
    timeout: 30000
- tapOn: 'Lo que el equipo sabe de ti'
- extendedWaitUntil:
    visible:
      id: turno-sabe
    timeout: 20000

# ---------------------------------------------------------------- the facts
# cubre: TUR-15
- assertVisible: 'Esto es lo único que el equipo puede contar de ti\. Nadie inventará tus experiencias, clientes ni servicios\.'
- extendedWaitUntil:
    visible: 'Prefiero trabajar con equipos pequeños que deciden rápido\.'
    timeout: 20000
- assertVisible: 'PÚBLICO|Público'
- assertVisible: 'Lo confirmaste en la memoria.*'
- takeScreenshot: 04-sabe-01-datos

# ---------------------------------------------------------------- add one by hand: Privado by default, first on the list
# cubre: TUR-16
- tapOn: 'Añadir algo que quieras que sepan'
- extendedWaitUntil:
    visible:
      id: hecho-texto
    timeout: 15000
- tapOn:
    id: hecho-texto
- inputText: Prefiero las reuniones por la mañana.
- tapOn:
    id: hecho-tema
- inputText: Horarios
- hideKeyboard
- takeScreenshot: 04-sabe-02-anadir
- tapOn: 'Guardar'
- extendedWaitUntil:
    visible: 'Guardado\. El equipo ya puede usarlo'
    timeout: 20000
- extendedWaitUntil:
    visible: 'Prefiero las reuniones por la mañana\.'
    timeout: 20000
- assertVisible: 'HORARIOS|Horarios'
- assertVisible: 'Lo añadiste tú.*'
- takeScreenshot: 04-sabe-03-anadido
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 15000

# ---------------------------------------------------------------- retire «preferencia.equipos»
# cubre: TUR-17
- scrollUntilVisible:
    element:
      text: 'Retirar: preferencia.equipos'
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: 'Retirar: preferencia.equipos'
- extendedWaitUntil:
    visible:
      id: confirm-sheet
    timeout: 15000
- assertVisible: 'El equipo deja de usar «preferencia\.equipos» desde ahora\..*'
- takeScreenshot: 04-sabe-04-retirar
- tapOn:
    text: 'Retirar'
    childOf:
      id: confirm-sheet
- extendedWaitUntil:
    visible: 'Retirado\. El equipo ya no lo usará'
    timeout: 20000
- extendedWaitUntil:
    notVisible: 'Prefiero trabajar con equipos pequeños que deciden rápido\.'
    timeout: 20000
- takeScreenshot: 04-sabe-05-retirado
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 15000

# ---------------------------------------------------------------- edit «ProjectApp»: a new version
# cubre: TUR-15, TUR-17
- scrollUntilVisible:
    element:
      text: 'Editar: ProjectApp'
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible: 'Fundé ProjectApp en Medellín\.'
- assertVisible: 'PROJECTAPP|ProjectApp'
- tapOn: 'Editar: ProjectApp'
- extendedWaitUntil:
    visible: 'Editar lo que sabe el equipo'
    timeout: 15000
- tapOn:
    id: hecho-texto
- eraseText: 60
- inputText: Fundé ProjectApp en Medellín en 2016.
- hideKeyboard
- tapOn: 'Guardar'
- extendedWaitUntil:
    visible: 'Guardado como v2'
    timeout: 20000
# The new version is now the newest fact: up to it.
- scrollUntilVisible:
    element:
      text: 'Fundé ProjectApp en Medellín en 2016\.'
    direction: UP
    timeout: 20000
    centerElement: true
- assertVisible: '.* · v2'
- takeScreenshot: 04-sabe-06-editado
