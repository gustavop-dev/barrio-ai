# Seed: seed_qa --referentes-mensual (selected by correr-maestro.sh for this flow).
# Monthly dates stay canonical; on days 6+ the countdown reads «Plazo terminado».
# Backend fake-clock tests cover day1/day4/day6, auto-apply and concurrent decisions.
appId: co.projectapp.office
name: Referentes mensuales y experimento
# cubre: OBS-01 OBS-02 OBS-04 TUR-20 TUR-21 COM-11
tags: [referentes, turno, experimentos]
---
- runFlow: comun/entrar.yaml
# Tu turno opens from the top bar (as in 04-tu-turno); there is no bottom tab for it.
- extendedWaitUntil:
    visible:
      id: top-tu-turno
      text: 'Tu turno, 13 pendientes, 1 urgente'
    timeout: 30000
- tapOn:
    id: top-tu-turno
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: turno-list
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "sale Carlos Andrés Mejía · entra Nora Investigación"
    direction: DOWN
    timeout: 30000
- assertVisible: ".*(Queda.*|Plazo terminado).*America/Bogota.*"
- scrollUntilVisible:
    element:
      text: "5 main protegidos.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 19-referentes-01-pareja
- scrollUntilVisible:
    element:
      text: "Aprobar sustitución"
    direction: DOWN
    timeout: 20000
- tapOn: "Aprobar sustitución"
- extendedWaitUntil:
    notVisible: "sale Carlos Andrés Mejía · entra Nora Investigación"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: top-tu-turno
      text: 'Tu turno, 12 pendientes, 1 urgente'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Alta: Ivo Producto"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 19-referentes-02-alta
- scrollUntilVisible:
    element:
      text: "Editar"
    direction: DOWN
    timeout: 20000
- tapOn: "Editar"
- extendedWaitUntil:
    visible:
      id: referent-edit
    timeout: 10000
- tapOn:
    id: referent-edit-reason
- eraseText: 200
- inputText: "Hipotesis ajustada por Gustavo en QA"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Guardar cambios"
    direction: DOWN
- tapOn: "Guardar cambios"
- extendedWaitUntil:
    notVisible:
      id: referent-edit
    timeout: 20000
- takeScreenshot: 19-referentes-03-edicion
- scrollUntilVisible:
    element:
      text: "Experimento: Ana Lucía Torres"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Aprobar experimento"
    direction: DOWN
    timeout: 20000
- tapOn: "Aprobar experimento"
- extendedWaitUntil:
    visible: "Detener"
    timeout: 20000
- tapOn: "Detener"
- takeScreenshot: 19-referentes-04-experimento-detenido
# The independent profile proposal survives referent decisions and opens its checklist.
- scrollUntilVisible:
    element:
      id: profile-open
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: profile-open
- scrollUntilVisible:
    element:
      text: Checklist por sección
    direction: DOWN
    timeout: 30000
- assertVisible: Checklist por sección
- assertNotVisible: '^Comprobado$'
- takeScreenshot: 19-referentes-06-perfil-conservado
- tapOn:
    id: tab-personas
- tapOn: "Referentes"
- scrollUntilVisible:
    element:
      text: "Main QA 1"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Main · Protegido"
    direction: DOWN
    timeout: 20000
- assertNotVisible: "Quitar a Main QA 1"
- scrollUntilVisible:
    element:
      text: "Gestionar protección de Main QA 1"
    direction: DOWN
    timeout: 20000
- tapOn: "Gestionar protección de Main QA 1"
- extendedWaitUntil:
    visible:
      id: referent-protection
    timeout: 10000
- takeScreenshot: 19-referentes-05-main
- tapOn: "Guardar decisión"
- extendedWaitUntil:
    notVisible:
      id: referent-protection
    timeout: 20000
