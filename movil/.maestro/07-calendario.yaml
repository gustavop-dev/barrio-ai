# cubre: CAL-01, CAL-02, CAL-03, CAL-04, CAL-05, CAL-13, PRS-08, PRS-10
# Calendario: the views, the day panel and the queue. Semana, Mes and Lista; swiping the week strip and the month turns
# them and the range under the title follows (a254114: the week swipe used to close the app); a month with nothing and
# a day more than 15 days away; a tapped day opens its panel in a sheet (half, then full), and the panel under the
# calendar keeps that day: a future day with Gustavo's meeting and a free slot, a past day without a piece, yesterday's
# summary opening «Ver todo lo del día» filtered. Lista: «Próximo» with tomorrow's piece, «En cola» with a network
# action (vetoed: it says the person is discarded for good, and it goes once the 5 s pass) and a reaction (vetoed and
# undone), «Lo que pasó» filtered by type and with «Mostrar lo que no salió». Last, the veto note says it is required.
# The piece detail is in 07-pieza-veto (tomorrow's piece) and 07-pieza-estados (the past ones).
# Dates come from comun/calendario-fechas.js (Bogotá's today, as the app computes it); the range under the title may end
# in « · Horas de Bogotá» if the device zone differs, hence the «.*». Text in the «etiqueta» style (badges, section
# labels) is uppercased on screen, so it is written in capitals here.
appId: co.projectapp.office
name: Calendario
tags: [calendario]
---
- runFlow: comun/entrar.yaml
- runScript: comun/calendario-fechas.js

# ---------------------------------------------------------------- Semana: today's week, its range in the header
# cubre: CAL-01, CAL-02
- tapOn:
    id: top-calendario
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: calendario
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: pager-semana
    timeout: 20000
- assertVisible:
    id: "dia-${output.hoy}"
- assertVisible: "${output.semanaHoy}.*"
- assertVisible:
    id: calendario-anterior
- assertVisible:
    id: calendario-siguiente
# The layers, with Conversaciones marked as partial.
- assertVisible:
    id: capa-tuyo
- assertVisible: "Conversaciones · parcial"
- takeScreenshot: 07-calendario-01-semana

# Swipe the strip left: next week, its days and its range (the app used to close here, a254114).
- swipe:
    from:
      id: pager-semana
    direction: LEFT
- extendedWaitUntil:
    visible: "${output.semanaSiguiente}.*"
    timeout: 10000
- assertVisible:
    id: "dia-${output.diaSemanaSiguiente}"
- assertNotVisible:
    id: "dia-${output.hoy}"
- takeScreenshot: 07-calendario-02-semana-siguiente
# A day of the week that slid in opens its sheet (its cells used to stay untouchable and hidden from TalkBack).
- tapOn:
    id: "dia-${output.diaSemanaSiguiente}"
- extendedWaitUntil:
    visible:
      text: "${output.diaSemanaSiguienteTitulo}"
      childOf:
        id: hoja-dia
    timeout: 10000
# No visible «Cerrar»: the sheet closes by sliding down or with Android back.
- back
- extendedWaitUntil:
    notVisible:
      id: hoja-dia
    timeout: 10000
# Right twice: back to this week, then the previous one.
- swipe:
    from:
      id: pager-semana
    direction: RIGHT
- extendedWaitUntil:
    visible: "${output.semanaHoy}.*"
    timeout: 10000
- assertVisible:
    id: "dia-${output.hoy}"
- swipe:
    from:
      id: pager-semana
    direction: RIGHT
- extendedWaitUntil:
    visible: "${output.semanaAnterior}.*"
    timeout: 10000
- assertVisible:
    id: "dia-${output.diaSemanaAnterior}"
- takeScreenshot: 07-calendario-03-semana-anterior
# «Hoy» brings today's week back.
- tapOn:
    id: calendario-hoy
- extendedWaitUntil:
    visible:
      id: "dia-${output.hoy}"
    timeout: 10000
- assertVisible: "${output.semanaHoy}.*"

# ---------------------------------------------------------------- Mes: the grid, swiped forward, a month with nothing
# cubre: CAL-01, CAL-03
- tapOn:
    text: "Mes"
- extendedWaitUntil:
    visible:
      id: rejilla-mes
    timeout: 10000
- assertVisible:
    id: pager-mes
- assertNotVisible:
    id: pager-semana
- assertVisible: "${output.mesHoy}.*"
- assertVisible:
    id: "dia-${output.mitadMes}"
- takeScreenshot: 07-calendario-04-mes
- swipe:
    from:
      id: pager-mes
    direction: LEFT
- extendedWaitUntil:
    visible: "${output.mesSiguiente}.*"
    timeout: 10000
- assertVisible:
    id: "dia-${output.mitadMesSiguiente}"
- assertNotVisible:
    id: "dia-${output.mitadMes}"
- takeScreenshot: 07-calendario-05-mes-siguiente
# Two months away: nothing registered, and its days are too far for anything to be scheduled.
- swipe:
    from:
      id: pager-mes
    direction: LEFT
- extendedWaitUntil:
    visible: "${output.mesMas2}.*"
    timeout: 10000
- extendedWaitUntil:
    visible: "No hay nada registrado en este mes."
    timeout: 15000
- tapOn:
    id: "dia-${output.mitadMesMas2}"
- extendedWaitUntil:
    visible:
      id: hoja-dia
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "Todavía no hay nada programado tan lejos."
      childOf:
        id: hoja-dia
    timeout: 10000
- assertVisible:
    text: "${output.mitadMesMas2Titulo}"
    childOf:
      id: hoja-dia
- takeScreenshot: 07-calendario-06-mes-vacio-lejos
# No visible «Cerrar»: the sheet closes by sliding down or with Android back.
- back
- extendedWaitUntil:
    notVisible:
      id: hoja-dia
    timeout: 10000
# «Hoy» brings this month back; then Semana.
- tapOn:
    id: calendario-hoy
- extendedWaitUntil:
    visible: "${output.mesHoy}.*"
    timeout: 10000
- assertVisible:
    id: "dia-${output.mitadMes}"
- tapOn:
    text: "Semana"
- extendedWaitUntil:
    visible:
      id: pager-semana
    timeout: 10000

# ---------------------------------------------------------------- days: the panel opens in a sheet
# cubre: CAL-03
# Today: the sheet opens at half height with today's heading and «Hoy»; the week stays visible above it.
- tapOn:
    id: "dia-${output.hoy}"
- extendedWaitUntil:
    visible:
      id: hoja-dia
    timeout: 10000
- assertVisible:
    text: "${output.hoyTitulo}"
    childOf:
      id: hoja-dia
- assertVisible:
    text: "HOY"
    childOf:
      id: hoja-dia
- takeScreenshot: 07-calendario-07-hoja-hoy
# Tomorrow, with the sheet still open (on Sunday tomorrow is in the next week: that case swipes the strip first; the
# open sheet keeps the strip on top, so the header's arrows are scrolled away).
- runFlow:
    when:
      notVisible:
        id: "dia-${output.manana}"
    commands:
      - swipe:
          from:
            id: pager-semana
          direction: LEFT
      - extendedWaitUntil:
          visible:
            id: "dia-${output.manana}"
          timeout: 10000
- tapOn:
    id: "dia-${output.manana}"
- extendedWaitUntil:
    visible:
      text: "${output.mananaTitulo}"
      childOf:
        id: hoja-dia
    timeout: 10000
- assertVisible:
    text: "PROGRAMADO"
    childOf:
      id: hoja-dia
- takeScreenshot: 07-calendario-08-hoja-manana
# Drag the handle up: the sheet goes to full height (under the week strip) and shows the day's piece, «Programada».
- swipe:
    from:
      text: "Altura del panel"
    direction: UP
- scrollUntilVisible:
    element:
      text: "Documentar decisiones vale más que documentar tareas"
      childOf:
        id: hoja-dia
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "PROGRAMADA"
    childOf:
      id: hoja-dia
- takeScreenshot: 07-calendario-09-hoja-completa
# No visible «Cerrar»: the sheet closes by sliding down or with Android back.
- back
- extendedWaitUntil:
    notVisible:
      id: hoja-dia
    timeout: 10000

# The day after tomorrow, in the panel under the calendar: Gustavo's meeting («Tu parte», with its hour and «Ir a Tu
# turno»: the next action of Andrés Restrepo's opportunity, PRS-08 and PRS-10) and a free slot.
# cubre: CAL-03, PRS-08, PRS-10
- runFlow:
    when:
      notVisible:
        id: "dia-${output.pasadoManana}"
    commands:
      - tapOn:
          id: calendario-siguiente
      - extendedWaitUntil:
          visible:
            id: "dia-${output.pasadoManana}"
          timeout: 10000
- tapOn:
    id: "dia-${output.pasadoManana}"
- extendedWaitUntil:
    visible:
      text: "${output.pasadoMananaTitulo}"
      childOf:
        id: hoja-dia
    timeout: 10000
# No visible «Cerrar»: the sheet closes by sliding down or with Android back.
- back
- extendedWaitUntil:
    notVisible:
      id: hoja-dia
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Reunión de alcance · Andrés Restrepo"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "TU PARTE"
- assertVisible: "Plazo: 10:00"
- assertVisible: "Ir a Tu turno"
- scrollUntilVisible:
    element:
      text: "Hueco libre\\. El equipo prepara cada pieza .* antes de su hora\\."
    direction: DOWN
    centerElement: true
    timeout: 15000
- takeScreenshot: 07-calendario-10-panel-pasado-manana

# Four days ago: no piece that day.
- scrollUntilVisible:
    element:
      id: calendario-hoy
    direction: UP
    timeout: 20000
- tapOn:
    id: calendario-hoy
- extendedWaitUntil:
    visible:
      id: "dia-${output.hoy}"
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: "dia-${output.hace4}"
    commands:
      - tapOn:
          id: calendario-anterior
      - extendedWaitUntil:
          visible:
            id: "dia-${output.hace4}"
          timeout: 10000
- tapOn:
    id: "dia-${output.hace4}"
- extendedWaitUntil:
    visible:
      text: "${output.hace4Titulo}"
      childOf:
        id: hoja-dia
    timeout: 10000
- assertVisible:
    text: "PASADO"
    childOf:
      id: hoja-dia
- extendedWaitUntil:
    visible:
      text: "Sin publicación."
      childOf:
        id: hoja-dia
    timeout: 10000
- takeScreenshot: 07-calendario-11-hoja-sin-publicacion
# No visible «Cerrar»: the sheet closes by sliding down or with Android back.
- back
- extendedWaitUntil:
    notVisible:
      id: hoja-dia
    timeout: 10000

# Yesterday: its summary («N comentarios · N reacciones…»); a figure opens «Ver todo lo del día» filtered by its type,
# and a type with nothing that day says so.
- tapOn:
    id: calendario-hoy
- extendedWaitUntil:
    visible:
      id: "dia-${output.hoy}"
    timeout: 10000
- runFlow:
    when:
      notVisible:
        id: "dia-${output.ayer}"
    commands:
      - tapOn:
          id: calendario-anterior
      - extendedWaitUntil:
          visible:
            id: "dia-${output.ayer}"
          timeout: 10000
- tapOn:
    id: "dia-${output.ayer}"
- extendedWaitUntil:
    visible:
      text: "${output.ayerTitulo}"
      childOf:
        id: hoja-dia
    timeout: 10000
# No visible «Cerrar»: the sheet closes by sliding down or with Android back.
- back
- extendedWaitUntil:
    notVisible:
      id: hoja-dia
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "\\d+ comentarios?"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "\\d+ reacci(ón|ones)"
- tapOn: "\\d+ comentarios?"
- scrollUntilVisible:
    element:
      text: "Comentaste en el post de .*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertNotVisible: "Reaccionaste.*"
- takeScreenshot: 07-calendario-12-todo-lo-del-dia-comentarios
- scrollUntilVisible:
    element:
      text: "Ver todo lo del día"
    direction: UP
    centerElement: true
    timeout: 15000
- tapOn:
    text: "Publicaciones"
    below:
      text: "Ver todo lo del día"
- extendedWaitUntil:
    visible: "Nada registrado ese día con este filtro."
    timeout: 15000
- takeScreenshot: 07-calendario-13-todo-lo-del-dia-vacio

# ---------------------------------------------------------------- Lista: «Próximo» and «En cola»
# cubre: CAL-01, CAL-04, CAL-13
- scrollUntilVisible:
    element:
      text: "Lista"
    direction: UP
    timeout: 20000
- tapOn:
    text: "Lista"
- extendedWaitUntil:
    visible:
      id: calendario-lista
    timeout: 10000
- assertNotVisible:
    id: pager-semana
- assertVisible: "PRÓXIMO"
- extendedWaitUntil:
    visible:
      text: "Documentar decisiones vale más que documentar tareas"
      childOf:
        id: calendario-lista
    timeout: 20000
- assertVisible:
    text: "PROGRAMADA"
    childOf:
      id: calendario-lista
- assertVisible:
    text: "Mañana a las .*"
    childOf:
      id: calendario-lista
- takeScreenshot: 07-calendario-14-lista-proximo
# «En cola»: a reaction and an invitation, approved and waiting, each with when it goes out.
# Approval rows precede Camila: check the heading before scrolling past them to the approved actions.
- scrollUntilVisible:
    element:
      text: "EN COLA"
      childOf:
        id: calendario-lista
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "EN COLA"
- scrollUntilVisible:
    element:
      text: "Invitar a Camila Ortiz \\(sin nota\\)"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Reacción Celebro al post de Ana Lucía Torres"
- assertVisible: "Saldrá .*"
- takeScreenshot: 07-calendario-15-en-cola

# Vetar the network action: it warns that the person is discarded for good; nobody undoes it, so it goes after 5 s
# and leaves the queue.
# Approval rows (BAR-13) are listed first in «En cola», so pick Camila's row by its content, not by position.
- tapOn:
    text: "Vetar"
    childOf:
      id: "en-cola-.*"
      containsDescendants:
        - text: "Invitar a Camila Ortiz \\(sin nota\\)"
- extendedWaitUntil:
    visible:
      id: confirm-sheet
    timeout: 10000
- assertVisible:
    text: "Vetar la acción"
    childOf:
      id: confirm-sheet
- assertVisible:
    text: "No saldrá, y vetar una acción de red descarta a Camila Ortiz para siempre: el equipo no la volverá a proponer."
    childOf:
      id: confirm-sheet
- tapOn:
    id: confirm-note
- inputText: "QA: no invitar"
- hideKeyboard
- tapOn:
    text: "Vetar"
    childOf:
      id: confirm-sheet
- extendedWaitUntil:
    visible: "Deshacer"
    timeout: 5000
- takeScreenshot: 07-calendario-16-veto-red-aviso
- extendedWaitUntil:
    notVisible: "Deshacer"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Invitar a Camila Ortiz \\(sin nota\\)"
    timeout: 20000
- assertVisible: "Reacción Celebro al post de Ana Lucía Torres"
- takeScreenshot: 07-calendario-17-veto-red-enviado

# Vetar the reaction, and «Deshacer» at once: nothing is sent and it stays in the queue.
- tapOn:
    text: "Vetar"
    childOf:
      id: "en-cola-.*"
      containsDescendants:
        - text: "Reacción Celebro al post de Ana Lucía Torres"
- extendedWaitUntil:
    visible:
      id: confirm-sheet
    timeout: 10000
- assertVisible:
    text: "La acción no saldrá. Queda registrada con tu nota."
    childOf:
      id: confirm-sheet
- tapOn:
    id: confirm-note
- inputText: "QA: deshacer"
- hideKeyboard
- tapOn:
    text: "Vetar"
    childOf:
      id: confirm-sheet
- extendedWaitUntil:
    visible: "Deshacer"
    timeout: 5000
- tapOn: "Deshacer"
- extendedWaitUntil:
    visible: "Veto deshecho"
    timeout: 5000
- assertVisible: "Reacción Celebro al post de Ana Lucía Torres"
- takeScreenshot: 07-calendario-18-veto-accion-deshecho

# ---------------------------------------------------------------- Lista: «Lo que pasó»
# cubre: CAL-05
- scrollUntilVisible:
    element:
      text: "LO QUE PASÓ"
    direction: DOWN
    centerElement: true
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "actividad-.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: 07-calendario-19-lista-actividad
- scrollUntilVisible:
    element:
      text: "LO QUE PASÓ"
    direction: UP
    centerElement: true
    timeout: 20000
# «Red»: only the network («Seguiste a…», «Invitaste a… (sin nota)», «Aceptaste la invitación de…»). The chips scroll
# sideways: «Red» is the last one.
- swipe:
    from:
      text: "Comentarios"
    direction: LEFT
- tapOn:
    text: "Red"
    below:
      text: "LO QUE PASÓ"
- scrollUntilVisible:
    element:
      text: "(Seguiste a|Invitaste a|Aceptaste la invitación de) .*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertNotVisible: "Comentaste en el post de .*"
- assertNotVisible: "Invitaste a Camila Ortiz \\(sin nota\\)"
- takeScreenshot: 07-calendario-20-lista-red
# «Mostrar lo que no salió»: the vetoed invitation appears, «Vetada por ti».
- scrollUntilVisible:
    element:
      id: no-salio
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    id: no-salio
- scrollUntilVisible:
    element:
      text: "Invitaste a Camila Ortiz \\(sin nota\\)"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "VETADA POR TI"
- takeScreenshot: 07-calendario-21-lista-no-salio

# ---------------------------------------------------------------- the veto note says it is required
# cubre: CAL-13
# «Vetar» stays off until there is a note: the field says so, as in the PWA («Nota · obligatoria»).
- scrollUntilVisible:
    element:
      text: "Reacción Celebro al post de Ana Lucía Torres"
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    text: "Vetar"
    childOf:
      id: "en-cola-.*"
      containsDescendants:
        - text: "Reacción Celebro al post de Ana Lucía Torres"
- extendedWaitUntil:
    visible:
      id: confirm-sheet
    timeout: 10000
- takeScreenshot: 07-calendario-22-veto-nota-obligatoria
- assertVisible:
    text: "Nota · obligatoria"
    childOf:
      id: confirm-sheet
- tapOn:
    text: "Cancelar"
    childOf:
      id: confirm-sheet
- extendedWaitUntil:
    notVisible:
      id: confirm-sheet
    timeout: 10000
- assertVisible: "Reacción Celebro al post de Ana Lucía Torres"
