# cubre: OFI-01, OFI-02, OFI-03, OFI-04, OFI-06, OFI-07, OFI-10
# Oficina: the scene fills the screen, with the game room under El Barrio where the free agents rest (Gustavo, 11/11); a
# tap on a character of the Skia scene opens its sheet (SnapSheet); the inbox agent, from its team, shows its real state
# (not «en diseño») and what it did this session; the sheet is dragged to full and down to close; a zone's label opens its
# team, a member of it, «Ver en el Calendario» and the library; Android back closes the sheet without leaving the Oficina;
# the scene survives a drag and a double tap; pull down from its top to refresh; nothing over the scene but the error
# notes (no legend, activity age, team strip, map link or art credit: Gustavo, 11/11); and a machine stopped elsewhere
# darkens the scene and shows the pause banner, which leads to Ajustes.
appId: co.projectapp.office
name: Oficina
tags: [oficina]
---
- runFlow: comun/entrar.yaml
- extendedWaitUntil:
    notVisible:
      id: login
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: office-scene
    timeout: 30000
- assertVisible:
    id: tab-index
    selected: true
- assertVisible: "La oficina en pixel art\\..*"
- assertNotVisible: "Mapa del equipo"

# cubre: OFI-01.11, OFI-06.1 — the free agents rest in the game room under El Barrio; with nobody working the camera opens
# there, and a drag up brings it into view in any case.
- swipe:
    from:
      id: office-scene
    direction: UP
    duration: 600
- takeScreenshot: 03-oficina-01-sala-de-juegos
# The double tap goes to the wall at the top of the screen: back to the top of the office, every label on screen.
- doubleTapOn:
    id: office-scene
    point: "50%,2%"
- assertVisible:
    id: zone-label-estrategia
    selected: false
- takeScreenshot: 03-oficina-01b-escena

# ---------------------------------------------------------------- a character in the scene
# cubre: OFI-02, OFI-04.2, OFI-06.4
# The canvas has no views per character, so the tap goes to a point of `office-scene` (absolute px inside the
# element, Maestro's element-relative point). On the 390 dp screen at 2x (320 dpi) the plan (192x452 logical px) fills
# the width: 390 / 192 = 2.03125 dp per logical px, no margin, no vertical offset at the top of the office (the double tap
# above). The target is Operación, a service that never leaves its post for the game room, standing at logical (96, 58):
# hitScene takes x 84..108, y 30..60 (a 48 dp touch target), above its zone label (79, 64). No seeded event moves it
# (old events are only narrated). Logical (96, 45) -> dp (195, 91.4) -> px (390, 183).
- tapOn:
    id: office-scene
    point: "390,183"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: office-panel
    timeout: 15000
- extendedWaitUntil:
    visible: "SERVICIO · OPERACIÓN"
    timeout: 10000
- assertVisible: "Operador de cuenta"
- assertVisible: "MISIÓN"
- takeScreenshot: 03-oficina-02-ficha-operacion
- back
- extendedWaitUntil:
    notVisible:
      id: office-panel
    timeout: 10000

# The inbox agent rests in the game room like the rest of its team: it opens from the Relaciones label, as a member.
- tapOn:
    id: zone-label-relaciones
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "ESPACIO DEL EQUIPO"
    timeout: 15000
- swipe:
    from:
      text: Altura del panel
    direction: UP
    duration: 600
- extendedWaitUntil:
    visible:
      text: "Conversaciones e inbox, .*"
      above:
        id: tab-index
    timeout: 10000
- tapOn:
    text: "Conversaciones e inbox, .*"
    above:
      id: tab-index
- extendedWaitUntil:
    visible: "MISIÓN"
    timeout: 10000
- assertVisible: "AGENTE · RELACIONES"
- assertVisible: "Conversaciones e inbox"
- assertVisible: "Mensajes directos y conversaciones privadas\\."
- assertVisible: "ESTADO REAL"
# cubre: OFI-01.4, OFI-01.5 — the inbox agent reads the inbox (read_inbox): it is not «en diseño», and its real state
# says what it did last (seed_qa: a read_inbox job an hour ago)
- assertNotVisible: "Este rol está en diseño\\..*"
- assertVisible: "En espera · Último: leyendo el inbox de linkedin .*"
- assertVisible: Altura del panel
- takeScreenshot: 03-oficina-02b-ficha-inbox

# Drag the handle up: the sheet goes from the half snap to the full one. At half, «Ver en el Calendario» sits
# below the top of the bottom bar (or off screen); at full it is well above it.
- swipe:
    from:
      text: Altura del panel
    direction: UP
    duration: 600
- extendedWaitUntil:
    visible:
      text: Ver en el Calendario
      above:
        id: tab-index
    timeout: 10000
- assertVisible: "LO ÚLTIMO QUE HIZO"
# cubre: OFI-03 — background work hands off in the scene too: the inbox reading of a few minutes ago (seed_qa), summarized
# because it is older than two minutes, is in «Lo último que hizo»
- assertVisible: "Conversaciones entrega su trabajo: .1 conversación te toca."
- assertVisible: "Ver su equipo · Relaciones"
- takeScreenshot: 03-oficina-03-ficha-ampliada

# Drag the handle down to the bottom of the screen: the sheet closes.
- swipe:
    from:
      text: Altura del panel
    direction: DOWN
    duration: 500
- extendedWaitUntil:
    notVisible:
      id: office-panel
    timeout: 10000
- assertNotVisible: "MISIÓN"
- takeScreenshot: 03-oficina-04-ficha-cerrada

# ---------------------------------------------------------------- the machine stopped elsewhere
# cubre: OFI-07.1, OFI-07.5 — the banner «Máquina en pausa · <motivo>» in the views, the scene darkened and still. The
# zone labels and the library run with the machine stopped: the still scene does not redraw, so the emulator's software
# GPU answers each step in a fraction of a second instead of several seconds (the character above needed it running).
- runScript:
    file: comun/qa-api.js
    env:
      ACCION: pausar
      QA_USER: ${QA_USER}
      QA_PASSWORD: ${QA_PASSWORD}
- extendedWaitUntil:
    visible: "Máquina en pausa · Pausa de la QA"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: oficina-pausa
    timeout: 20000
- takeScreenshot: 03-oficina-04b-maquina-en-pausa

# ---------------------------------------------------------------- a zone's label opens its team
# cubre: OFI-04 — the label sits over the scene (its touch reaches the scene's tap, which hit-tests the labels first)
- tapOn:
    id: zone-label-estrategia
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: office-panel
    timeout: 15000
- extendedWaitUntil:
    visible: "ESPACIO DEL EQUIPO"
    timeout: 10000
- assertVisible: "Estrategia y perfil"
- assertVisible: "Encontrar tu posición y hacer que tu perfil la comunique\\."
- assertVisible: "2 INTEGRANTES · LOS ESCRITORIOS COMPARTIDOS"
- assertVisible:
    id: zone-label-estrategia
    selected: true
- takeScreenshot: 03-oficina-05-equipo

# The members sit low in the panel: at full height both rows are clear of the bottom bar.
- swipe:
    from:
      text: Altura del panel
    direction: UP
    duration: 600
- extendedWaitUntil:
    visible:
      text: "Perfil, .*"
      above:
        id: tab-index
    timeout: 10000
- assertVisible: "Posicionamiento, .*"
- tapOn: "Perfil, .*"
- extendedWaitUntil:
    visible: "Titular, presentación y claridad del perfil, coherentes con el posicionamiento\\."
    timeout: 10000
- assertVisible: "AGENTE · ESTRATEGIA Y PERFIL"
- assertNotVisible: "ESPACIO DEL EQUIPO"
- takeScreenshot: 03-oficina-06-integrante

# cubre: OFI-04.5 — «Ver en el Calendario» opens the Calendario; back returns to the Oficina, the panel still open
- scrollUntilVisible:
    element: Ver en el Calendario
    direction: DOWN
- tapOn: Ver en el Calendario
- extendedWaitUntil:
    visible:
      id: calendario
    timeout: 20000
- assertVisible:
    id: top-calendario
    selected: true
- takeScreenshot: 03-oficina-06b-calendario
- back
- extendedWaitUntil:
    visible:
      id: screen-oficina
    timeout: 20000
- assertVisible:
    id: office-panel
- assertVisible:
    id: tab-index
    selected: true

# Android back closes it (no visible «Cerrar») and the label is no longer selected.
- back
- extendedWaitUntil:
    notVisible:
      id: office-panel
    timeout: 10000
- assertVisible:
    id: zone-label-estrategia
    selected: false

# cubre: OFI-10 — the fourth editorial member opens its mission. Opening a panel pans the scene to its zone and closing it
# leaves the scene there: a double tap on the wall at the top brings it back, so every label is on screen again.
- doubleTapOn:
    id: office-scene
    point: "50%,2%"
- tapOn:
    id: zone-label-editorial
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "4 INTEGRANTES · LA MESA LARGA"
    timeout: 15000
- swipe:
    from:
      text: Altura del panel
    direction: UP
    duration: 600
- scrollUntilVisible:
    element:
      text: "Editor visual, .*"
      above:
        id: tab-index
    direction: DOWN
    centerElement: true
- tapOn:
    text: "Editor visual, .*"
    above:
      id: tab-index
- extendedWaitUntil:
    visible: "AGENTE · MESA EDITORIAL"
    timeout: 10000
- assertVisible: "Propone y prepara la foto, infografía o carrusel de la pieza; el director decide\\."
- assertNotVisible: "Este rol está en diseño\\..*"
# The team map is gone: the agent has no link to it.
- assertNotVisible: Ver definición y conexiones
- takeScreenshot: 03-oficina-06c-editor-visual
- back
- extendedWaitUntil:
    notVisible:
      id: office-panel
    timeout: 10000

# The library, from its label, with the scene back in place.
- doubleTapOn:
    id: office-scene
    point: "50%,2%"
- tapOn:
    id: zone-label-biblioteca
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: office-panel
    timeout: 15000
- extendedWaitUntil:
    visible: "SERVICIO · BIBLIOTECA"
    timeout: 10000
- assertVisible: "Bibliotecario"
- assertVisible: "Es un servicio de software, no un agente de IA: la búsqueda en la base de conocimiento\\..*"
- assertVisible:
    id: zone-label-biblioteca
    selected: true
- takeScreenshot: 03-oficina-07-biblioteca

# Android back closes the sheet and stays in the Oficina.
- back
- extendedWaitUntil:
    notVisible:
      id: office-panel
    timeout: 10000
- assertVisible:
    id: screen-oficina
- assertVisible:
    id: tab-index
    selected: true
- assertVisible:
    id: zone-label-biblioteca
    selected: false
- takeScreenshot: 03-oficina-08-atras-cierra

# The banner leads to Ajustes › Máquina; once resumed, it goes (OFI-07.3).
- tapOn: "Máquina en pausa · Pausa de la QA"
- extendedWaitUntil:
    visible:
      id: screen-ajustes
    timeout: 20000
- assertVisible:
    id: top-ajustes
    selected: true
- assertVisible: "Máquina en pausa · Pausa de la QA"
- takeScreenshot: 03-oficina-08b-pausa-en-ajustes
- runScript:
    file: comun/qa-api.js
    env:
      ACCION: reanudar
      QA_USER: ${QA_USER}
      QA_PASSWORD: ${QA_PASSWORD}
- extendedWaitUntil:
    notVisible: "Máquina en pausa · Pausa de la QA"
    timeout: 60000
# Back to the Oficina for the gestures and what is under the scene.
- tapOn:
    id: tab-index
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: office-scene
    timeout: 20000

# ---------------------------------------------------------------- gestures on the scene
# cubre: OFI-06.1, OFI-06.2 — a drag moves the office and a double tap brings it back; neither closes the app (the
# spring configs once built inside the gesture worklets did)
- swipe:
    from:
      id: office-scene
    direction: UP
    duration: 600
# The double tap goes to the wall at the top of the screen: the office back at its top.
- doubleTapOn:
    id: office-scene
    point: "50%,2%"
- assertVisible:
    id: office-scene
- assertNotVisible:
    id: office-panel
# cubre: OFI-06.3 — the scene fills the screen: pulling it down from the top of the office asks for the activity and the
# events again (the plan gives a little under the finger and springs back)
- swipe:
    from:
      id: office-scene
    direction: DOWN
    duration: 600
- assertVisible:
    id: screen-oficina
- assertNotVisible:
    id: office-panel

# cubre: OFI-01.8 — over the scene only the error notes: no legend, activity age, team strip, map link or art credit
- assertNotVisible: "Actividad real · .*"
- assertNotVisible: Trabajando
- assertNotVisible: En espera
- assertNotVisible: "Mapa del equipo"
- assertNotVisible: "Arte: LimeZu.*"
- assertNotVisible:
    id: team-strip
- takeScreenshot: 03-oficina-09-bajo-la-escena
