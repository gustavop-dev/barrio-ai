# Ajustes: every section top to bottom (its heading on screen), Autonomía y límites unfolded, one push type
# switched off in Notificaciones, the devices list (the seeded «Pixel 7 de Gustavo (QA)» and this phone), and
# finally «Cerrar sesión», which lands on the login. This flow runs last, so signing out is fine.
# Section headings are etiquetas (drawn UPPERCASE); text matching is case-insensitive anyway.
appId: co.projectapp.office
name: Ajustes
tags: [ajustes]
---
- runFlow: comun/entrar.yaml
- tapOn:
    id: top-ajustes
- extendedWaitUntil:
    visible:
      id: screen-ajustes
    timeout: 20000
- assertVisible:
    id: top-ajustes
    selected: true

# ---------------------------------------------------------------- Máquina (not paused in the seed)
- extendedWaitUntil:
    visible: "MÁQUINA"
    timeout: 20000
- extendedWaitUntil:
    visible: "La máquina está en marcha\\..*"
    timeout: 20000
- assertVisible: Parada total
- takeScreenshot: 11-ajustes-01-maquina

# ---------------------------------------------------------------- Orientación para el equipo
- scrollUntilVisible:
    element:
      text: "ORIENTACIÓN PARA EL EQUIPO"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: orientacion-field
    direction: DOWN
    timeout: 30000
- takeScreenshot: 11-ajustes-02-orientacion

# ---------------------------------------------------------------- Autonomía y límites (folded)
- scrollUntilVisible:
    element:
      text: "Autonomía y límites"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertNotVisible: "VENTANA HORARIA"
- tapOn: "Autonomía y límites"
- scrollUntilVisible:
    element:
      text: "VENTANA HORARIA"
    direction: DOWN
    timeout: 30000
# OPERATOR_WINDOW is 00:00-23:59 in America/Bogota (a key/value row is labelled «Horario: …»).
- scrollUntilVisible:
    element:
      text: "Horario: 00:00.23:59 · America/Bogota"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "TOPES DE HOY"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 11-ajustes-03-autonomia

# ---------------------------------------------------------------- Gasto, LinkedIn oficial, Captura y galería
- scrollUntilVisible:
    element:
      text: "GASTO DE IA · HOY"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 11-ajustes-04-gasto
- scrollUntilVisible:
    element:
      text: "LINKEDIN OFICIAL · PUBLICACIÓN"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 11-ajustes-05-linkedin
- scrollUntilVisible:
    element:
      text: "CAPTURA Y GALERÍA"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "El equipo puede editar mis fotos con IA"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 11-ajustes-06-captura

# ---------------------------------------------------------------- Notificaciones: one push type off
# The heading is looked up inside its own section: the top bar's bell is also labelled «Notificaciones».
- scrollUntilVisible:
    element:
      text: "NOTIFICACIONES"
      childOf:
        id: ajustes-notificaciones
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Este dispositivo"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Por tipo de notificación"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertNotVisible:
    id: push-question
- tapOn: "Por tipo de notificación"
- scrollUntilVisible:
    element:
      id: push-question
    direction: DOWN
    centerElement: true
    timeout: 30000
# «Pregunta nueva del equipo» pushes by default (push_disabled is empty in the seed).
- assertVisible:
    id: push-question
    text: Pregunta nueva del equipo
    checked: true
- takeScreenshot: 11-ajustes-07-tipos-de-push
- tapOn:
    id: push-question
- extendedWaitUntil:
    visible: "Push apagada: Pregunta nueva del equipo\\."
    timeout: 15000
- assertVisible:
    id: push-question
    checked: false
- takeScreenshot: 11-ajustes-08-push-apagada

# ---------------------------------------------------------------- Dispositivos con la app
- scrollUntilVisible:
    element:
      text: "DISPOSITIVOS CON LA APP"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Pixel 7 de Gustavo \\(QA\\)"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Cerrar la sesión de Pixel 7 de Gustavo \\(QA\\)"
# This phone: its row has the «Este» badge and its own revoke label.
- assertVisible: "Cerrar la sesión de este teléfono"
- assertVisible: "ESTE"
- takeScreenshot: 11-ajustes-09-dispositivos

# ---------------------------------------------------------------- Lo que el equipo sabe de ti
- scrollUntilVisible:
    element:
      id: sabe-link
    direction: DOWN
    timeout: 30000
- assertVisible: "Lo que el equipo sabe de ti\\. 3 datos confirmados"
- takeScreenshot: 11-ajustes-10-sabe

# ---------------------------------------------------------------- Sesión y Acerca de: sign out
- scrollUntilVisible:
    element:
      text: "SESIÓN Y ACERCA DE"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: logout
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Has entrado como qa\\."
- assertVisible: "Versión: app .*"
- takeScreenshot: 11-ajustes-11-sesion
- tapOn:
    id: logout
- extendedWaitUntil:
    visible:
      id: confirm-sheet
    timeout: 15000
- assertVisible: "Este teléfono deja de recibir avisos y olvida su acceso\\..*"
- takeScreenshot: 11-ajustes-12-confirmar-salida
# Inside the sheet «Cerrar sesión» is both the title and the action; sorted top to bottom, the action is second.
- tapOn:
    text: Cerrar sesión
    childOf:
      id: confirm-sheet
    index: 1
- extendedWaitUntil:
    visible:
      id: login
    timeout: 30000
- assertVisible:
    id: login-usuario
- assertVisible: Entrar
- assertNotVisible:
    id: screen-ajustes
- takeScreenshot: 11-ajustes-13-login
