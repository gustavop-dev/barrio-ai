# cubre: AJU-01, AJU-02, AJU-03, AJU-04, AJU-05, AJU-06, AJU-07, AJU-08, AJU-09, AJU-11, OFI-07, IMG-16
# Ajustes, opened from the top bar, from Máquina to Captura y galería (Notificaciones, devices, «Lo que el equipo sabe
# de ti», the section links and the session are in 15-ajustes-sesion): «Parada total» with its required reason, a
# first try that fails (failure switch) and a second that stops the machine, the banner and «Reanudar»; pausing and resuming the simulated Unipile account; the orientation («Descartar cambios»,
# then «Guardar orientación»); Autonomía y límites unfolded; Gasto de IA; LinkedIn oficial and «Conectar LinkedIn»,
# which opens the office web in the phone's browser and refreshes on return; the microphone and the AI edit default,
# off and on, and back on when saving fails. Everything it changes is undone or re-seeded before the next flow (scripts/qa/correr-maestro.sh runs
# seed_qa). Maestro matches text case-insensitively: section labels and badges are drawn UPPERCASE.
appId: co.projectapp.office
name: Ajustes
tags: [ajustes]
---
- runFlow: comun/entrar.yaml
- tapOn:
    id: top-ajustes
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: screen-ajustes
    timeout: 20000
# cubre: AJU-11
- assertVisible:
    id: top-ajustes
    selected: true

# ---------------------------------------------------------------- Máquina: «Parada total» and «Reanudar»
# cubre: AJU-01
- extendedWaitUntil:
    visible: "MÁQUINA"
    timeout: 20000
- extendedWaitUntil:
    visible: "La máquina está en marcha\\. Observa, redacta y actúa dentro de los topes\\."
    timeout: 20000
- assertVisible: "En marcha"
- assertVisible: "Parada total"
- takeScreenshot: 11-ajustes-01-maquina
- tapOn: "Parada total"
- extendedWaitUntil:
    visible:
      id: confirm-sheet
    timeout: 15000
- assertVisible:
    text: "Se detiene todo el ciclo y ninguna acción se ejecuta hasta que la reanudes\\."
    childOf:
      id: confirm-sheet
# The reason is required.
- assertVisible:
    text: "Detener la máquina"
    childOf:
      id: confirm-sheet
    enabled: false
- tapOn:
    id: confirm-note
- inputText: "Pausa de QA para revisar los topes"
# What Gustavo sees while typing: the reason and the sheet's buttons above the keyboard.
- takeScreenshot: 11-ajustes-02b-motivo-con-teclado
- hideKeyboard
- takeScreenshot: 11-ajustes-02-parada-motivo
# The first try fails (failure switch, comun/qa-fallo.js): the sheet stays open with the reason; the second goes through.
- runScript:
    file: comun/qa-fallo.js
    env:
      RUTA: '^/api/v1/operador/control$'
      METODO: POST
      EFECTO: '500'
- tapOn:
    text: "Detener la máquina"
    childOf:
      id: confirm-sheet
    enabled: true
- extendedWaitUntil:
    visible:
      text: "Fallo simulado por QA \\(500\\)\\."
      childOf:
        id: confirm-sheet
    timeout: 15000
- assertVisible:
    id: confirm-sheet
- takeScreenshot: 11-ajustes-03-parada-fallida
- tapOn:
    text: "Detener la máquina"
    childOf:
      id: confirm-sheet
    enabled: true
- extendedWaitUntil:
    notVisible:
      id: confirm-sheet
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Máquina detenida\\."
      childOf:
        id: toast
    timeout: 15000
- extendedWaitUntil:
    visible: "Detenida"
    timeout: 15000
- assertVisible: "Motivo: Pausa de QA para revisar los topes\\."
- assertVisible: "Origen: Desde la app"
- assertVisible: "Quién: qa"
# Every view shows the pause under the top bar (OFI-07); it goes away once the machine runs again.
- extendedWaitUntil:
    visible: "Máquina en pausa · Pausa de QA para revisar los topes"
    timeout: 20000
- takeScreenshot: 11-ajustes-04-detenida
- tapOn: "Reanudar"
- extendedWaitUntil:
    visible:
      id: confirm-sheet
    timeout: 15000
- assertVisible:
    text: "¿Reanudar la máquina\\?"
    childOf:
      id: confirm-sheet
- tapOn:
    text: "Reanudar"
    childOf:
      id: confirm-sheet
- extendedWaitUntil:
    notVisible:
      id: confirm-sheet
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Máquina en marcha\\."
      childOf:
        id: toast
    timeout: 15000
- extendedWaitUntil:
    visible: "En marcha"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Máquina en pausa.*"
    timeout: 20000
- takeScreenshot: 11-ajustes-05-en-marcha

# ---------------------------------------------------------------- Máquina: pause only the Unipile account
# cubre: AJU-02
- scrollUntilVisible:
    element:
      text: "Pausar solo esta cuenta: LinkedIn de Gustavo \\(simulado\\)"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "LinkedIn de Gustavo \\(simulado\\) \\(simulada\\)"
- assertVisible: "Conectada"
- assertVisible: "Comprobada hace .*"
- tapOn: "Pausar solo esta cuenta: LinkedIn de Gustavo \\(simulado\\)"
- extendedWaitUntil:
    visible:
      id: confirm-sheet
    timeout: 15000
- assertVisible:
    text: "Pausar la cuenta"
    childOf:
      id: confirm-sheet
    enabled: false
- tapOn:
    id: confirm-note
- inputText: "Reviso la cuenta de QA"
- hideKeyboard
- tapOn:
    text: "Pausar la cuenta"
    childOf:
      id: confirm-sheet
    enabled: true
- extendedWaitUntil:
    notVisible:
      id: confirm-sheet
    timeout: 15000
- extendedWaitUntil:
    visible:
      text: "Cuenta en pausa\\."
      childOf:
        id: toast
    timeout: 15000
- extendedWaitUntil:
    visible: "En pausa"
    timeout: 15000
- assertVisible: "Reviso la cuenta de QA"
# The banner under the top bar names the account's pause too (OFI-07).
- extendedWaitUntil:
    visible: "La cuenta de LinkedIn está en pausa · Reviso la cuenta de QA"
    timeout: 20000
- takeScreenshot: 11-ajustes-06-cuenta-en-pausa
- scrollUntilVisible:
    element:
      text: "Reanudar la cuenta"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Reanudar la cuenta"
- extendedWaitUntil:
    visible:
      text: "Cuenta reanudada\\."
      childOf:
        id: toast
    timeout: 15000
- extendedWaitUntil:
    visible: "Pausar solo esta cuenta: LinkedIn de Gustavo \\(simulado\\)"
    timeout: 15000
- assertNotVisible: "En pausa"
- extendedWaitUntil:
    notVisible: "La cuenta de LinkedIn está en pausa.*"
    timeout: 20000

# ---------------------------------------------------------------- Orientación para el equipo
# cubre: AJU-03
- scrollUntilVisible:
    element:
      text: "ORIENTACIÓN PARA EL EQUIPO"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: orientacion-field
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: orientacion-field
    text: "Habla a fundadores de startups latinoamericanas en etapa temprana\\. Evita el tono de vendedor\\."
- assertVisible: "\\d+ de 4000 caracteres\\. Es privada: orienta las decisiones y nunca aparece en un texto público\\."
# Older than a week, the date is written out («Actualizada 27/10/2026, 4:57 a. m. por qa.»).
- assertVisible: "Actualizada .* por qa\\."
- assertVisible:
    text: "Guardar orientación"
    enabled: false
- takeScreenshot: 11-ajustes-07-orientacion
# A change can be discarded… (a tap puts the cursor where it lands, so the flow adds words instead of replacing them)
- tapOn:
    id: orientacion-field
- inputText: " Prioriza casos de ProjectApp esta semana "
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Descartar cambios"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Descartar cambios"
- extendedWaitUntil:
    visible:
      id: orientacion-field
      text: "Habla a fundadores de startups latinoamericanas en etapa temprana\\. Evita el tono de vendedor\\."
    timeout: 10000
- assertNotVisible: "Descartar cambios"
# …or saved.
- tapOn:
    id: orientacion-field
- inputText: " Prioriza casos de ProjectApp esta semana "
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Guardar orientación"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Guardar orientación"
- extendedWaitUntil:
    visible:
      text: "Orientación guardada\\. El equipo la usa desde su próxima tarea\\."
      childOf:
        id: toast
    timeout: 15000
- assertVisible:
    id: orientacion-field
    text: ".*Prioriza casos de ProjectApp esta semana.*"
- extendedWaitUntil:
    visible: "Actualizada hace .* por qa\\."
    timeout: 15000
- assertNotVisible: "Descartar cambios"
- takeScreenshot: 11-ajustes-08-orientacion-guardada

# ---------------------------------------------------------------- Autonomía y límites (folded)
# cubre: AJU-04
- scrollUntilVisible:
    element:
      text: "Autonomía y límites"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertNotVisible: "VENTANA HORARIA"
- tapOn: "Autonomía y límites"
- scrollUntilVisible:
    element:
      text: "MODO POR CAPACIDAD · SOLO LECTURA"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "El equipo actúa solo en modo Auto\\..*"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "VENTANA HORARIA"
    direction: DOWN
    timeout: 30000
# OPERATOR_WINDOW is 00:00-23:59 in America/Bogota (a key/value row is labelled «Horario: …»).
# Centred: Maestro counts a row under the bottom bar as visible, and how far one swipe scrolls varies with the fling,
# so «Ahora» (the next row) may still be below the screen (QA 42494671507).
- scrollUntilVisible:
    element:
      text: "Horario: 00:00.23:59 · America/Bogota"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Ahora: Abierta"
- scrollUntilVisible:
    element:
      text: "TOPES DE HOY"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 11-ajustes-09-autonomia
- scrollUntilVisible:
    element:
      text: "LECTURAS DE LA RED"
    direction: DOWN
    timeout: 30000

# ---------------------------------------------------------------- Gasto de IA
# cubre: AJU-05
- scrollUntilVisible:
    element:
      text: "GASTO DE IA · HOY"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "General \\(comentarios\\)"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Editorial \\(incluye imágenes e investigación de piezas\\)"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Editorial \\(incluye imágenes e investigación de piezas\\)"
# The list runs under the floating tab bar: the last row is centred so the ones above it are really on screen.
- scrollUntilVisible:
    element:
      text: "Transcripción de audios, este mes: .* USD"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Este mes: .* USD de .* USD"
- assertVisible: "Desde el inicio: .* USD"
- assertVisible: "Agente líder, este mes: .* USD"
- takeScreenshot: 11-ajustes-10-gasto

# ---------------------------------------------------------------- LinkedIn oficial: «Conectar LinkedIn» opens the office web
# cubre: AJU-06, AJU-07
- scrollUntilVisible:
    element:
      text: "LINKEDIN OFICIAL · PUBLICACIÓN"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Sin conectar"
    direction: DOWN
    timeout: 30000
- assertVisible: "La publicación real está desactivada en el servidor \\(LIVE_LINKEDIN_OFFICIAL=false\\).*"
- scrollUntilVisible:
    element:
      text: "Versión de la API: .*"
    direction: DOWN
    timeout: 30000
# The QA workflow configures a placeholder LinkedIn app (LINKEDIN_CLIENT_ID…), so the button shows. Nothing reaches
# LinkedIn: the app only opens the office web (/ajustes#linkedin on the QA server) in the phone's browser.
- scrollUntilVisible:
    element:
      text: "Conectar LinkedIn"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Se abre la oficina web dentro de la app.*"
- takeScreenshot: 11-ajustes-11-linkedin
- tapOn: "Conectar LinkedIn"
- extendedWaitUntil:
    notVisible:
      id: screen-ajustes
    timeout: 30000
# A fresh emulator shows Chrome's first-run screen first: past it, the office web loads from the QA server.
- runFlow:
    when:
      visible: "Use without an account|Usar sin una cuenta"
    commands:
      - tapOn: "Use without an account|Usar sin una cuenta"
- assertVisible:
    text: ".*10\\.0\\.2\\.2.*"
    optional: true
- takeScreenshot: 11-ajustes-12-oficina-web
# Back from the browser, the app refreshes the status.
- repeat:
    times: 4
    while:
      notVisible:
        id: screen-ajustes
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: screen-ajustes
    timeout: 20000
- extendedWaitUntil:
    visible: "Conectar LinkedIn"
    timeout: 20000
- assertNotVisible: "Esperando a que vuelvas…"
- scrollUntilVisible:
    element:
      text: "Sin conectar"
      childOf:
        id: ajustes-linkedin
    direction: UP
    centerElement: true
    timeout: 30000
- assertVisible: "Sin conectar"
- takeScreenshot: 11-ajustes-12b-linkedin-al-volver

# ---------------------------------------------------------------- Captura y galería
# cubre: AJU-08, AJU-09
- scrollUntilVisible:
    element:
      text: "CAPTURA Y GALERÍA"
    direction: DOWN
    timeout: 30000
# The QA install grants every permission (adb install -g).
- scrollUntilVisible:
    element:
      text: "Se usa solo mientras mantienes el botón aguamarina o grabas desde la hoja de captura\\."
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Permitido"
- scrollUntilVisible:
    element:
      id: default-ai-auto
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: default-ai-auto
    checked: true
- takeScreenshot: 11-ajustes-13-captura
- tapOn:
    id: default-ai-no
- extendedWaitUntil:
    visible:
      text: "Edición con IA guardada para las fotos nuevas\\."
      childOf:
        id: toast
    timeout: 15000
- assertVisible:
    id: default-ai-no
    checked: true
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 15000
- tapOn:
    id: default-ai-auto
- extendedWaitUntil:
    visible:
      text: "Edición con IA guardada para las fotos nuevas\\."
      childOf:
        id: toast
    timeout: 15000
- assertVisible:
    id: default-ai-auto
    checked: true
# A failed save puts the switch back and says why (failure switch).
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 15000
- runScript:
    file: comun/qa-fallo.js
    env:
      RUTA: '^/api/v1/ajustes/preferencias$'
      METODO: PATCH
      EFECTO: '500'
- tapOn:
    id: default-ai-no
- extendedWaitUntil:
    visible:
      text: "Fallo simulado por QA \\(500\\)\\."
      childOf:
        id: toast
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: default-ai-auto
      checked: true
    timeout: 10000
- takeScreenshot: 11-ajustes-14-captura-error
