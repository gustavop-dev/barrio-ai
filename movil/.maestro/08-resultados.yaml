# cubre: RES-01, RES-02, RES-03, RES-04, RES-05, RES-06, RES-07, SEM-05, SEM-06, CAL-07
# Resultados. The weekly summary: the analyst's lists, warnings and proposed orientation, the previous weeks fold,
# «Usar como orientación» then «Deshacer» and «Descartar» then «Deshacer» (the card says what was decided, and the
# buttons come back). «Periodo» 7 / 90 / 28 días: the period note and the impressions chart change with it (28 días has
# the posts of T-8 and T-3, 7 días only T-3). The chart's ⓘ opens its definition, and a bar opens its piece. Then
# «Modalidad» (sections 3 and 4 say they are not split), the section chips, each section's figures, a missing figure
# as «—» with its reason (never 0), an active opportunity opening its person, the posts with a missing cut as «—», the
# best post opening its piece, and the team's comments with the replies not measured yet.
# Text in the «etiqueta» style (section labels, badges) is uppercased on screen, so it is written in capitals here.
appId: co.projectapp.office
name: Resultados
tags: [resultados]
---
- runFlow: comun/entrar.yaml
- tapOn:
    id: tab-resultados
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: resultados-list
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: resumen-semanal
    timeout: 20000
- assertVisible:
    text: "RESUMEN DE LA SEMANA"
- scrollUntilVisible:
    element:
      text: "LO QUE FUNCIONÓ"
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: 08-resultados-01-resumen
- scrollUntilVisible:
    element:
      text: "• Pocos datos: 2 de 3 posts con corte de 72 h\\."
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Advertencias"

# ---------------------------------------------------------------- the weekly summary
# cubre: SEM-05, SEM-06
- scrollUntilVisible:
    element:
      text: "Prioriza posts sobre cómo validar un MVP.*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    text: "ORIENTACIÓN PROPUESTA"
- assertVisible:
    id: resumen-usar
- takeScreenshot: 08-resultados-02-orientacion
# The previous week, folded: it was used as the orientation.
- scrollUntilVisible:
    element:
      text: "Ver semanas anteriores · \\d+"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: "Ver semanas anteriores · \\d+"
- extendedWaitUntil:
    visible:
      text: "USADO COMO ORIENTACIÓN"
    timeout: 10000
- takeScreenshot: 08-resultados-03-semanas-anteriores
- tapOn:
    text: "Ver semanas anteriores · \\d+"
- extendedWaitUntil:
    notVisible:
      text: "USADO COMO ORIENTACIÓN"
    timeout: 10000

# «Usar como orientación»: the toast offers «Deshacer» for 5 s and the card already says it was used; undo at once.
# Let the decision taps settle normally and shorten settling only for «Deshacer». Match the visible decision text
# directly, as before, without depending on the partly off-screen summary wrapper. Check the toast's message in the
# undo selector, avoiding a separate hierarchy read before the deadline. «Deshecho» lasts 4 s and may be missed by
# Maestro; both enabled buttons returning and the decided sentence disappearing are mandatory.
- scrollUntilVisible:
    element:
      id: resumen-usar
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    id: resumen-usar
    enabled: true
- extendedWaitUntil:
    visible:
      text: "La usaste como orientación del equipo.*"
    timeout: 15000
- tapOn:
    text: "Deshacer"
    childOf:
      id: toast
      containsDescendants:
        - text: "Orientación actualizada.*"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      text: "Deshecho"
      childOf:
        id: toast
    timeout: 2000
    optional: true
- extendedWaitUntil:
    visible:
      id: resumen-usar
      enabled: true
    timeout: 10000
- assertVisible:
    id: resumen-descartar
    enabled: true
- assertNotVisible:
    text: "La usaste como orientación del equipo.*"
- takeScreenshot: 08-resultados-04-orientacion-deshecha

# «Descartar», then «Deshacer».
- tapOn:
    id: resumen-descartar
    enabled: true
- extendedWaitUntil:
    visible:
      text: "La descartaste.*"
    timeout: 15000
- tapOn:
    text: "Deshacer"
    childOf:
      id: toast
      containsDescendants:
        - text: "Resumen descartado"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      text: "Deshecho"
      childOf:
        id: toast
    timeout: 2000
    optional: true
- extendedWaitUntil:
    visible:
      id: resumen-descartar
      enabled: true
    timeout: 10000
- assertVisible:
    id: resumen-usar
    enabled: true
- assertNotVisible:
    text: "La descartaste.*"
- takeScreenshot: 08-resultados-05-descarte-deshecho

# ---------------------------------------------------------------- Periodo: 28 días (default), 7, 90 and back to 28
# cubre: RES-01, RES-05
- scrollUntilVisible:
    element:
      id: res-periodo
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: ".*Todo se compara con los 28 días anteriores.*"
- takeScreenshot: 08-resultados-06-periodo-28
# 28 días: two posts in the impressions chart.
- scrollUntilVisible:
    element:
      text: "Post 1, .*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Post 2, .*"
- takeScreenshot: 08-resultados-07-grafico-28
# 7 días: the note says so, and only the post of three days ago is left.
- scrollUntilVisible:
    element:
      id: res-periodo
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn:
    text: "7 días"
- extendedWaitUntil:
    visible: ".*Todo se compara con los 7 días anteriores.*"
    timeout: 20000
- takeScreenshot: 08-resultados-08-periodo-7
- scrollUntilVisible:
    element:
      text: "Post 1, .*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertNotVisible: "Post 2, .*"
- takeScreenshot: 08-resultados-09-grafico-7
# 90 días, then 28 días again.
- scrollUntilVisible:
    element:
      id: res-periodo
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn:
    text: "90 días"
- extendedWaitUntil:
    visible: ".*Todo se compara con los 90 días anteriores.*"
    timeout: 20000
- takeScreenshot: 08-resultados-10-periodo-90
- tapOn:
    text: "28 días"
- extendedWaitUntil:
    visible: ".*Todo se compara con los 28 días anteriores.*"
    timeout: 20000

# ---------------------------------------------------------------- the impressions chart: its ⓘ and a bar
# cubre: RES-05, CAL-07
- scrollUntilVisible:
    element:
      text: "Definición de Impresiones por post.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    text: "Definición de Impresiones por post.*"
- extendedWaitUntil:
    visible:
      id: definition-sheet
    timeout: 10000
- assertVisible:
    text: "Impresiones de cada post a los 7 días.*"
    childOf:
      id: definition-sheet
- takeScreenshot: 08-resultados-11-definicion-grafico
- tapOn:
    text: "Cerrar"
    childOf:
      id: definition-sheet
- extendedWaitUntil:
    notVisible:
      id: definition-sheet
    timeout: 10000
# A bar opens its piece: published, with its result by cut.
- scrollUntilVisible:
    element:
      text: "Post 1, .*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    text: "Post 1, .*"
- extendedWaitUntil:
    visible:
      id: pieza
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "PUBLICADA"
      childOf:
        id: pieza
    timeout: 20000
- assertVisible:
    text: "Salió a las .*"
    childOf:
      id: pieza
# «‹» says where it goes back to: Resultados, not Calendario.
- assertVisible:
    text: "Resultados"
    childOf:
      id: top-volver
- scrollUntilVisible:
    element:
      id: corte-24h
    direction: DOWN
    centerElement: true
    timeout: 15000
- takeScreenshot: 08-resultados-12-pieza-de-la-barra
- back
- extendedWaitUntil:
    notVisible:
      id: pieza
    timeout: 15000
- assertVisible:
    id: resultados-list

# ---------------------------------------------------------------- Modalidad: sections 3 and 4 are not split
# cubre: RES-01
- scrollUntilVisible:
    element:
      id: res-modalidad
    direction: UP
    timeout: 30000
- tapOn:
    id: res-modalidad
- tapOn:
    text: "Startups"
    below:
      id: res-modalidad
- extendedWaitUntil:
    visible: ".*Todo se compara con los 28 días anteriores.*"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "No se separa por modalidad: muestra toda la cuenta."
    direction: DOWN
    centerElement: true
    timeout: 30000
- takeScreenshot: 08-resultados-13-modalidad-startups
- scrollUntilVisible:
    element:
      id: res-modalidad
    direction: UP
    timeout: 30000
- tapOn:
    id: res-modalidad
- tapOn:
    text: "Todo"
    below:
      id: res-modalidad
- extendedWaitUntil:
    notVisible: "No se separa por modalidad: muestra toda la cuenta."
    timeout: 20000

# ---------------------------------------------------------------- 1 · Negocio: a missing figure, the funnel, an opportunity
# cubre: RES-01, RES-02, RES-03
# The section chips (just under Modalidad) jump to a section.
- scrollUntilVisible:
    element:
      text: "1 · Negocio"
    direction: DOWN
    timeout: 15000
- tapOn: "1 · Negocio"
- scrollUntilVisible:
    element:
      text: "Disponible cuando conectemos el inbox."
    direction: DOWN
    centerElement: true
    timeout: 20000
# «Conversaciones pertinentes» has no data: a dash (read as «Sin dato») and the reason, never a 0.
- assertVisible:
    text: "Sin dato"
    above:
      text: "Disponible cuando conectemos el inbox."
- assertVisible: "Oportunidades abiertas"
- takeScreenshot: 08-resultados-15-negocio-sin-dato
# Its ⓘ: the definition.
- tapOn: "Definición de Conversaciones pertinentes"
- extendedWaitUntil:
    visible:
      id: definition-sheet
    timeout: 10000
- assertVisible:
    text: "Conversaciones con personas que encajan abiertas en el periodo."
    childOf:
      id: definition-sheet
- tapOn:
    text: "Cerrar"
    childOf:
      id: definition-sheet
- extendedWaitUntil:
    notVisible:
      id: definition-sheet
    timeout: 10000
# Check each chart's heading before scrolling to its contents or the next chart. Centering the funnel's last row
# can put its heading above the viewport; the following chart headings must be reached independently too.
# The Negocio chip and its KPIs above locate this section. Match its unique chart text directly: Android can flatten
# the res-negocio View, so requiring it as a childOf parent can miss visible text and scroll past the whole section.
- scrollUntilVisible:
    element:
      text: "EMBUDO DE OPORTUNIDADES"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "EMBUDO DE OPORTUNIDADES"
- scrollUntilVisible:
    element:
      text: "Cerrada sin acuerdo: \\d+"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "REPARTO POR MODALIDAD"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "REPARTO POR MODALIDAD"
- scrollUntilVisible:
    element:
      text: "OPORTUNIDADES ACTIVAS"
    direction: DOWN
    centerElement: true
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Andrés Restrepo"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 08-resultados-16-oportunidades-activas
- tapOn: "Andrés Restrepo"
- extendedWaitUntil:
    visible:
      id: persona-head
    timeout: 20000
- assertVisible:
    text: "Andrés Restrepo"
    childOf:
      id: persona
- back
- extendedWaitUntil:
    visible:
      id: resultados-list
    timeout: 15000

# ---------------------------------------------------------------- 2 · Gente: the audience, recurrent people not measured
# cubre: RES-02, RES-04
- scrollUntilVisible:
    element:
      text: "Seguidores"
    direction: DOWN
    centerElement: true
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Aún no medimos las interacciones repetidas por persona."
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Tasa de aceptación"
- assertVisible:
    text: "Sin dato"
    above:
      text: "Aún no medimos las interacciones repetidas por persona."
- takeScreenshot: 08-resultados-17-gente

# ---------------------------------------------------------------- 3 · Contenido: the posts and the best post
# cubre: RES-05, RES-06, CAL-07
# The post of three days ago has no 7-day cut yet and its last reading had no reposts: «—», read as «sin dato».
- scrollUntilVisible:
    element:
      text: "POSTS DEL PERIODO"
    direction: DOWN
    centerElement: true
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "7 días: sin dato"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Republic.: sin dato"
- assertVisible: "Interacción: sin dato"
- takeScreenshot: 08-resultados-18-post-sin-corte
- scrollUntilVisible:
    element:
      text: "MEJOR POST DEL PERIODO"
    direction: UP
    centerElement: true
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Ver la pieza"
    direction: DOWN
    centerElement: true
    timeout: 15000
# The best post is the one of eight days ago (the only one with a 7-day cut): its first line is the English text.
- assertVisible: "We lost two weeks once because nobody remembered why we had dropped a queue\\."
- assertVisible: "INTERACCIÓN MEDIA POR PILAR"
- tapOn: "Ver la pieza"
- extendedWaitUntil:
    visible:
      text: "PUBLICADA"
      childOf:
        id: pieza
    timeout: 20000
- scrollUntilVisible:
    element:
      id: corte-7d
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible: "A LOS 7 DÍAS"
- takeScreenshot: 08-resultados-19-mejor-post
- back
- extendedWaitUntil:
    visible:
      id: resultados-list
    timeout: 15000

# ---------------------------------------------------------------- 4 · Equipo, the last section: replies not measured yet
# cubre: RES-07
- scrollUntilVisible:
    element:
      text: "Gasto de IA"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "\\d+ publicados? · — con respuesta"
- assertVisible: "\\d+ seguidos? · \\d+ invitados? · \\d+ aceptados?"
- assertVisible: "\\d+ publicadas? · \\d+ bloqueadas? · \\d+ vetadas?"
- assertVisible: "[0-9.,]+ USD hoy"
- assertVisible: "[0-9.,]+ de [0-9.,]+ USD este mes"
- takeScreenshot: 08-resultados-14-equipo
