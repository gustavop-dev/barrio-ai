# Login: a wrong password shows the error; the right one plays the entrance and lands in Oficina.
appId: co.projectapp.office
name: Entrada
tags: [entrada]
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: login
    timeout: 60000
- assertVisible: Entrar
- takeScreenshot: 01-entrada-01-pantalla
- tapOn:
    id: login-usuario
- inputText: ${QA_USER}
- tapOn:
    id: login-clave
- inputText: clave-equivocada
- hideKeyboard
- tapOn:
    id: login-entrar
- extendedWaitUntil:
    visible: Usuario o contraseña incorrectos.
    timeout: 20000
- takeScreenshot: 01-entrada-02-clave-equivocada
# Show the password, then type the right one.
- tapOn: Mostrar la contraseña
- tapOn:
    id: login-clave
- eraseText: 40
- inputText: ${QA_PASSWORD}
- hideKeyboard
- takeScreenshot: 01-entrada-03-clave-visible
- tapOn:
    id: login-entrar
# The entrance: the door opens and the picture zooms into the live Oficina.
- takeScreenshot: 01-entrada-04-puerta
- extendedWaitUntil:
    visible:
      id: screen-oficina
    timeout: 45000
- extendedWaitUntil:
    notVisible:
      id: login
    timeout: 20000
- assertVisible:
    id: tab-index
- takeScreenshot: 01-entrada-05-oficina
