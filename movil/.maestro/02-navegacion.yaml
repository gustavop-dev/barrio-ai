# cubre: ACC-06, OFI-08, OFI-09, APP-03, APP-08
# Navegación: the shell. Opening the app again keeps the session, also offline (the offline strip, and back online);
# every bottom-bar tab (the Bandeja de entrada with its counter), the three top-bar accesses with the Notificaciones
# dot, Android back
# through the tab history (backBehavior="history": each visit moves the tab to the end of the history, back pops it), a
# detail screen (the person card) closed with its «‹ Personas», with Android back and with a drag from the left edge,
# the 0ff1ce signature back to the Oficina, and oficina0ff1ce:// links (a tab and a piece, closed with «‹»).
# Each screen is recognised by a testID only it has; inactive tabs are detached, so «notVisible» proves it left.
appId: co.projectapp.office
name: Navegación
tags: [navegacion]
onFlowComplete:
  # Never leave the emulator offline for the next flow, even when a step failed.
  - setAirplaneMode: disabled
---
- runFlow: comun/entrar.yaml
# cubre: ACC-06 — opening the app again keeps the session: straight to the Oficina, no login.
- launchApp
- extendedWaitUntil:
    visible:
      id: screen-oficina
    timeout: 45000
- assertNotVisible:
    id: login
- assertVisible:
    id: tab-index
    selected: true
- takeScreenshot: 02-navegacion-01-oficina
# cubre: OFI-09.2 — the bars keep the Bandeja's counter (bottom) and the Notificaciones dot (top) in sight
- assertVisible:
    id: turn-counter
- assertVisible:
    id: unread-dot
- assertVisible: "Bandeja de entrada, \\d+ pendientes?.*"
- assertVisible: "Notificaciones, hay novedades"

# cubre: ACC-06.2, OFI-08.1 — opened without a connection it stays inside and says so (it used to log out)
- setAirplaneMode: enabled
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "login|screen-oficina"
    timeout: 45000
- assertNotVisible:
    id: login
- assertVisible:
    id: screen-oficina
- extendedWaitUntil:
    visible: "Sin conexión\\. Mostrando lo último que cargó\\."
    timeout: 30000
- assertNotVisible: ".*fetch failed.*"
- takeScreenshot: 02-navegacion-01b-sin-conexion
# cubre: OFI-08.2, ACC-06.6 — the network comes back: the strip goes and the Oficina reads the real activity again
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible: "Sin conexión\\. Mostrando lo último que cargó\\."
    timeout: 45000
# (The «Actividad real · …» line under the scene is gone. The narration box is no proof: with system animations on it
# retires after a few seconds, and it only shows while something happens. The scene and no read error say it.)
- extendedWaitUntil:
    visible:
      id: office-scene
    timeout: 60000
- assertNotVisible: "No se pudo leer la actividad\\."
- takeScreenshot: 02-navegacion-01c-red-de-vuelta

# cubre: ACC-06.3 — opened while the server answers 502 (a deploy) it stays inside (QA failure switch on the session)
- runScript:
    file: comun/qa-fallo.js
    env:
      RUTA: '^/api/v1/auth/session$'
      EFECTO: '502'
      VECES: '-1'
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "login|screen-oficina"
    timeout: 45000
- assertNotVisible:
    id: login
- assertVisible:
    id: screen-oficina
- takeScreenshot: 02-navegacion-01d-servidor-502
- runScript: comun/qa-fallos-limpiar.js

# ---------------------------------------------------------------- bottom bar: Resultados, Personas, Bandeja, Oficina
# cubre: OFI-09
- tapOn:
    id: tab-resultados
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: resultados-list
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: screen-oficina
    timeout: 10000
- assertVisible:
    id: tab-resultados
    selected: true
- assertVisible:
    id: tab-index
    selected: false
- takeScreenshot: 02-navegacion-02-resultados

- tapOn:
    id: tab-personas
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: barrio-list
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: resultados-list
    timeout: 10000
- assertVisible:
    id: tab-personas
    selected: true
- takeScreenshot: 02-navegacion-03-personas

- tapOn:
    id: tab-tu-turno
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: turno-list
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: barrio-list
    timeout: 10000
- assertVisible:
    id: tab-tu-turno
    selected: true
- takeScreenshot: 02-navegacion-04-bandeja

- tapOn:
    id: tab-index
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: screen-oficina
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: turno-list
    timeout: 10000
- assertVisible:
    id: tab-index
    selected: true
- takeScreenshot: 02-navegacion-05-oficina-otra-vez

# ---------------------------------------------------------------- top bar: Notificaciones, Calendario, Ajustes
# cubre: OFI-09 (accesos de arriba)
# They open with the push; the bottom bar stays and no bottom tab is selected.
- tapOn:
    id: top-notificaciones
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: screen-notificaciones
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: screen-oficina
    timeout: 10000
- assertVisible:
    id: top-notificaciones
    selected: true
- assertVisible:
    id: tab-index
    selected: false
- assertVisible:
    id: tab-tu-turno
    selected: false
- takeScreenshot: 02-navegacion-07-notificaciones

- tapOn:
    id: top-calendario
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: calendario
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: screen-notificaciones
    timeout: 10000
- assertVisible:
    id: top-calendario
    selected: true
- takeScreenshot: 02-navegacion-08-calendario

- tapOn:
    id: top-ajustes
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: screen-ajustes
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: calendario
    timeout: 10000
- assertVisible:
    id: top-ajustes
    selected: true
- takeScreenshot: 02-navegacion-09-ajustes

# ---------------------------------------------------------------- Android back through the tab history
# cubre: OFI-09
# History now: Resultados, Personas, Bandeja, Oficina, Notificaciones, Calendario, Ajustes.
- back
- extendedWaitUntil:
    visible:
      id: calendario
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: screen-ajustes
    timeout: 10000
- assertVisible:
    id: top-calendario
    selected: true
- takeScreenshot: 02-navegacion-10-atras-calendario

- back
- extendedWaitUntil:
    visible:
      id: screen-notificaciones
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: calendario
    timeout: 10000
- assertVisible:
    id: top-notificaciones
    selected: true

- back
- extendedWaitUntil:
    visible:
      id: screen-oficina
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: screen-notificaciones
    timeout: 10000
- assertVisible:
    id: tab-index
    selected: true
- takeScreenshot: 02-navegacion-12-atras-oficina

- back
- extendedWaitUntil:
    visible:
      id: turno-list
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: screen-oficina
    timeout: 10000
- assertVisible:
    id: tab-tu-turno
    selected: true
- takeScreenshot: 02-navegacion-11-atras-bandeja

- back
- extendedWaitUntil:
    visible:
      id: barrio-list
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: turno-list
    timeout: 10000
- assertVisible:
    id: tab-personas
    selected: true

- back
- extendedWaitUntil:
    visible:
      id: resultados-list
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: barrio-list
    timeout: 10000
- assertVisible:
    id: tab-resultados
    selected: true
- takeScreenshot: 02-navegacion-13-atras-resultados
# Resultados is the first entry left in the history: one more back would leave the app, so the flow stops here.

# ---------------------------------------------------------------- a detail screen and its «‹»
# The person card is pushed over the tabs (the tabs stay drawn underneath, so the proof it closed is that
# the card is gone, not that the list is there). Andrés is one of the seed's connections, the only people the
# Personas list shows since 12/11/2026.
- tapOn:
    id: tab-personas
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: barrio-list
    timeout: 20000
- scrollUntilVisible:
    element:
      text: Andrés Restrepo
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: Andrés Restrepo
- extendedWaitUntil:
    visible:
      id: persona
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: Andrés Restrepo
      childOf:
        id: persona
    timeout: 20000
- assertVisible:
    id: top-volver
- takeScreenshot: 02-navegacion-14-ficha-persona
- tapOn:
    id: top-volver
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: persona
    timeout: 20000
- assertNotVisible:
    id: top-volver
- assertVisible:
    id: tab-personas
    selected: true
- takeScreenshot: 02-navegacion-15-ficha-cerrada

# cubre: OFI-09.3 — in the app a detail also goes back with Android back, and with a drag from its left edge
- tapOn: Andrés Restrepo
- extendedWaitUntil:
    visible:
      id: persona
    timeout: 20000
- back
- extendedWaitUntil:
    notVisible:
      id: persona
    timeout: 20000
- assertVisible:
    id: tab-personas
    selected: true
- tapOn: Andrés Restrepo
- extendedWaitUntil:
    visible:
      id: persona
    timeout: 20000
- swipe:
    from:
      id: detail-edge-zone
    direction: RIGHT
    duration: 500
- extendedWaitUntil:
    notVisible:
      id: persona
    timeout: 20000
- assertVisible:
    id: tab-personas
    selected: true
- takeScreenshot: 02-navegacion-15b-ficha-arrastrada

# ---------------------------------------------------------------- the signature goes to the Oficina
- tapOn: 0ff1ce, ir a la Oficina
- extendedWaitUntil:
    visible:
      id: screen-oficina
    timeout: 20000
- assertVisible:
    id: tab-index
    selected: true
- takeScreenshot: 02-navegacion-16-firma-a-oficina

# ---------------------------------------------------------------- oficina0ff1ce:// links
# cubre: APP-03.3 — a link oficina0ff1ce://… opens the app on its screen: a tab, then a piece over it
- openLink: oficina0ff1ce://tu-turno
- extendedWaitUntil:
    visible:
      id: turno-list
    timeout: 30000
- assertVisible:
    id: tab-tu-turno
    selected: true
# The piece published 3 days ago (seed_qa: uid('piece:publicada3')).
- openLink: oficina0ff1ce://calendario/pieza/be144c1c-3ea7-5321-8f21-9c3520bace8f
- extendedWaitUntil:
    visible:
      id: detail-panel
    timeout: 30000
# cubre: OFI-09.3 — «‹» names where it goes back to: opened over the Bandeja, the piece shows «‹ Bandeja»
- assertVisible:
    text: Bandeja
    childOf:
      id: top-volver
- takeScreenshot: 02-navegacion-17-enlace-pieza
- tapOn:
    id: top-volver
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: detail-panel
    timeout: 20000
- assertVisible:
    id: turno-list
- assertVisible:
    id: tab-tu-turno
    selected: true
- takeScreenshot: 02-navegacion-18-enlace-cerrado
