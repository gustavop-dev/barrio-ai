# Resultados is the first entry left in the history: one more back would leave the app, so the flow stops here.

# ---------------------------------------------------------------- a detail screen and its «‹»
# The person card is pushed over the tabs (the tabs stay drawn underneath, so the proof it closed is that
# the card is gone, not that the list is there).
- tapOn:
    id: tab-personas
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: barrio-list
    timeout: 20000
- scrollUntilVisible:
    element:
      text: Pedro Salazar
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: Pedro Salazar
- extendedWaitUntil:
    visible:
      id: persona
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: Pedro Salazar
      childOf:
        id: persona
    timeout: 20000
- assertVisible:
    id: top-volver
- takeScreenshot: 02-navegacion-14-ficha-persona
- tapOn:
    id: top-volver
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: persona
    timeout: 20000
- assertNotVisible:
    id: top-volver
- assertVisible:
    id: tab-personas
    selected: true
- takeScreenshot: 02-navegacion-15-ficha-cerrada

# cubre: OFI-09.3 — in the app a detail also goes back with Android back, and with a drag from its left edge
- tapOn: Pedro Salazar
- extendedWaitUntil:
    visible:
      id: persona
    timeout: 20000
- back
- extendedWaitUntil:
    notVisible:
      id: persona
    timeout: 20000
- assertVisible:
    id: tab-personas
    selected: true
- tapOn: Pedro Salazar
- extendedWaitUntil:
    visible:
      id: persona
    timeout: 20000
- swipe:
    from:
      id: detail-edge-zone
    direction: RIGHT
    duration: 500
- extendedWaitUntil:
    notVisible:
      id: persona
    timeout: 20000
- assertVisible:
    id: tab-personas
    selected: true
- takeScreenshot: 02-navegacion-15b-ficha-arrastrada

# ---------------------------------------------------------------- the signature goes to the Oficina
- tapOn: 0ff1ce, ir a la Oficina
- extendedWaitUntil:
    visible:
      id: screen-oficina
    timeout: 20000
- assertVisible:
    id: tab-index
    selected: true
- takeScreenshot: 02-navegacion-16-firma-a-oficina

# ---------------------------------------------------------------- oficina0ff1ce:// links
# cubre: APP-03.3 — a link oficina0ff1ce://… opens the app on its screen: a tab, then a piece over it
- openLink: oficina0ff1ce://tu-turno
- extendedWaitUntil:
    visible:
      id: turno-list
    timeout: 30000
- assertVisible:
    id: top-tu-turno
    selected: true
# The piece published 3 days ago (seed_qa: uid('piece:publicada3')).
- openLink: oficina0ff1ce://calendario/pieza/be144c1c-3ea7-5321-8f21-9c3520bace8f
- extendedWaitUntil:
    visible:
      id: detail-panel
    timeout: 30000
# cubre: OFI-09.3 — a piece shows «‹ Calendario»
- assertVisible:
    text: Calendario
    childOf:
      id: top-volver
- takeScreenshot: 02-navegacion-17-enlace-pieza
- tapOn:
    id: top-volver
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: detail-panel
    timeout: 20000
- assertVisible:
    id: turno-list
- assertVisible:
    id: top-tu-turno
    selected: true
- takeScreenshot: 02-navegacion-18-enlace-cerrado
