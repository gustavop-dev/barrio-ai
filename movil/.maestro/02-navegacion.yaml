# cubre: ACC-06, OFI-08, OFI-09, APP-03, APP-08
# Navegación: the shell. Opening the app again keeps the session, also offline (the offline strip, and back online);
# every bottom-bar tab, the four top-bar accesses with the Tu turno counter and the Notificaciones dot, Android back
# through the tab history (backBehavior="history": each visit moves the tab to the end of the history, back pops it), a
# detail screen (the person card) closed with its «‹ Personas», with Android back and with a drag from the left edge,
# the 0ff1ce signature back to the Oficina, and oficina0ff1ce:// links (a tab and a piece, closed with «‹»).
# Each screen is recognised by a testID only it has; inactive tabs are detached, so «notVisible» proves it left.
appId: co.projectapp.office
name: Navegación
tags: [navegacion]
onFlowComplete:
  # Never leave the emulator offline for the next flow, even when a step failed.
  - setAirplaneMode: disabled
---
- runFlow: comun/entrar.yaml
# cubre: ACC-06 — opening the app again keeps the session: straight to the Oficina, no login.
- launchApp
- extendedWaitUntil:
    visible:
      id: screen-oficina
    timeout: 45000
- assertNotVisible:
    id: login
- assertVisible:
    id: tab-index
    selected: true
- takeScreenshot: 02-navegacion-01-oficina
# cubre: OFI-09.2 — the top bar keeps Tu turno's counter and the Notificaciones dot in sight
- assertVisible:
    id: turn-counter
- assertVisible:
    id: unread-dot
- assertVisible: "Tu turno, \\d+ pendientes?.*"
- assertVisible: "Notificaciones, hay novedades"

# cubre: ACC-06.2, OFI-08.1 — opened without a connection it stays inside and says so (it used to log out)
- setAirplaneMode: enabled
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "login|screen-oficina"
    timeout: 45000
- assertNotVisible:
    id: login
- assertVisible:
    id: screen-oficina
- extendedWaitUntil:
    visible: "Sin conexión\\. Mostrando lo último que cargó\\."
    timeout: 30000
- assertNotVisible: ".*fetch failed.*"
- takeScreenshot: 02-navegacion-01b-sin-conexion
# cubre: OFI-08.2, ACC-06.6 — the network comes back: the strip goes and the Oficina reads the real activity again
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible: "Sin conexión\\. Mostrando lo último que cargó\\."
    timeout: 45000
- scrollUntilVisible:
    element: "Actividad real · .*"
    direction: DOWN
    timeout: 60000
- takeScreenshot: 02-navegacion-01c-red-de-vuelta

# cubre: ACC-06.3 — opened while the server answers 502 it stays inside. Pendiente del interruptor de fallos (PR #48):
# comun/qa-fallo.js with RUTA '^/api/v1/auth/session$' and EFECTO '502', then stopApp, launchApp and the same checks.

# ---------------------------------------------------------------- bottom bar: Resultados, Personas, Galería, Oficina
