# cubre: ARQ-08
# Read-only graph, real API + seed_qa, no paid providers. Phone: 390 x 844 dp.
appId: co.projectapp.office
name: Mapa del equipo
tags: [equipo, arquitectura]
---
- runFlow: comun/entrar.yaml
- scrollUntilVisible:
    element:
      id: oficina-mapa-equipo
      above:
        id: tab-galeria
    direction: DOWN
    timeout: 20000
- tapOn:
    id: oficina-mapa-equipo
- extendedWaitUntil:
    visible:
      id: screen-mapa-equipo
    timeout: 20000
- extendedWaitUntil:
    visible: "Mesa editorial · .*"
    timeout: 20000
- assertVisible: Mapa del equipo
- takeScreenshot: 17-mapa-equipo-01-grupos
- tapOn: "Mesa editorial · .*"
- scrollUntilVisible:
    element:
      id: mapa-agente-director_editorial
    direction: DOWN
    centerElement: true
- tapOn:
    id: mapa-agente-director_editorial
- extendedWaitUntil:
    visible:
      id: mapa-ficha
    timeout: 10000
- assertVisible: Director editorial
- assertVisible: "El código editorial coordina el brief.*"
- scrollUntilVisible:
    element:
      text: "Curso · .* unidades"
    direction: DOWN
    centerElement: true
- tapOn: "Curso · .* unidades"
# The real director has 13 units plus a course note; scroll to the unit itself.
- scrollUntilVisible:
    element:
      text: LI-04-M005-K01
    direction: DOWN
    centerElement: true
- assertVisible: LI-04-M005-K01
- takeScreenshot: 17-mapa-equipo-02-curso
- scrollUntilVisible:
    element:
      text: "Curso · .* unidades"
    direction: UP
    centerElement: true
- tapOn: "Curso · .* unidades"
- scrollUntilVisible:
    element:
      text: Actividad reciente
    direction: DOWN
    centerElement: true
- assertVisible: Actividad reciente
- scrollUntilVisible:
    element:
      text: "Solicita a: Copywriter A"
    direction: DOWN
    centerElement: true
- tapOn: "Solicita a: Copywriter A"
- extendedWaitUntil:
    visible: Copywriter A
    timeout: 10000
- assertVisible: Copywriter A
- assertVisible: "Redacta la variante A.*"
- scrollUntilVisible:
    element:
      text: "Recibe de: Director editorial"
    direction: DOWN
    centerElement: true
- tapOn: "Recibe de: Director editorial"
- extendedWaitUntil:
    visible: Director editorial
    timeout: 10000
- scrollUntilVisible:
    element:
      text: Ver todos los agentes
    direction: UP
- tapOn: Ver todos los agentes
- extendedWaitUntil:
    visible: "Mesa editorial · .*"
    timeout: 10000
- tapOn: "Mesa editorial · .*"
- scrollUntilVisible:
    element:
      id: mapa-agente-editor_visual
    direction: DOWN
    centerElement: true
- tapOn:
    id: mapa-agente-editor_visual
- extendedWaitUntil:
    visible: "Este agente aún no ejecuta trabajo\\."
    timeout: 10000
- assertVisible: "Este agente aún no ejecuta trabajo\\."
- scrollUntilVisible:
    element:
      text: "Sin actividad registrada para este agente\\."
    direction: DOWN
    centerElement: true
- takeScreenshot: 17-mapa-equipo-03-en-diseno
- scrollUntilVisible:
    element:
      text: Volver
    direction: UP
- tapOn: Volver
- extendedWaitUntil:
    visible:
      id: screen-oficina
    timeout: 10000
- tapOn:
    id: top-ajustes
- extendedWaitUntil:
    visible:
      id: ajustes-mapa-equipo
    timeout: 20000
- tapOn:
    id: ajustes-mapa-equipo
- extendedWaitUntil:
    visible:
      id: screen-mapa-equipo
    timeout: 20000
- extendedWaitUntil:
    visible: "Observatorio · .*"
    timeout: 20000
- tapOn: "Observatorio · .*"
- scrollUntilVisible:
    element:
      id: mapa-agente-investigador_referentes
    direction: DOWN
    centerElement: true
- tapOn:
    id: mapa-agente-investigador_referentes
- extendedWaitUntil:
    visible: Observación de referentes
    timeout: 10000
- scrollUntilVisible:
    element:
      text: Actividad reciente
    direction: DOWN
    centerElement: true
# The activity heading can be visible while the seeded observe jobs are below the viewport.
- scrollUntilVisible:
    element:
      text: "Terminado · .*"
      index: 0
    direction: DOWN
    centerElement: true
- assertVisible: "Terminado · .*"
- takeScreenshot: 17-mapa-equipo-04-actividad
- scrollUntilVisible:
    element:
      text: Volver
    direction: UP
- tapOn: Volver
- assertVisible:
    id: screen-ajustes
