# cubre: GAL-08, AJU-12, TUR-18, EST-01, EST-03, EST-04, CAP-12, TUR-09
# Real seeded API; generated PNG blocks, no real reference photo or paid provider.
# seed_qa --perfil-capturas processes an ambiguous note through the real capture
# router. It adds one pending question, with the exact phrase for a new request.
# Natural text/audio requests and completed jobs are covered in test_perfil_capturas.py.
appId: co.projectapp.office
name: Perfil privado, aclaración de alcance y checklist manual
tags: [perfil, ajustes, turno]
---
- runFlow: comun/entrar.yaml
# The profile photos live in Ajustes › Fotos de perfil since the Galería left the app (12/11/2026): the seeded one
# shows with its role, and «Subir fotos de perfil» adds one from the phone as category «perfil».
- tapOn:
    id: top-ajustes
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: screen-ajustes
    timeout: 20000
- scrollUntilVisible:
    element:
      text: '03 · Identidad y gafas.*'
    direction: DOWN
    centerElement: true
    timeout: 30000
- scrollUntilVisible:
    element:
      id: fotos-perfil-subir
    direction: DOWN
    centerElement: true
- tapOn:
    id: fotos-perfil-subir
    waitToSettleTimeoutMs: 500
- runFlow:
    file: comun/elegir-foto.yaml
    env:
      CAPTURA: 18-perfil-00-selector-de-fotos
# The new photo has no role yet: its tile is the first «Sin asignar» (the toast «Fotos subidas a Perfil.» lasts only a
# few seconds, QA run 43358236141).
- extendedWaitUntil:
    visible: "Sin asignar.*"
    timeout: 45000
- assertNotVisible: ".*(fetch failed|Network request failed|Unsupported FormDataPart).*"
- takeScreenshot: 18-perfil-01-categoria
- tapOn:
    id: tab-tu-turno
- extendedWaitUntil:
    visible:
      id: tab-tu-turno
      text: 'Bandeja de entrada, 11 pendientes, 1 urgente'
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Identificar los cinco referentes main
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible: Gestionar protegidos
- scrollUntilVisible:
    element:
      text: '¿Quieres una propuesta completa para tu perfil de LinkedIn\?'
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible: '¿Quieres una propuesta completa para tu perfil de LinkedIn\?'
- scrollUntilVisible:
    element:
      text: '.*envía una nueva nota con la frase exacta «hazme la propuesta del perfil».*'
    direction: DOWN
    centerElement: true
- assertVisible: '.*envía una nueva nota con la frase exacta «hazme la propuesta del perfil».*'
- takeScreenshot: 18-perfil-01b-aclaracion-en-tu-turno
- scrollUntilVisible:
    element:
      id: profile-open
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: profile-open
- extendedWaitUntil:
    visible: 'Secciones listas: .* · Assets descargables: 3'
    timeout: 15000
- assertNotVisible:
    id: profile-prepare-assets
# This seeded proposal already has A, B and banner. Missing-assets submission and
# disabled/polling states use explicit fake servers in ProfileProposal.test.tsx.
- scrollUntilVisible:
    element:
      text: Checklist por sección
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: profile-section-headline
    direction: DOWN
    centerElement: true
- tapOn:
    id: profile-section-headline
- scrollUntilVisible:
    element:
      text: '\[LI-02-V015-K03\].*'
    direction: DOWN
    centerElement: true
- assertVisible: '\[LI-02-V015-K03\].*'
- scrollUntilVisible:
    element:
      id: profile-headline-accept
    direction: DOWN
    centerElement: true
- tapOn:
    id: profile-headline-accept
- extendedWaitUntil:
    visible:
      id: profile-headline-applied
    timeout: 15000
- tapOn:
    id: profile-headline-applied
- scrollUntilVisible:
    element:
      text: 'Aplicado por Gustavo, pendiente de comprobar.*'
    direction: UP
    centerElement: true
- assertVisible: 'Aplicado por Gustavo, pendiente de comprobar.*'
- assertNotVisible: '^Comprobado$'
- takeScreenshot: 18-perfil-02-aplicado-no-comprobado
