# cubre: GAL-01, GAL-03, GAL-04, GAL-05, GAL-06, GAL-07
# Galería: the grid of the seeded photos, newest first, with its texts; the filters (and an empty one); the photo sheet
# of «Nueva» (note typed and saved, the AI-edit switch turned off, both there when it opens again right away); the
# full-screen viewer (on ink, closed by dragging the photo down, double-tap zoom that holds the pager, a swipe to the
# next photo and «Cerrar», after which the sheet follows that photo); and «Quitar de la galería» with its confirmation.
# Photos, newest first: Nueva (today), Sin usar (3 days, note «Pizarra de la sesión de producto»), Elegida (for
# tomorrow's piece), Publicada. «Subir fotos» is in 10-galeria-subir.
# Steps marked «interruptor de fallos» use the QA failure switch (team_backend.qa_fallos) and are skipped, with a
# «pendiente-del-interruptor-de-fallos» screenshot, while that switch is not on main.
appId: co.projectapp.office
name: Galería
tags: [galeria]
---
- runFlow: comun/entrar.yaml
- evalScript: ${output.interruptor = http.get('http://127.0.0.1:8787/api/v1/qa/fallos').status == 200}
- tapOn:
    id: tab-galeria
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: screen-galeria
    timeout: 20000

# ---------------------------------------------------------------- the grid
# cubre: GAL-01, GAL-07
- assertVisible: "Fotos para tus posts\\."
- assertVisible:
    id: gallery-upload
    text: Subir fotos
- assertVisible: "Para usar la cámara, toca el botón aguamarina y elige «Foto para la galería»\\."
- assertVisible: "El equipo decide cuándo usarlas y si las edita con IA\\. Tú puedes dejar una nota o prohibir la edición en cada foto\\."
# Tiles are labelled «Foto del <día>, <estado>»; the newest first.
- extendedWaitUntil:
    visible: "Foto.*, nueva"
    timeout: 20000
- assertVisible: "Foto.*, sin usar"
- assertVisible: "Foto.*, elegida.*"
- assertVisible: "Foto.*, publicada.*"
- assertVisible:
    text: "Foto.*, sin usar"
    rightOf:
      text: "Foto.*, nueva"
- assertVisible:
    id: filtro-todas
    selected: true
- takeScreenshot: 10-galeria-01-rejilla
# The photos are private: the image the grid shows, asked for without the session or the device token, is refused.
- evalScript: ${output.sinSesion = http.get('http://127.0.0.1:8787/api/v1/galeria/67f77ca8-0963-50a7-8308-53d677c07999/imagen').status}
- assertTrue: ${output.sinSesion == 401 || output.sinSesion == 403}

# ---------------------------------------------------------------- the filters
# cubre: GAL-01
- tapOn:
    id: filtro-publicadas
- extendedWaitUntil:
    notVisible: "Foto.*, nueva"
    timeout: 15000
- assertVisible: "Foto.*, publicada.*"
- assertNotVisible: "Foto.*, sin usar"
- assertVisible:
    id: filtro-publicadas
    selected: true
- takeScreenshot: 10-galeria-02-filtro-publicadas
# «Elegidas»: the photo chosen for tomorrow's piece.
- tapOn:
    id: filtro-elegidas
- extendedWaitUntil:
    notVisible: "Foto.*, publicada.*"
    timeout: 15000
- assertVisible: "Foto.*, elegida.*"
- assertNotVisible: "Foto.*, nueva"
# «Sin usar» includes the new one.
- tapOn:
    id: filtro-sin_usar
- extendedWaitUntil:
    visible: "Foto.*, nueva"
    timeout: 15000
- assertVisible: "Foto.*, sin usar"
- assertNotVisible: "Foto.*, elegida.*"
# A filter without photos (interruptor de fallos: the next list comes back empty).
- runFlow:
    when:
      true: ${output.interruptor}
    commands:
      - evalScript: "${http.post('http://127.0.0.1:8787/api/v1/qa/fallos', {headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ruta: '^/api/v1/galeria$', metodo: 'GET', efecto: 'vacio', veces: 1})}).status}"
      - tapOn:
          id: filtro-publicadas
      - extendedWaitUntil:
          visible: "No hay fotos con este filtro\\."
          timeout: 15000
      - takeScreenshot: 10-galeria-03-filtro-vacio
- runFlow:
    when:
      true: ${!output.interruptor}
    commands:
      - takeScreenshot: 10-galeria-03-filtro-vacio-pendiente-del-interruptor-de-fallos
- tapOn:
    id: filtro-todas
- extendedWaitUntil:
    visible: "Foto.*, publicada.*"
    timeout: 15000
- extendedWaitUntil:
    visible: "Foto.*, nueva"
    timeout: 15000

# ---------------------------------------------------------------- the photo sheet: note and AI switch
# cubre: GAL-03, GAL-04
- tapOn: "Foto.*, nueva"
- extendedWaitUntil:
    visible:
      id: photo-sheet
    timeout: 15000
- assertVisible: "Todavía sin usar"
- assertVisible: "Nota para el equipo \\(opcional\\)"
- assertVisible: "El equipo puede editarla con IA"
- assertVisible: "Quitar de la galería"
- assertVisible:
    id: photo-ai
    checked: true
- assertVisible:
    id: photo-save
    enabled: false
- takeScreenshot: 10-galeria-04-foto-abierta

# The note is ASCII on purpose (Maestro types non-ASCII text through a slower path on Android).
- tapOn:
    id: photo-note
- inputText: Recortala para que no se lean nombres de clientes
# A tap on plain text of the sheet dismisses the keyboard (keyboardShouldPersistTaps="handled"); unlike hideKeyboard
# (Android back) it cannot close the sheet when the emulator shows no soft keyboard.
- tapOn: "Todavía sin usar"
- runFlow:
    when:
      visible:
        id: "com\\.google\\.android\\.inputmethod\\.latin:id/.*"
    commands:
      - hideKeyboard
- assertVisible:
    id: photo-note
    text: Recortala para que no se lean nombres de clientes
- tapOn:
    id: photo-ai
- assertVisible:
    id: photo-ai
    checked: false
- assertVisible:
    id: photo-save
    enabled: true
- takeScreenshot: 10-galeria-05-nota-y-switch
# The gallery reloads slowly after the save (interruptor de fallos), so the photo opens again before the new list
# arrives: the sheet must show what was just saved, not the list it had.
- runFlow:
    when:
      true: ${output.interruptor}
    commands:
      - evalScript: "${http.post('http://127.0.0.1:8787/api/v1/qa/fallos', {headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ruta: '^/api/v1/galeria$', metodo: 'GET', efecto: 'lento', segundos: 15, veces: 2})}).status}"
- tapOn:
    id: photo-save
- extendedWaitUntil:
    visible: "Foto guardada\\."
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: photo-sheet
    timeout: 15000
- takeScreenshot: 10-galeria-06-guardada

# Open it again at once: the saved note and the switch.
- tapOn: "Foto.*, nueva"
- extendedWaitUntil:
    visible:
      id: photo-sheet
    timeout: 15000
- assertVisible:
    id: photo-note
    text: Recortala para que no se lean nombres de clientes
- assertVisible:
    id: photo-ai
    checked: false
- assertVisible:
    id: photo-save
    enabled: false
# The big image is labelled with the saved note.
- assertVisible:
    id: photo-sheet-image
    text: "Foto: Recortala para que no se lean nombres de clientes"
- takeScreenshot: 10-galeria-07-nota-guardada

# ---------------------------------------------------------------- the viewer
# cubre: GAL-06
# The photo on ink (colors.ink), with «1 de 4», «Cerrar» and its caption in paper white over it.
- tapOn:
    id: photo-sheet-image
- extendedWaitUntil:
    visible:
      id: photo-viewer
    timeout: 15000
- assertVisible:
    id: photo-viewer-count
    text: 1 de 4
- assertVisible:
    id: photo-viewer-close
- assertVisible: "Nueva"
- takeScreenshot: 10-galeria-08-visor
# Drag the photo down to close it: back to the same sheet.
- swipe:
    start: "50%, 40%"
    end: "50%, 80%"
    duration: 500
- extendedWaitUntil:
    notVisible:
      id: photo-viewer
    timeout: 10000
- assertVisible:
    id: photo-sheet-image
    text: "Foto: Recortala para que no se lean nombres de clientes"

# Again: a double tap zooms in, and while zoomed a sideways drag moves the photo instead of turning the page.
- tapOn:
    id: photo-sheet-image
- extendedWaitUntil:
    visible:
      id: photo-viewer
    timeout: 15000
- doubleTapOn:
    point: "50%, 50%"
- swipe:
    start: "70%, 50%"
    end: "40%, 50%"
    duration: 600
- assertVisible:
    id: photo-viewer-count
    text: 1 de 4
- takeScreenshot: 10-galeria-09-visor-zoom
# A second double tap zooms out; then a swipe turns to the next photo.
- doubleTapOn:
    point: "50%, 50%"
- repeat:
    times: 3
    while:
      visible:
        id: photo-viewer-count
        text: 1 de 4
    commands:
      - swipe:
          start: "85%, 60%"
          end: "10%, 60%"
          duration: 700
- extendedWaitUntil:
    visible:
      id: photo-viewer-count
      text: 2 de 4
    timeout: 10000
- assertVisible: "Sin usar"
- takeScreenshot: 10-galeria-10-visor-siguiente
- tapOn:
    id: photo-viewer-close
- extendedWaitUntil:
    notVisible:
      id: photo-viewer
    timeout: 10000
# The sheet now shows that photo (the open one had no unsaved changes).
- extendedWaitUntil:
    visible:
      id: photo-note
      text: Pizarra de la sesión de producto
    timeout: 10000
- assertVisible:
    id: photo-ai
    checked: true
- takeScreenshot: 10-galeria-11-sigue-la-foto

# ---------------------------------------------------------------- «Quitar de la galería»
# cubre: GAL-05
- scrollUntilVisible:
    element:
      text: "Quitar de la galería"
    direction: DOWN
    timeout: 15000
- tapOn: "Quitar de la galería"
- extendedWaitUntil:
    visible: "¿Quitar esta foto de la galería\\?"
    timeout: 15000
- assertVisible: "Se borran la foto y su archivo; el equipo ya no podrá usarla\\."
- assertVisible: "Cancelar"
- takeScreenshot: 10-galeria-12-quitar-confirmacion
# «Cancelar» keeps it.
- tapOn: "Cancelar"
- extendedWaitUntil:
    notVisible: "¿Quitar esta foto de la galería\\?"
    timeout: 15000
- assertVisible:
    id: photo-sheet
- tapOn: "Quitar de la galería"
- extendedWaitUntil:
    visible: "¿Quitar esta foto de la galería\\?"
    timeout: 15000
- tapOn: "Quitar la foto"
- extendedWaitUntil:
    visible: "Foto quitada de la galería\\."
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: photo-sheet
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Foto.*, sin usar"
    timeout: 20000
- assertVisible: "Foto.*, nueva"
- assertVisible: "Foto.*, elegida.*"
- takeScreenshot: 10-galeria-13-quitada

# A photo chosen for a post warns before it goes; close the confirmation and the sheet with «×».
- tapOn: "Foto.*, elegida.*"
- extendedWaitUntil:
    visible:
      id: photo-sheet
    timeout: 15000
- assertVisible: "Elegida para .*"
- scrollUntilVisible:
    element:
      text: "Quitar de la galería"
    direction: DOWN
    timeout: 15000
- tapOn: "Quitar de la galería"
- extendedWaitUntil:
    visible: "Ojo: elegida para el post del .*"
    timeout: 15000
- takeScreenshot: 10-galeria-14-quitar-elegida
- tapOn: "Cancelar"
- extendedWaitUntil:
    notVisible: "¿Quitar esta foto de la galería\\?"
    timeout: 15000
- tapOn:
    id: photo-sheet-close
- extendedWaitUntil:
    notVisible:
      id: photo-sheet
    timeout: 10000
- assertVisible:
    id: screen-galeria
