# cubre: CAP-01, CAP-02, CAP-03, CAP-08, CAP-10, CAP-11, CAP-13, CAP-14
# Captura: the raised aguamarina button in the centre of the bottom bar. A tap opens the sheet (note, «Para qué es»,
# recording from the sheet); an empty sheet closes at once, one with something in it asks «¿Cerrar sin enviar?»;
# holding the button records; a note sent to the team shows the toast with «Deshacer», and «Deshacer» brings the draft
# back in the sheet; sent again, it shows in «Lo que enviaste» with its state, and «Deshacer» there takes it out of the
# list at once. The two seeded captures («Dato guardado» and «Usado») stay.
# Photos, audio and the error states are in 05-captura-envios; captures tied to a question, a person or a piece in
# 05-captura-contexto.
#
# The capture works from every tab. This flow uses it from Galería, a still screen: over the animated Oficina each
# Maestro step can take 20 to 100 s on the CI emulator, and the 5 s toast «Enviado al equipo.» came and went between
# two of them (QA run 42451843664).
#
# The microphone: the CI emulator runs with -noaudio. The microphone opens and records silence (QA run 42444252819
# shows a 0:02 audio after the hold); if an image ever fails to open it, the flow branches on what the app shows.
appId: co.projectapp.office
name: Captura
tags: [captura]
---
- runFlow: comun/entrar.yaml
- tapOn:
    id: tab-galeria
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: screen-galeria
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: capture-button
    timeout: 20000
# First use only: the hint over the button shows until the capture is used once (the flag lives in SecureStore and
# survives between flows, so it depends on what ran before on this emulator).
- runFlow:
    when:
      visible: 'Mantén oprimido para grabar\. Toca para foto o nota\.'
    commands:
      - takeScreenshot: 05-captura-01-pista-primer-uso

# ---------------------------------------------------------------- a tap opens the sheet
# cubre: CAP-01, CAP-08
- tapOn:
    id: capture-button
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: capture-sheet
    timeout: 20000
- assertVisible: 'Para el equipo'
- assertVisible:
    id: capture-grabar
- assertVisible:
    id: capture-camara
- assertVisible:
    id: capture-galeria
- assertVisible:
    id: capture-note
- assertVisible:
    id: capture-para-post
- assertVisible: 'Si no eliges, el equipo lo transcribe y decide\.'
- assertVisible:
    id: capture-send
    enabled: false
- assertNotVisible: 'Mantén oprimido para grabar\. Toca para foto o nota\.'
- takeScreenshot: 05-captura-02-hoja

# An empty sheet closes at once, without asking.
# cubre: CAP-14
- tapOn:
    id: capture-cerrar
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: capture-sheet
    timeout: 15000
- assertNotVisible: '¿Cerrar sin enviar\?'
- tapOn:
    id: capture-button
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: capture-sheet
    timeout: 20000

# A note: the text stays in the field. A tap on the «Añadir una imagen» label (above the field, inside the sheet's
# scroll) dismisses the keyboard without touching anything else.
- tapOn:
    id: capture-note
    waitToSettleTimeoutMs: 500
- inputText: Nota de QA que se va a descartar
- tapOn: 'A[ñÑ]adir una imagen'
- assertVisible: 'Nota de QA que se va a descartar'
- assertVisible:
    id: capture-send
    enabled: true

# «Para qué es»: the chip turns on, and a second chip replaces it. «Foto para la galería» needs a photo.
# cubre: CAP-08
- tapOn:
    id: capture-para-dato
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: capture-para-dato
    selected: true
- tapOn:
    id: capture-para-galeria
    waitToSettleTimeoutMs: 500
- assertVisible: 'Para «Foto para la galería» adjunta al menos una foto\.'
- assertVisible:
    id: capture-send
    enabled: false
- tapOn:
    id: capture-para-post
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: capture-para-post
    selected: true
- assertVisible:
    id: capture-para-dato
    selected: false
- assertNotVisible: 'Para «Foto para la galería» adjunta al menos una foto\.'
- takeScreenshot: 05-captura-03-nota-y-para-que

# Recording from the sheet. Whatever the microphone does, the sheet must say it: the recording panel («Grabando»,
# with Descartar · Pausar · Terminar) or the note that the microphone could not be used.
# cubre: CAP-02, CAP-13
- tapOn:
    id: capture-grabar
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Grabando|No se pudo usar el micrófono|Para grabar, 0ff1ce necesita el micrófono|El micrófono está bloqueado'
    timeout: 20000
- runFlow:
    when:
      visible: 'Grabando'
    commands:
      - assertVisible:
          id: capture-recording
      - assertVisible:
          id: capture-pausar
      - assertVisible:
          id: capture-terminar
      - takeScreenshot: 05-captura-04-grabando-en-la-hoja
      # «Descartar» throws the recording in the bin and the sheet offers «Grabar un audio» again.
      - tapOn:
          id: capture-descartar
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible:
            id: capture-grabar
          timeout: 15000
      - assertNotVisible:
          id: capture-recording
# The emulator's microphone did not start (no audio device): the app explains it and keeps the note.
- runFlow:
    when:
      visible: 'No se pudo usar el micrófono'
    commands:
      - assertVisible: 'Volver a intentarlo'
      - takeScreenshot: 05-captura-04-microfono-no-disponible
# Not expected (launchApp grants every permission), recorded if it happens.
- runFlow:
    when:
      visible: 'Para grabar, 0ff1ce necesita el micrófono|El micrófono está bloqueado'
    commands:
      - takeScreenshot: 05-captura-04-microfono-sin-permiso

# ---------------------------------------------------------------- closing with something unsent asks first
# cubre: CAP-14
# The close button says what its dialog asks: «Cerrar sin enviar» (it said «Cerrar sin guardar»).
- assertVisible:
    id: capture-cerrar
    text: 'Cerrar sin enviar'
- tapOn:
    id: capture-cerrar
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '¿Cerrar sin enviar\?'
    timeout: 15000
- assertVisible: 'Se pierden el audio, las fotos y la nota de esta captura\.'
- assertVisible: 'Seguir aquí'
- takeScreenshot: 05-captura-05-cerrar-sin-enviar
# «Seguir aquí» keeps everything.
- tapOn: 'Seguir aquí'
- extendedWaitUntil:
    notVisible: '¿Cerrar sin enviar\?'
    timeout: 15000
- assertVisible: 'Nota de QA que se va a descartar'
- tapOn:
    id: capture-cerrar
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: '¿Cerrar sin enviar\?'
    timeout: 15000
# The dialog's own button, under its title (the sheet's close button has the same name, higher up).
- tapOn:
    text: 'Cerrar sin enviar'
    below:
      text: '¿Cerrar sin enviar\?'
- extendedWaitUntil:
    notVisible:
      id: capture-sheet
    timeout: 15000
- assertVisible:
    id: capture-button

# ---------------------------------------------------------------- holding the button records
# cubre: CAP-02, CAP-13
# The recording starts after 220 ms of hold; longPressOn holds about 3 s and releases, which ends it and opens the
# sheet with the audio ready (never sent alone). The hold overlay (time strip, lock, trash) only shows while the finger
# is down, which Maestro cannot capture: the video of the run shows it.
- longPressOn:
    id: capture-button
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: capture-sheet
    timeout: 20000
- extendedWaitUntil:
    visible: 'Escuchar el audio|No se pudo usar el micrófono|Para grabar, 0ff1ce necesita el micrófono|El micrófono está bloqueado|Grabar un audio'
    timeout: 20000
- takeScreenshot: 05-captura-06-tras-mantener
# No audio came out of the hold (the microphone failed): nothing to lose, the sheet closes at once. This branch runs
# first so that the audio branch below never sees a closed sheet.
- runFlow:
    when:
      notVisible:
        id: capture-audio
    commands:
      - tapOn:
          id: capture-cerrar
          waitToSettleTimeoutMs: 500
# The hold recorded (silence, on this emulator): the audio is ready to listen to, and closing asks first.
- runFlow:
    when:
      visible:
        id: capture-audio
    commands:
      - assertVisible: 'Escuchar el audio'
      - assertVisible: 'Quitar el audio'
      # Its length, a few seconds. (React Native flattens the row: the length is not a child node of capture-audio.)
      - assertVisible: '0:0[0-9]'
      - takeScreenshot: 05-captura-07-audio-de-la-pulsacion
      - tapOn:
          id: capture-cerrar
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible: '¿Cerrar sin enviar\?'
          timeout: 15000
      - tapOn:
          text: 'Cerrar sin enviar'
          below:
            text: '¿Cerrar sin enviar\?'
- extendedWaitUntil:
    notVisible:
      id: capture-sheet
    timeout: 15000

# ---------------------------------------------------------------- send a note to the team, and «Deshacer» in the toast
# cubre: CAP-03, CAP-08, CAP-10
- tapOn:
    id: capture-button
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: capture-sheet
    timeout: 20000
- tapOn:
    id: capture-note
    waitToSettleTimeoutMs: 500
- inputText: Nota de QA idea para un post sobre validar un MVP con clientes
- tapOn: 'A[ñÑ]adir una imagen'
- tapOn:
    id: capture-para-post
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: capture-para-post
    selected: true
- scrollUntilVisible:
    element:
      id: capture-send
    direction: DOWN
    timeout: 15000
- takeScreenshot: 05-captura-08-lista-para-enviar
- tapOn:
    id: capture-send
    waitToSettleTimeoutMs: 500
- takeScreenshot: 05-captura-tras-enviar-1
# Once the team has it the envelope flies off, the sheet closes and the toast offers «Deshacer» for 5 s.
- extendedWaitUntil:
    visible: 'Enviado al equipo\.'
    timeout: 30000
- assertNotVisible:
    id: capture-sheet
- takeScreenshot: 05-captura-09-enviado
- tapOn:
    text: 'Deshacer'
    rightOf:
      text: 'Enviado al equipo\.'
    waitToSettleTimeoutMs: 500
- takeScreenshot: 05-captura-10-deshecho-aviso
# Undone: the toast says so over the sheet, which opens again with the same draft.
- extendedWaitUntil:
    visible:
      id: capture-sheet
    timeout: 20000
- extendedWaitUntil:
    visible: 'Envío deshecho\. Lo tienes otra vez en la hoja\.'
    timeout: 10000
- assertVisible: 'Nota de QA idea para un post sobre validar un MVP con clientes'
- assertVisible:
    id: capture-para-post
    selected: true
- takeScreenshot: 05-captura-11-deshecho-con-el-borrador

# The same draft goes again.
- scrollUntilVisible:
    element:
      id: capture-send
    direction: DOWN
    timeout: 15000
- tapOn:
    id: capture-send
    waitToSettleTimeoutMs: 500
- takeScreenshot: 05-captura-tras-enviar-2
- extendedWaitUntil:
    visible: 'Enviado al equipo\.'
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 15000

# ---------------------------------------------------------------- «Lo que enviaste»
# cubre: CAP-11, CAP-10
- tapOn:
    id: capture-button
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: capture-historial
    timeout: 20000
# Three seeded captures (one is the «lo antes posible» example) and the one sent again (the undone one is not listed).
- extendedWaitUntil:
    visible: 'Lo que enviaste · 4'
    timeout: 20000
- tapOn:
    id: capture-historial
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Volver a la captura'
    timeout: 15000
# The new capture comes first: what it carries, when and what for, its state (no worker runs in CI, so it stays
# received) and «Deshacer» for its first 2 minutes. Badges are upper case on screen; Maestro matches ignoring case.
- extendedWaitUntil:
    visible: 'Nota de QA idea para un post sobre validar un MVP con clientes'
    timeout: 20000
- assertVisible: 'Nota'
- assertVisible: 'Hoy, .* · Idea para un post'
- assertVisible: 'Recibida|Transcribiendo|Procesando|En la mesa editorial'
- assertVisible: 'El equipo lo recibió'
- assertVisible:
    text: 'Deshacer'
    below:
      text: 'Nota de QA idea para un post sobre validar un MVP con clientes'
- takeScreenshot: 05-captura-12-historial-nueva

# «Deshacer» from the history: «Envío deshecho.» shows over the sheet, and the capture leaves the list at once.
- tapOn:
    text: 'Deshacer'
    below:
      text: 'Nota de QA idea para un post sobre validar un MVP con clientes'
    waitToSettleTimeoutMs: 500
- takeScreenshot: 05-captura-13-historial-deshecho
- extendedWaitUntil:
    visible: 'Envío deshecho\.'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Nota de QA idea para un post sobre validar un MVP con clientes'
    timeout: 10000
- assertVisible: 'Lo que enviaste · 3'

# The seeded ones, newest first: the transcribed voice note that became a fact, and the idea used in a piece.
- scrollUntilVisible:
    element:
      text: 'Dato guardado'
    direction: DOWN
    timeout: 20000
- assertVisible: '.*Fundé ProjectApp en 2019 en Medellín.*'
- assertVisible: 'Está en Lo que el equipo sabe de ti · ProjectApp'
- assertVisible: 'Escuchar'
# The «lo antes posible» example is also «Usado» and comes first: scroll to the idea's own line.
- scrollUntilVisible:
    element:
      text: 'Usada en la pieza del .*'
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: 'Idea: contar cómo elegimos el stack de un MVP en dos días'
- assertVisible: 'Usada en la pieza del .*'
- takeScreenshot: 05-captura-14-historial-semilla
# The history was scrolled down to the idea: bring «Volver a la captura» back before tapping it, and retry the pair in
# case the history redraws while the sheet refreshes.
- retry:
    maxRetries: 2
    commands:
      - scrollUntilVisible:
          element:
            text: 'Volver a la captura'
          direction: UP
          timeout: 20000
      - tapOn: 'Volver a la captura'
- extendedWaitUntil:
    visible:
      id: capture-grabar
    timeout: 15000
- tapOn:
    id: capture-cerrar
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: capture-sheet
    timeout: 15000
