# cubre: NOT-01, NOT-02, NOT-03, NOT-04, NOT-05
# Notificaciones: what is coming («Próximo», computed) and what happened in the last 7 days, read and unread.
# The bell carries a dot while something is unread; the dropdown (Todas, Sin leer and one section); tapping a row marks it read
# and opens its link in the app (the blocked piece, Andrés Restrepo's card); «Marcar todo como leído» clears
# the «Nueva» rows and the bell's dot.
# The seed (seed_qa) gives 5 unread rows, 2 read ones and 2 «Próximo» rows.
appId: co.projectapp.office
name: Notificaciones
tags: [notificaciones]
---
- runFlow: comun/entrar.yaml

# ---------------------------------------------------------------- the bell
# cubre: NOT-05
- extendedWaitUntil:
    visible:
      id: unread-dot
    timeout: 30000
- assertVisible:
    id: top-notificaciones
    text: 'Notificaciones, hay novedades'
- takeScreenshot: 06-notificaciones-01-campana
- tapOn:
    id: top-notificaciones
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: screen-notificaciones
    timeout: 30000

# ---------------------------------------------------------------- «Próximo»: tomorrow's piece and the invitations
# cubre: NOT-03
- extendedWaitUntil:
    visible: 'Pr[óÓ]ximo'
    timeout: 30000
- assertVisible: 'Sale la pieza «Documentar decisiones vale más que documentar tareas»'
- assertVisible: 'Puedes vetarla en el detalle hasta las .*'
- assertVisible: 'El equipo invitará a [0-9]+ personas? que encajan'
# The dropdown starts on «Todas».
- assertVisible:
    id: notif-filtro
- takeScreenshot: 06-notificaciones-02-proximo

# ---------------------------------------------------------------- the last 7 days
# cubre: NOT-01
# Unread rows say «Nueva» (it ends their accessible label); read ones do not. Each search starts from the
# top because the rows are grouped by day, newest first.
- scrollUntilVisible:
    element:
      text: '.*Andrés Restrepo aceptó tu invitación.*Nueva'
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible: 'Andrés Restrepo aceptó tu invitación'
- runFlow: comun/notificaciones-arriba.yaml
- scrollUntilVisible:
    element:
      text: '.*El verificador bloqueó la pieza del [0-9]{2}/[0-9]{2}.*Nueva'
    direction: DOWN
    timeout: 30000
- runFlow: comun/notificaciones-arriba.yaml
- scrollUntilVisible:
    element:
      text: '.*Tu nota quedó en Lo que el equipo sabe de ti.*Nueva'
    direction: DOWN
    timeout: 30000
- takeScreenshot: 06-notificaciones-03-sin-leer-en-todas
- runFlow: comun/notificaciones-arriba.yaml
- scrollUntilVisible:
    element:
      text: 'Oportunidad con Mauricio Peña: Propuesta'
    direction: DOWN
    timeout: 30000
- assertNotVisible: '.*Oportunidad con Mauricio Peña: Propuesta.*Nueva'
- runFlow: comun/notificaciones-arriba.yaml
- scrollUntilVisible:
    element:
      text: 'Se publicó la pieza «Las startups pierden meses.*'
    direction: DOWN
    timeout: 30000
- assertNotVisible: '.*Se publicó la pieza «Las startups pierden meses.*Nueva'
- takeScreenshot: 06-notificaciones-04-leidas
- scrollUntilVisible:
    element:
      text: 'Se guardan 7 días\..*'
    direction: DOWN
    timeout: 20000

# ---------------------------------------------------------------- filter «Sin leer»
# cubre: NOT-02
# Only the unread rows: «Próximo» and what was read leave the list.
- runFlow: comun/notificaciones-arriba.yaml
- tapOn:
    id: notif-filtro
- tapOn:
    text: 'Sin leer'
    below:
      id: notif-filtro
# Today's unread row heads the list once «Sin leer» has answered.
- extendedWaitUntil:
    visible: 'La pieza de mañana está lista'
    timeout: 20000
- assertNotVisible: 'Pr[óÓ]ximo'
- assertNotVisible: 'Sale la pieza .*'
- takeScreenshot: 06-notificaciones-05-filtro-sin-leer
- scrollUntilVisible:
    element:
      text: 'Andrés Restrepo aceptó tu invitación'
    direction: DOWN
    timeout: 20000
# Down to the end of the (short) list: the read rows are not there either.
- scrollUntilVisible:
    element:
      text: 'Se guardan 7 días\..*'
    direction: DOWN
    timeout: 20000
- assertNotVisible: 'Oportunidad con Mauricio Peña: Propuesta'
- assertNotVisible: 'Se publicó la pieza .*'
# A section alone: «Próximo» keeps only what is coming.
- runFlow: comun/notificaciones-arriba.yaml
- tapOn:
    id: notif-filtro
- tapOn:
    text: 'Pr[óÓ]ximo'
    below:
      id: notif-filtro
- extendedWaitUntil:
    visible: 'Sale la pieza «Documentar decisiones vale más que documentar tareas»'
    timeout: 20000
- assertNotVisible: 'Andrés Restrepo aceptó tu invitación'
- takeScreenshot: 06-notificaciones-05b-seccion-proximo
- tapOn:
    id: notif-filtro
- tapOn:
    text: 'Todas'
    below:
      id: notif-filtro
- extendedWaitUntil:
    visible: 'Pr[óÓ]ximo'
    timeout: 20000

# ---------------------------------------------------------------- a row opens its link: the blocked piece
# cubre: NOT-04
- scrollUntilVisible:
    element:
      text: 'El verificador bloqueó la pieza del [0-9]{2}/[0-9]{2}'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: 'El verificador bloqueó la pieza del [0-9]{2}/[0-9]{2}'
- extendedWaitUntil:
    visible:
      id: pieza
    timeout: 30000
- extendedWaitUntil:
    visible: 'Bloqueada por el verificador'
    timeout: 30000
- assertVisible: 'Pieza del .*'
- takeScreenshot: 06-notificaciones-06-pieza-bloqueada
- back
- extendedWaitUntil:
    visible:
      id: screen-notificaciones
    timeout: 20000
# It was marked read on the way: same row, no «Nueva».
- extendedWaitUntil:
    visible: 'El verificador bloqueó la pieza del [0-9]{2}/[0-9]{2}'
    timeout: 15000
- extendedWaitUntil:
    notVisible: '.*El verificador bloqueó la pieza del [0-9]{2}/[0-9]{2}.*Nueva'
    timeout: 15000
- takeScreenshot: 06-notificaciones-07-pieza-leida

# ---------------------------------------------------------------- and the connection that fits: his person card
- runFlow: comun/notificaciones-arriba.yaml
- scrollUntilVisible:
    element:
      text: 'Andrés Restrepo aceptó tu invitación'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn: 'Andrés Restrepo aceptó tu invitación'
- extendedWaitUntil:
    visible:
      id: persona
    timeout: 30000
- assertVisible: 'Andrés Restrepo'
- takeScreenshot: 06-notificaciones-08-ficha-persona
- back
- extendedWaitUntil:
    visible:
      id: screen-notificaciones
    timeout: 20000
- extendedWaitUntil:
    notVisible: '.*Andrés Restrepo aceptó tu invitación.*Nueva'
    timeout: 15000
# Three unread left: the dot stays.
- assertVisible:
    id: unread-dot

# ---------------------------------------------------------------- «Marcar todo como leído»
# cubre: NOT-02, NOT-05
- runFlow: comun/notificaciones-arriba.yaml
- tapOn:
    id: notif-marcar-todo
# «Nueva» fades row after row, and the bell's dot closes.
- extendedWaitUntil:
    notVisible:
      id: unread-dot
    timeout: 20000
- extendedWaitUntil:
    notVisible: 'Nueva'
    timeout: 20000
- assertVisible:
    id: top-notificaciones
    text: 'Notificaciones'
- takeScreenshot: 06-notificaciones-09-todo-leido
# «Sin leer» is now empty.
- tapOn:
    id: notif-filtro
- tapOn:
    text: 'Sin leer'
    below:
      id: notif-filtro
- extendedWaitUntil:
    visible: 'No hay nada nuevo\. Lo de días anteriores sigue en el Calendario\.'
    timeout: 20000
- assertNotVisible: 'Andrés Restrepo aceptó tu invitación'
- takeScreenshot: 06-notificaciones-10-sin-leer-vacio
