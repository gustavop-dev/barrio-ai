- takeScreenshot: 12-oportunidades-11-editada
# «Eliminar» asks first, in the same sheet.
- tapOn: "Editar la oportunidad con Isabel Duarte"
- extendedWaitUntil:
    visible:
      id: opportunity-form
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Eliminar"
      childOf:
        id: opportunity-form
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    text: "Eliminar"
    childOf:
      id: opportunity-form
- extendedWaitUntil:
    visible:
      text: "Eliminar la oportunidad"
      childOf:
        id: opportunity-form
    timeout: 10000
- assertVisible: "Se borra la oportunidad con Isabel Duarte y su historial\\. Deja de contar en Resultados\\. No se puede deshacer\\."
- takeScreenshot: 12-oportunidades-12-confirmar-eliminar
- tapOn:
    text: "Eliminar"
    childOf:
      id: opportunity-form
- extendedWaitUntil:
    notVisible:
      id: opportunity-form
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "Oportunidad eliminada"
      childOf:
        id: toast
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Isabel Duarte"
    timeout: 15000
- assertNotVisible:
    id: opp-248c540a-0323-5363-a6b1-ea307f707153
- takeScreenshot: 12-oportunidades-13-eliminada
