# cubre: PRS-01, PRS-02, PRS-03, PRS-04, PRS-05, PRS-09, PRS-10, BAR-11
# Personas › Conexiones (Gustavo, 12/11/2026: only the people who accepted, by their role) and Laura's card. With the
# failure switch, the empty Conexiones («Todavía no hay conexiones») and a failed load with «Reintentar». The tabs; the
# network-off warning of the QA server; the seed's five connections (Andrés, Sofía, Valentina, Jorge, Mariana) and no
# one from the agents' queue (a search for «Laura», who only fits, finds nobody); each row (role or «Sin etiqueta»,
# headline, place, «Aceptó el …», «Te toca»); the «Antes» section (Mariana accepted 45 days ago); the role chips with
# their counts (Compradores → Andrés and Sofía, Sin etiqueta → Jorge at the end of the strip, and back to «Todas»); the
# search box («Sof», «Laura» with «Quitar filtros»). Laura's card, opened from its link as a notification would (the
# card opens anybody, connected or not): header, next step, journey, «Por qué encaja», «De dónde salió», no
# conversation yet, no notes yet, a written note (an empty one cannot be saved) and the history; then «Marcar como
# oportunidad» registers one and the card shows it.
# Oportunidades, Referentes and the other cards have their own flows (12-oportunidades, 13-referentes, 14-fichas).
# Maestro matches text case-insensitively, so badges and section labels (drawn UPPERCASE) match in any case. Rows are
# found by their testID (person-<id>; the seed's ids are fixed uuid5 values). The dates of the seed are relative to
# today, so only «Antes» (more than a month ago) is a fixed section.
appId: co.projectapp.office
name: Personas
tags: [personas]
---
- runFlow: comun/entrar.yaml

# ---------------------------------------------------------------- Conexiones empty, then a failed load and «Reintentar»
# cubre: PRS-01
# The failure switch (comun/qa-fallo.js) empties the list first, then makes it fail.
- runScript:
    file: comun/qa-fallo.js
    env:
      RUTA: '^/api/v1/red/contacts$'
      METODO: GET
      EFECTO: vacio
      VECES: '-1'
- tapOn:
    id: tab-personas
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Todavía no hay conexiones"
    timeout: 30000
- assertVisible: "Aquí aparece cada persona cuando acepta la invitación\\."
- takeScreenshot: 09-personas-01-vacio
# A failing load shows the error with «Reintentar», which brings the people back.
- runScript: comun/qa-fallos-limpiar.js
- runScript:
    file: comun/qa-fallo.js
    env:
      RUTA: '^/api/v1/red/contacts$'
      METODO: GET
      EFECTO: '500'
      VECES: '-1'
- tapOn:
    text: "Compradores( · \\d+)?"
    childOf:
      id: role-chips
- extendedWaitUntil:
    visible: "Reintentar"
    timeout: 30000
- takeScreenshot: 09-personas-02-error
- runScript: comun/qa-fallos-limpiar.js
- tapOn: "Reintentar"
- extendedWaitUntil:
    visible: "Andrés Restrepo"
    timeout: 20000
# The chosen chip again goes back to every connection.
- tapOn:
    text: "Compradores( · \\d+)?"
    childOf:
      id: role-chips
- extendedWaitUntil:
    visible:
      id: barrio-list
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Todas · 5"
      childOf:
        id: role-chips
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "person-.*"
    timeout: 30000

# ---------------------------------------------------------------- Conexiones: tabs, warnings and rows
# cubre: PRS-01
- assertVisible: Conexiones
- assertVisible: Oportunidades
- assertVisible: Referentes
- assertNotVisible: Barrio
# The QA server runs with the network off (NETWORK_ENABLED unset), and red/summary says so.
- assertVisible: "La red está apagada en el servidor"
- assertVisible: "El equipo no descubre ni propone a nadie nuevo\\. Lo guardado sigue aquí\\."
- takeScreenshot: 09-personas-03-conexiones
# Sofía's row (person-<uuid5 of contact:sofia-martinez>): role, headline, place, when she accepted and «Te toca» (her
# message waits for Gustavo).
- scrollUntilVisible:
    element:
      id: person-4774e211-6ce5-51fc-be4f-462d4c0a5b60
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    text: Sofía Martínez
    childOf:
      id: person-4774e211-6ce5-51fc-be4f-462d4c0a5b60
- assertVisible:
    text: Comprador
    childOf:
      id: person-4774e211-6ce5-51fc-be4f-462d4c0a5b60
- assertVisible:
    text: Gerente de una cooperativa de ahorro
    childOf:
      id: person-4774e211-6ce5-51fc-be4f-462d4c0a5b60
- assertVisible:
    text: "Medellín, Colombia"
    childOf:
      id: person-4774e211-6ce5-51fc-be4f-462d4c0a5b60
- assertVisible:
    text: "Aceptó el \\d{2}/\\d{2}"
    childOf:
      id: person-4774e211-6ce5-51fc-be4f-462d4c0a5b60
- assertVisible:
    text: Te toca
    childOf:
      id: person-4774e211-6ce5-51fc-be4f-462d4c0a5b60
- takeScreenshot: 09-personas-04-filas
# Jorge (contact:jorge-castillo) accepted without a role yet; Mariana (contact:mariana-lopez) accepted 45 days ago, so
# she is the last one, under «Antes».
- scrollUntilVisible:
    element:
      id: person-84b568da-b9d2-5a13-81ff-543e669734a6
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    text: Sin etiqueta
    childOf:
      id: person-84b568da-b9d2-5a13-81ff-543e669734a6
- assertVisible:
    text: Ingeniero de datos en una cadena de retail
    childOf:
      id: person-84b568da-b9d2-5a13-81ff-543e669734a6
- scrollUntilVisible:
    element:
      id: person-104b5e7b-f211-57df-8ba8-78f6e0fff5b9
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    text: Divulgador
    childOf:
      id: person-104b5e7b-f211-57df-8ba8-78f6e0fff5b9
- assertVisible:
    id: conexiones-antes
- assertVisible: "Antes"
- takeScreenshot: 09-personas-05-antes
- scrollUntilVisible:
    element:
      id: role-chips
    direction: UP
    timeout: 30000

# ---------------------------------------------------------------- Conexiones: the role chips
# cubre: PRS-01, PRS-02
- assertVisible:
    text: "Todas · 5"
    childOf:
      id: role-chips
- tapOn:
    text: "Compradores · 2"
    childOf:
      id: role-chips
- extendedWaitUntil:
    visible: "Andrés Restrepo"
    timeout: 15000
# Only two rows now: at the end of the list there is Sofía, and Valentina (a par) is not there.
- scrollUntilVisible:
    element:
      text: "Sofía Martínez"
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertNotVisible: "Valentina Castro"
- takeScreenshot: 09-personas-06-compradores
- scrollUntilVisible:
    element:
      id: role-chips
    direction: UP
    timeout: 30000
# «Sin etiqueta» sits at the end of the strip: swipe it until the chip shows.
- repeat:
    times: 6
    while:
      notVisible:
        text: "Sin etiqueta · 1"
        childOf:
          id: role-chips
    commands:
      - swipe:
          from:
            id: role-chips
          direction: LEFT
- tapOn:
    text: "Sin etiqueta · 1"
    childOf:
      id: role-chips
- extendedWaitUntil:
    visible: "Jorge Castillo"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Andrés Restrepo"
    timeout: 10000
- takeScreenshot: 09-personas-07-sin-etiqueta
# The chosen chip again goes back to «Todas».
- tapOn:
    text: "Sin etiqueta · 1"
    childOf:
      id: role-chips
- extendedWaitUntil:
    visible: "Andrés Restrepo"
    timeout: 15000
- repeat:
    times: 6
    while:
      notVisible:
        text: "Todas · 5"
        childOf:
          id: role-chips
    commands:
      - swipe:
          from:
            id: role-chips
          direction: RIGHT

# ---------------------------------------------------------------- Conexiones: the search box
# cubre: PRS-02
- tapOn:
    id: barrio-search
- inputText: "Sof"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Sofía Martínez"
    timeout: 15000
# Every letter stays in the box (the URL catching up late used to put back an older search).
- extendedWaitUntil:
    visible:
      id: barrio-search
      text: "Sof"
    timeout: 5000
- extendedWaitUntil:
    notVisible: "Andrés Restrepo"
    timeout: 10000
- takeScreenshot: 09-personas-08-buscar-sofia
- tapOn: "Borrar la búsqueda"
# Laura only fits (she is the agents' queue, not a connection): nobody matches, and «Quitar filtros» brings everybody back.
- tapOn:
    id: barrio-search
- inputText: "Laura"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Nadie coincide"
    timeout: 15000
# Every letter stays in the box (the URL catching up late used to put back an older search).
- extendedWaitUntil:
    visible:
      id: barrio-search
      text: "Laura"
    timeout: 5000
- takeScreenshot: 09-personas-09-sin-resultados
- tapOn: "Quitar filtros"
- extendedWaitUntil:
    visible:
      id: "person-.*"
    timeout: 15000
- assertNotVisible: "Nadie coincide"

# ---------------------------------------------------------------- Laura's card, from its link
# cubre: PRS-03
# A notification or a card links to people who are not connections (the lead's doubt, a new invitation): the card
# opens any of them by id.
- openLink: oficina0ff1ce://personas/547cd492-cd91-542a-976e-3a1f11029285
- extendedWaitUntil:
    visible:
      id: persona
    timeout: 30000
# React Native flattens the header: the name is its own node (persona-name), not a child of persona-head.
- extendedWaitUntil:
    visible:
      id: persona-name
    timeout: 15000
- assertVisible: "Laura Gómez"
- assertVisible: "ENCAJA"
- assertVisible: "Head of Product en un marketplace B2B"
- assertVisible: "Medellín, Colombia · 2\\.º grado"
- assertVisible: "Abrir en LinkedIn"
- assertVisible: "Marcar como oportunidad"
# Laura is in «Encaja»: she can be discarded (the discard itself is in 14-fichas).
- assertVisible: "Descartar"
- assertVisible:
    id: next-step
- assertVisible:
    text: "Siguiente paso · Equipo.*El equipo (va a seguirla|la seguirá).*"
- takeScreenshot: 09-personas-13-ficha
- scrollUntilVisible:
    element:
      id: journey
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: journey-discovered
- assertVisible:
    id: journey-followed
- takeScreenshot: 09-personas-14-recorrido
# «Por qué encaja»: the reason and the confidence.
- scrollUntilVisible:
    element:
      text: "Lidera producto en un marketplace B2B y pregunta por equipos externos\\."
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Confianza 82 %"
# «De dónde salió»: the comment that brought her.
- scrollUntilVisible:
    element:
      text: ".*validar con clientes reales nos ahorró meses.*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Comentó en un post de un referente"
- takeScreenshot: 09-personas-15-por-que-encaja
# cubre: PRS-04
- scrollUntilVisible:
    element:
      text: "Aún no hay una conversación leída con esta persona"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Cuando el equipo lea tu inbox de LinkedIn verás aquí sus últimos mensajes y su lectura\\. La app nunca envía mensajes\\."
- takeScreenshot: 09-personas-16-sin-conversacion
- scrollUntilVisible:
    element:
      text: "HISTORIAL COMPLETO"
      childOf:
        id: persona
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "history|history-empty"
- takeScreenshot: 09-personas-17-historial

# ---------------------------------------------------------------- Laura's card: a written note
# cubre: PRS-05
- scrollUntilVisible:
    element:
      text: "Aún no hay notas sobre esta persona\\."
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    text: "Añadir nota"
    childOf:
      id: persona
- extendedWaitUntil:
    visible:
      id: note-text
    timeout: 10000
- hideKeyboard
# An empty note cannot be saved.
- assertVisible:
    text: "Guardar nota"
    childOf:
      id: persona
    enabled: false
- tapOn:
    id: note-text
- inputText: "Nota de QA sobre su marketplace B2B"
# The note being written stays above the keyboard (the card scrolls it into view).
- assertVisible:
    id: note-text
- takeScreenshot: 09-personas-17b-nota-con-teclado
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Guardar nota"
      childOf:
        id: persona
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    text: "Guardar nota"
    childOf:
      id: persona
- extendedWaitUntil:
    visible:
      text: "Nota guardada"
      childOf:
        id: toast
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Nota de QA sobre su marketplace B2B"
      childOf:
        id: persona
    direction: UP
    centerElement: true
    timeout: 15000
- assertVisible: "Tu nota · .*"
- assertNotVisible:
    id: note-text
- assertNotVisible: "Aún no hay notas sobre esta persona\\."
- takeScreenshot: 09-personas-18-nota-guardada

# ---------------------------------------------------------------- «Marcar como oportunidad» from her card
# cubre: PRS-09, PRS-10
- scrollUntilVisible:
    element:
      text: "Marcar como oportunidad"
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn: "Marcar como oportunidad"
- extendedWaitUntil:
    visible:
      id: opportunity-form
    timeout: 15000
# The form arrives with Laura chosen and her modality (ProjectApp) filled in; nothing is saved yet.
- assertVisible:
    text: "Nueva oportunidad"
    childOf:
      id: opportunity-form
- assertVisible:
    id: opp-picked
- assertVisible:
    text: "Laura Gómez"
    childOf:
      id: opportunity-form
- takeScreenshot: 09-personas-19-marcar-oportunidad
- scrollUntilVisible:
    element:
      id: opp-attribution
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: opp-attribution
- tapOn:
    text: "Lo dijo la persona"
    childOf:
      id: opportunity-form
- scrollUntilVisible:
    element:
      text: "Registrar oportunidad"
      childOf:
        id: opportunity-form
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    text: "Registrar oportunidad"
    childOf:
      id: opportunity-form
    waitToSettleTimeoutMs: 500
- takeScreenshot: 09-personas-19b-tras-registrar
- extendedWaitUntil:
    visible:
      text: "Oportunidad registrada"
      childOf:
        id: toast
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: opportunity-form
    timeout: 20000
# The card now shows the opportunity (new today, with «Editar oportunidad»), and her stage is «Oportunidad».
- extendedWaitUntil:
    notVisible: "Marcar como oportunidad"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Editar oportunidad"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Desde hoy en esta etapa"
- takeScreenshot: 09-personas-20-con-oportunidad
- scrollUntilVisible:
    element:
      id: persona-name
    direction: UP
    timeout: 30000
- assertVisible: "OPORTUNIDAD"
- back
- extendedWaitUntil:
    notVisible:
      id: persona
    timeout: 15000
- assertVisible:
    id: barrio-list
