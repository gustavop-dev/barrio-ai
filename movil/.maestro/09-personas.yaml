# cubre: PRS-01, PRS-02, PRS-03, PRS-04, PRS-05, PRS-09, PRS-10
# Personas › Barrio and Laura's card. The tabs; the network-off warning of the QA server; each row (stage, headline,
# role and modality chips, «Sin clasificar todavía»); the stage chips (Por clasificar → Pedro Salazar, Encaja → Laura
# Gómez, Oportunidad → Andrés Restrepo and Valentina Castro, «En conversación · aún no disponible», Te invitó →
# Natalia Rojas at the end of the strip); the search box («Pedro», a search nobody matches with «Quitar filtros»,
# «Laura»); «Más filtros» with a role, the active-filter count and «Quitar estos filtros». Laura's card: header,
# next step, journey, «Por qué encaja», «De dónde salió», no conversation yet, no notes yet, a written note (an empty
# one cannot be saved) and the history; then «Marcar como oportunidad» registers one and the card shows it.
# Oportunidades, Referentes and the other cards have their own flows (12-oportunidades, 13-referentes, 14-fichas).
# Maestro matches text case-insensitively, so badges and section labels (drawn UPPERCASE) match in any case. Rows are
# found by their testID (person-<id>; the seed's ids are fixed uuid5 values).
appId: co.projectapp.office
name: Personas
tags: [personas]
---
- runFlow: comun/entrar.yaml
- tapOn:
    id: tab-personas
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: barrio-list
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Todas · \\d+"
      childOf:
        id: stage-chips
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "person-.*"
    timeout: 30000

# ---------------------------------------------------------------- Barrio: tabs, warnings and rows
# cubre: PRS-01
- assertVisible: Barrio
- assertVisible: Oportunidades
- assertVisible: Referentes
# The QA server runs with the network off (NETWORK_ENABLED unset), and red/summary says so.
- assertVisible: "La red está apagada en el servidor"
- assertVisible: "El equipo no descubre ni propone a nadie nuevo\\. Lo guardado sigue aquí\\."
- takeScreenshot: 09-personas-01-barrio
# Laura's row (person-<uuid5 of contact:laura-gomez>): stage, headline, role and modality chips, origin and activity.
- scrollUntilVisible:
    element:
      id: person-547cd492-cd91-542a-976e-3a1f11029285
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    text: Laura Gómez
    childOf:
      id: person-547cd492-cd91-542a-976e-3a1f11029285
- assertVisible:
    text: Encaja
    childOf:
      id: person-547cd492-cd91-542a-976e-3a1f11029285
- assertVisible:
    text: Head of Product en un marketplace B2B
    childOf:
      id: person-547cd492-cd91-542a-976e-3a1f11029285
- assertVisible:
    text: Comprador
    childOf:
      id: person-547cd492-cd91-542a-976e-3a1f11029285
- assertVisible:
    text: ProjectApp
    childOf:
      id: person-547cd492-cd91-542a-976e-3a1f11029285
- assertVisible:
    text: "Comentó en un post de un referente · .*"
    childOf:
      id: person-547cd492-cd91-542a-976e-3a1f11029285
# Pedro (contact:pedro-salazar) has no classification yet.
- scrollUntilVisible:
    element:
      id: person-5ede725c-3221-5088-8e6d-334ca462e9b0
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    text: Sin clasificar todavía
    childOf:
      id: person-5ede725c-3221-5088-8e6d-334ca462e9b0
- takeScreenshot: 09-personas-02-filas
- scrollUntilVisible:
    element:
      id: stage-chips
    direction: UP
    timeout: 30000

# ---------------------------------------------------------------- Barrio: the stage chips
# cubre: PRS-01, PRS-02
- tapOn:
    text: "Por clasificar( · \\d+)?"
    childOf:
      id: stage-chips
- extendedWaitUntil:
    visible: "Pedro Salazar"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Laura Gómez"
    timeout: 10000
- takeScreenshot: 09-personas-03-por-clasificar
- tapOn:
    text: "Encaja( · \\d+)?"
    childOf:
      id: stage-chips
- extendedWaitUntil:
    visible: "Laura Gómez"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Pedro Salazar"
    timeout: 10000
- takeScreenshot: 09-personas-04-encaja
# «Oportunidad» lists the people with an open opportunity; «En conversación» has no count yet and is disabled.
- repeat:
    times: 6
    while:
      notVisible:
        text: "Oportunidad( · \\d+)?"
        childOf:
          id: stage-chips
    commands:
      - swipe:
          from:
            id: stage-chips
          direction: LEFT
- assertVisible:
    text: "En conversación · aún no disponible"
    enabled: false
- tapOn:
    text: "Oportunidad( · \\d+)?"
    childOf:
      id: stage-chips
- extendedWaitUntil:
    visible: "Andrés Restrepo"
    timeout: 15000
- assertVisible: "Valentina Castro"
- assertNotVisible: "Laura Gómez"
- takeScreenshot: 09-personas-05-oportunidad
# «Te invitó» sits at the end of the strip: swipe it until the chip shows.
- repeat:
    times: 6
    while:
      notVisible:
        text: "Te invitó( · \\d+)?"
        childOf:
          id: stage-chips
    commands:
      - swipe:
          from:
            id: stage-chips
          direction: LEFT
- tapOn:
    text: "Te invitó( · \\d+)?"
    childOf:
      id: stage-chips
- extendedWaitUntil:
    visible: "Natalia Rojas"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Laura Gómez"
    timeout: 10000
- takeScreenshot: 09-personas-06-te-invito
# Back to «Todas», at the start of the strip.
- repeat:
    times: 6
    while:
      notVisible:
        text: "Todas( · \\d+)?"
        childOf:
          id: stage-chips
    commands:
      - swipe:
          from:
            id: stage-chips
          direction: RIGHT
- tapOn:
    text: "Todas( · \\d+)?"
    childOf:
      id: stage-chips

# ---------------------------------------------------------------- Barrio: the search box (no stage filter now)
# cubre: PRS-02
- tapOn:
    id: barrio-search
- inputText: "Pedro"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Pedro Salazar"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Laura Gómez"
    timeout: 10000
- takeScreenshot: 09-personas-07-buscar-pedro
- tapOn: "Borrar la búsqueda"
# Nobody matches: the empty state offers «Quitar filtros», which brings everybody back.
- tapOn:
    id: barrio-search
- inputText: "zzzqa"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Nadie coincide con estos filtros"
    timeout: 15000
- hideKeyboard
- takeScreenshot: 09-personas-08-sin-resultados
- tapOn: "Quitar filtros"
- extendedWaitUntil:
    visible:
      id: "person-.*"
    timeout: 15000
- assertNotVisible: "Nadie coincide con estos filtros"

# ---------------------------------------------------------------- Barrio: «Más filtros» (role, modality, origin)
# cubre: PRS-02
- tapOn: "Más filtros: rol, modalidad y origen"
- extendedWaitUntil:
    visible:
      id: barrio-filters
    timeout: 10000
- tapOn:
    id: filter-role
- tapOn:
    text: Comprador
    childOf:
      id: barrio-filters
- takeScreenshot: 09-personas-09-mas-filtros
- tapOn:
    text: Ver resultados
    childOf:
      id: barrio-filters
- extendedWaitUntil:
    notVisible:
      id: barrio-filters
    timeout: 10000
- extendedWaitUntil:
    visible: "Más filtros: rol, modalidad y origen \\(1 activo\\)"
    timeout: 15000
# Compradores: Laura is one; Julián Herrera (par) and Pedro (unclassified) are not.
- extendedWaitUntil:
    visible: "Laura Gómez"
    timeout: 15000
- assertNotVisible: "Julián Herrera"
- assertNotVisible: "Pedro Salazar"
- takeScreenshot: 09-personas-10-compradores
- tapOn: "Más filtros: rol, modalidad y origen \\(1 activo\\)"
- extendedWaitUntil:
    visible:
      id: barrio-filters
    timeout: 10000
- tapOn:
    text: Quitar estos filtros
    childOf:
      id: barrio-filters
- tapOn:
    text: Ver resultados
    childOf:
      id: barrio-filters
- extendedWaitUntil:
    visible: "Más filtros: rol, modalidad y origen"
    timeout: 15000
- tapOn:
    id: barrio-search
- inputText: "Laura"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Laura Gómez"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Pedro Salazar"
    timeout: 10000
- hideKeyboard

# ---------------------------------------------------------------- Laura's card
# cubre: PRS-03
- tapOn: "Laura Gómez"
- extendedWaitUntil:
    visible:
      id: persona
    timeout: 20000
# React Native flattens the header: the name is its own node (persona-name), not a child of persona-head.
- extendedWaitUntil:
    visible:
      id: persona-name
    timeout: 15000
- assertVisible: "Laura Gómez"
- assertVisible: "ENCAJA"
- assertVisible: "Head of Product en un marketplace B2B"
- assertVisible: "Medellín, Colombia · 2\\.º grado"
- assertVisible: "Abrir en LinkedIn"
- assertVisible: "Marcar como oportunidad"
# Laura is in «Encaja»: she can be discarded (the discard itself is in 14-fichas).
- assertVisible: "Descartar"
- assertVisible:
    id: next-step
- assertVisible:
    text: "Siguiente paso · Equipo.*El equipo (va a seguirla|la seguirá).*"
- takeScreenshot: 09-personas-11-ficha
- scrollUntilVisible:
    element:
      id: journey
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: journey-discovered
- assertVisible:
    id: journey-followed
- takeScreenshot: 09-personas-12-recorrido
# «Por qué encaja»: the reason and the confidence.
- scrollUntilVisible:
    element:
      text: "Lidera producto en un marketplace B2B y pregunta por equipos externos\\."
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Confianza 82 %"
# «De dónde salió»: the comment that brought her.
- scrollUntilVisible:
    element:
      text: ".*validar con clientes reales nos ahorró meses.*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Comentó en un post de un referente"
- takeScreenshot: 09-personas-13-por-que-encaja
# cubre: PRS-04
- scrollUntilVisible:
    element:
      text: "Aún no hay una conversación leída con esta persona"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: "Cuando el equipo lea tu inbox de LinkedIn verás aquí sus últimos mensajes y su lectura\\. La app nunca envía mensajes\\."
- takeScreenshot: 09-personas-14-sin-conversacion
- scrollUntilVisible:
    element:
      text: "HISTORIAL COMPLETO"
      childOf:
        id: persona
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible:
    id: "history|history-empty"
- takeScreenshot: 09-personas-15-historial

# ---------------------------------------------------------------- Laura's card: a written note
# cubre: PRS-05
- scrollUntilVisible:
    element:
      text: "Aún no hay notas sobre esta persona\\."
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn:
    text: "Añadir nota"
    childOf:
      id: persona
- extendedWaitUntil:
    visible:
      id: note-text
    timeout: 10000
- hideKeyboard
# An empty note cannot be saved.
- assertVisible:
    text: "Guardar nota"
    childOf:
      id: persona
    enabled: false
- tapOn:
    id: note-text
- inputText: "Nota de QA sobre su marketplace B2B"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Guardar nota"
      childOf:
        id: persona
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    text: "Guardar nota"
    childOf:
      id: persona
- extendedWaitUntil:
    visible:
      text: "Nota guardada"
      childOf:
        id: toast
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Nota de QA sobre su marketplace B2B"
      childOf:
        id: persona
    direction: UP
    centerElement: true
    timeout: 15000
- assertVisible: "Tu nota · .*"
- assertNotVisible:
    id: note-text
- assertNotVisible: "Aún no hay notas sobre esta persona\\."
- takeScreenshot: 09-personas-16-nota-guardada

# ---------------------------------------------------------------- «Marcar como oportunidad» from her card
# cubre: PRS-09, PRS-10
- scrollUntilVisible:
    element:
      text: "Marcar como oportunidad"
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn: "Marcar como oportunidad"
- extendedWaitUntil:
    visible:
      id: opportunity-form
    timeout: 15000
# The form arrives with Laura chosen and her modality (ProjectApp) filled in; nothing is saved yet.
- assertVisible:
    text: "Nueva oportunidad"
    childOf:
      id: opportunity-form
- assertVisible:
    text: "Laura Gómez"
    childOf:
      id: opp-picked
- takeScreenshot: 09-personas-17-marcar-oportunidad
- scrollUntilVisible:
    element:
      id: opp-attribution
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: opp-attribution
- tapOn:
    text: "Lo dijo la persona"
    childOf:
      id: opportunity-form
- scrollUntilVisible:
    element:
      text: "Registrar oportunidad"
      childOf:
        id: opportunity-form
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    text: "Registrar oportunidad"
    childOf:
      id: opportunity-form
- extendedWaitUntil:
    notVisible:
      id: opportunity-form
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "Oportunidad registrada"
      childOf:
        id: toast
    timeout: 15000
# The card now shows the opportunity (new today, with «Editar oportunidad»), and her stage is «Oportunidad».
- extendedWaitUntil:
    notVisible: "Marcar como oportunidad"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Editar oportunidad"
    direction: DOWN
    centerElement: true
    timeout: 30000
- assertVisible: "Desde hoy en esta etapa"
- takeScreenshot: 09-personas-18-con-oportunidad
- scrollUntilVisible:
    element:
      id: persona-name
    direction: UP
    timeout: 30000
- assertVisible: "OPORTUNIDAD"
- back
- extendedWaitUntil:
    notVisible:
      id: persona
    timeout: 15000
- assertVisible:
    id: barrio-list
