# cubre: CAP-04, CAP-05, CAP-06, IMG-16
# Captura with files, the regression of PR #43 (with expo/fetch as the global fetch, a capture with a photo or an audio
# never left the phone): a photo picked from the phone's gallery and a voice note recorded by holding the button reach
# the backend. Each one shows the toast «Enviado al equipo.» and its row in «Lo que enviaste» («1 foto», «Audio 0:0N»).
# Then the error states: without network, and a 413 from the API. The sheet says why, keeps the draft and sends it
# again with «Reintentar». (The Galería that showed the photo arrive left the app on 12/11/2026.)
#
# Used from Resultados (a still screen, see 05-captura).
# The microphone: the CI emulator runs with -noaudio and records silence; the audio still travels as a real m4a file.
# The 413 comes from the QA failure switch (team_backend.qa_fallos, comun/qa-fallo.js).
appId: co.projectapp.office
name: Captura con fotos y audio
tags: [captura]
onFlowComplete:
  # Never leave the emulator offline for the next flow.
  - setAirplaneMode: disabled
---
- runFlow: comun/entrar.yaml
- tapOn:
    id: tab-resultados
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: resultados-list
    timeout: 30000

# ---------------------------------------------------------------- a photo from the phone's gallery
# cubre: CAP-05
- tapOn:
    id: capture-button
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: capture-sheet
    timeout: 20000
- tapOn:
    id: capture-galeria
    waitToSettleTimeoutMs: 500
- runFlow:
    file: comun/elegir-foto.yaml
    env:
      CAPTURA: 05-envios-01-selector-de-fotos
- extendedWaitUntil:
    visible:
      id: capture-fotos
    timeout: 25000
# The thumbnail pops in (MovCaptura, durations.base): wait for it to be on screen, not only its row. A thumbnail that
# never shows (QA 42497299487: an `entering` keyframe stuck at opacity 0 after the picker) still fails here.
- extendedWaitUntil:
    visible: 'Foto adjunta 1'
    timeout: 10000
- assertVisible: 'Quitar la foto 1'
# cubre: IMG-16 — all three choices, default auto, then send an explicit si.
- scrollUntilVisible:
    element:
      id: capture-ai-auto
    direction: DOWN
    centerElement: true
- assertVisible:
    id: capture-ai-auto
    checked: true
- tapOn:
    id: capture-ai-no
- assertVisible:
    id: capture-ai-no
    checked: true
- tapOn:
    id: capture-ai-si
- assertVisible:
    id: capture-ai-si
    checked: true
- takeScreenshot: 05-envios-02-edicion-ia

- scrollUntilVisible:
    element:
      id: capture-note
    direction: DOWN
    centerElement: true
- tapOn:
    id: capture-note
    waitToSettleTimeoutMs: 500
- inputText: Foto de QA de la pizarra
- hideKeyboard
- takeScreenshot: 05-envios-02-foto-adjunta
- scrollUntilVisible:
    element:
      id: capture-send
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: capture-send
    waitToSettleTimeoutMs: 500
- takeScreenshot: 05-envios-tras-enviar-1
- extendedWaitUntil:
    visible: 'Enviado al equipo\.'
    timeout: 45000
- assertNotVisible:
    id: capture-send-error
- takeScreenshot: 05-envios-03-foto-enviada
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 15000
# «Lo que enviaste»: the capture with its photo and its note.
- tapOn:
    id: capture-button
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Lo que enviaste · 4'
    timeout: 20000
- tapOn:
    id: capture-historial
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Foto de QA de la pizarra'
    timeout: 20000
- assertVisible: '1 foto'
- assertVisible: 'Nota'
- assertVisible: 'El equipo lo recibió'
- takeScreenshot: 05-envios-05-historial-foto
- tapOn: 'Volver a la captura'
- extendedWaitUntil:
    visible:
      id: capture-grabar
    timeout: 15000
- tapOn:
    id: capture-cerrar
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: capture-sheet
    timeout: 15000

# ---------------------------------------------------------------- a voice note, held on the button
# cubre: CAP-04
- longPressOn:
    id: capture-button
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: capture-sheet
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: capture-audio
    timeout: 20000
- assertVisible: '0:0[1-9]'
- takeScreenshot: 05-envios-06-audio-listo
- scrollUntilVisible:
    element:
      id: capture-send
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: capture-send
    waitToSettleTimeoutMs: 500
- takeScreenshot: 05-envios-tras-enviar-2
- extendedWaitUntil:
    visible: 'Enviado al equipo\.'
    timeout: 45000
- assertNotVisible:
    id: capture-send-error
- takeScreenshot: 05-envios-07-audio-enviado
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 15000
# «Lo que enviaste»: the audio with its length, ready to listen to.
- tapOn:
    id: capture-button
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Lo que enviaste · 5'
    timeout: 20000
- tapOn:
    id: capture-historial
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'Audio 0:0[1-9]'
    timeout: 20000
- assertVisible:
    text: 'Escuchar'
    below:
      text: 'Audio 0:0[1-9]'
- assertVisible: 'Hoy, .* · El equipo lo transcribe y decide'
- takeScreenshot: 05-envios-08-historial-audio
- tapOn: 'Volver a la captura'
- extendedWaitUntil:
    visible:
      id: capture-grabar
    timeout: 15000

# ---------------------------------------------------------------- without network
# cubre: CAP-06
# Airplane mode cuts the emulator off the runner's API (10.0.2.2); Maestro drives the device over adb, unaffected.
# It goes on first, so the phone knows it is offline (NetInfo) by the time the note is written.
- setAirplaneMode: enabled
- scrollUntilVisible:
    element:
      id: capture-note
    direction: DOWN
    centerElement: true
- tapOn:
    id: capture-note
    waitToSettleTimeoutMs: 500
- inputText: Nota de QA sin conexion
- hideKeyboard
- tapOn:
    id: capture-para-dato
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: capture-send
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: capture-send
    waitToSettleTimeoutMs: 500
- takeScreenshot: 05-envios-tras-enviar-3
# The draft stays; inspect it and then the complete error, which can extend below the viewport.
- extendedWaitUntil:
    visible:
      id: capture-send-error
    timeout: 30000
- scrollUntilVisible:
    element:
      id: capture-note
    direction: UP
    centerElement: true
    timeout: 15000
- assertVisible:
    id: capture-note
    text: 'Nota de QA sin conexion'
- scrollUntilVisible:
    element:
      id: capture-para-dato
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible:
    id: capture-para-dato
    selected: true
- scrollUntilVisible:
    element:
      id: capture-send-retry
      childOf:
        id: capture-send-error
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible:
    text: 'No hay conexión con el servidor'
    childOf:
      id: capture-send-error
- assertVisible: 'Tu audio, tus fotos y tu nota siguen aquí\. Puedes reintentar\.'
- assertNotVisible: '.*(fetch failed|Network request failed|Unsupported FormDataPart).*'
- assertVisible:
    id: capture-send-retry
    text: 'Reintentar'
    childOf:
      id: capture-send-error
- assertVisible:
    id: capture-sheet
- takeScreenshot: 05-envios-09-sin-conexion
# Back online, «Reintentar» sends the same draft (the network can take a few seconds to come back).
- setAirplaneMode: disabled
- retry:
    maxRetries: 4
    commands:
      - extendedWaitUntil:
          visible: 'Texto que nunca aparece: espera a que vuelva la red'
          timeout: 6000
          optional: true
      - scrollUntilVisible:
          element:
            id: capture-send-retry
            childOf:
              id: capture-send-error
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn:
          id: capture-send-retry
          childOf:
            id: capture-send-error
      - extendedWaitUntil:
          visible: 'Enviado al equipo\.'
          timeout: 20000
- takeScreenshot: 05-envios-10-reintentado
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 15000

# ---------------------------------------------------------------- a 413 from the API (QA failure switch)
# cubre: CAP-06
- tapOn:
    id: capture-button
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: capture-sheet
    timeout: 20000
- scrollUntilVisible:
    element:
      id: capture-note
    direction: DOWN
    centerElement: true
- tapOn:
    id: capture-note
    waitToSettleTimeoutMs: 500
- inputText: Nota de QA demasiado grande
- hideKeyboard
# The next capture POST answers 413 (once).
- runScript:
    file: comun/qa-fallo.js
    env:
      RUTA: '^/api/v1/capturas$'
      EFECTO: '413'
      METODO: POST
      VECES: '1'
- scrollUntilVisible:
    element:
      id: capture-send
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: capture-send
    waitToSettleTimeoutMs: 500
- takeScreenshot: 05-envios-tras-enviar-4
- extendedWaitUntil:
    visible:
      id: capture-send-error
    timeout: 30000
- scrollUntilVisible:
    element:
      id: capture-note
    direction: UP
    centerElement: true
    timeout: 15000
- assertVisible:
    id: capture-note
    text: 'Nota de QA demasiado grande'
- scrollUntilVisible:
    element:
      id: capture-send-retry
      childOf:
        id: capture-send-error
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible: 'El envío es demasiado grande'
- assertVisible: 'El audio puede pesar hasta 25 MB y cada foto hasta 10 MB\. Quita alguna foto o graba un audio más corto\.'
- assertVisible: 'Tu audio, tus fotos y tu nota siguen aquí\. Puedes reintentar\.'
- takeScreenshot: 05-envios-11-413
- tapOn:
    id: capture-send-retry
    childOf:
      id: capture-send-error
- extendedWaitUntil:
    visible: 'Enviado al equipo\.'
    timeout: 30000
- takeScreenshot: 05-envios-12-413-reintentado
