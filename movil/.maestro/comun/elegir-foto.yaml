# Picks the QA picture in Android's photo picker, which «Galería» in the capture sheet and «Subir fotos de perfil» in Ajustes open
# (expo-image-picker with several photos allowed). scripts/qa/correr-maestro.sh puts one of the seeded gallery PNGs in
# the emulator's Pictures before the flows, so it is the newest (and only) photo: the first cell of the grid.
# Env: CAPTURA, the name of the screenshot of the picker.
appId: co.projectapp.office
---
# The picker is another app (the media provider's photo picker; older images fall back to the documents UI).
- extendedWaitUntil:
    visible:
      id: '(com\.google\.android|com\.android)\.(providers\.media\.module|providers\.media|documentsui):id/.*'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Photo taken on.*|Foto tomada.*|Foto realizada.*|.*qa-pizarra.*'
    timeout: 20000
- takeScreenshot: ${CAPTURA}
- tapOn:
    text: 'Photo taken on.*|Foto tomada.*|Foto realizada.*|.*qa-pizarra.*'
    index: 0
    waitToSettleTimeoutMs: 500
# With several photos allowed the picker asks to confirm the selection («Add (1)»).
- runFlow:
    when:
      visible: '(Add|Agregar|Añadir|Done|Listo|Seleccionar)( \(1\))?'
    commands:
      - tapOn: '(Add|Agregar|Añadir|Done|Listo|Seleccionar)( \(1\))?'
- extendedWaitUntil:
    notVisible:
      id: '(com\.google\.android|com\.android)\.(providers\.media\.module|providers\.media|documentsui):id/.*'
    timeout: 20000
