<script type="text/x-dc" data-dc-script data-props='{"velocidad": {"editor": "enum", "options": ["1x", "0.5x", "0.25x"], "default": "1x", "section": "Movimiento"}, "menos_movimiento": {"editor": "boolean", "default": false, "section": "Movimiento"}, "foto_de_ejemplo": {"editor": "boolean", "default": true, "section": "Captura"}, "maquina_en_pausa": {"editor": "boolean", "default": false, "section": "Marco"}, "$preview": {"width": 390, "height": 844}}'>

        var paused = M.audio === 'pause', live = M.audio === 'rec' && !R;
        var beat = live ? 1 + 0.08 * M.level : (paused ? 0.96 : 1);
        E.ball.style.width = size + 'px'; E.ball.style.height = size + 'px';
        E.ball.style.transform = 'translate(' + (cx - size / 2) + 'px,' + (cy - size / 2) + 'px) scale(' + (beat * extra) + ')';
        var ring = live ? 4 + 18 * M.level : 0;
        E.ball.style.boxShadow = ring ? '0 0 0 ' + ring.toFixed(1) + 'px rgba(15,241,206,' + (0.35 * (1 - M.level * 0.5)).toFixed(2) + ')' : (paused ? 'inset 0 0 0 3px #00715e' : 'none');
        E.ball.style.background = paused || M.audio === 'none' ? '#d2fbf3' : '#0ff1ce';
        E.icMic.style.opacity = String(M.icMic.x * (M.audio === 'none' ? 0.6 : 1));
        E.icMic.style.transform = 'rotate(' + ((1 - M.icMic.x) * 90) + 'deg)';
        E.icPause.style.opacity = String(M.icPause.x); E.icPause.style.color = '#00715e';
        E.icPause.style.transform = 'rotate(' + ((M.icPause.x - 1) * 90) + 'deg) scale(' + (0.8 + 0.2 * M.icPause.x) + ')';
        E.icPlay.style.opacity = String(M.icPlay.x);
        E.icPlay.style.transform = 'scale(' + (0.6 + 0.4 * M.icPlay.x) + ')';
      }

      // ---- papelera de la hoja ----
      if (M.mode === 'trashing') {
        E.bin.style.display = 'block';
        var pop = seg(T, 0, 0.2), out = seg(T, 0.82, 1);
        var bs = (R ? 1 : (pop < 1 ? EASE_OUT(pop) * (1 + 0.1 * Math.sin(pop * Math.PI)) : 1)) * (1 - 0.2 * out);
        var shake = (T > 0.66 && T < 0.82 && !R) ? Math.sin((T - 0.66) / 0.16 * Math.PI * 4) * 4 : 0;
        E.bin.style.opacity = String(1 - out);
        E.bin.style.transform = 'translate(' + (BIN.x - 32 + shake) + 'px,' + (BIN.y - 36) + 'px) scale(' + bs + ')';
        var lidA = T < 0.55 ? -35 * seg(T, 0.05, 0.2) : -35 * (1 - seg(T, 0.55, 0.66));
        E.binLid.style.transform = 'rotate(' + lidA + 'deg)';
      } else { E.bin.style.display = 'none'; }

      // ---- sobre ----
      if (M.mode === 'sending') {
        E.env.style.display = 'block';
        var appear = R ? 1 : EASE_OUT(seg(T, 0.02, 0.2));
        var flyP = R ? 0 : EASE_IN(seg(T, 0.45, 1));
        var ex = qbez(BUB.x, 340, 450, flyP), ey = qbez(BUB.y, 300, 40, flyP);
        var es = appear * lerp(1, 0.6, flyP), rot = -18 * flyP;
        E.env.style.opacity = R ? String(1 - seg(T, 0.6, 1)) : '1';
        E.env.style.transform = 'translate(' + (ex - 36) + 'px,' + (ey - 25) + 'px) rotate(' + rot + 'deg) scale(' + es + ')';
        var close = R ? seg(T, 0.3, 0.42) : EASE_OUT(seg(T, 0.3, 0.42));
        E.flap.style.transform = 'scaleY(' + lerp(-1, 1, close) + ')';
        M.thumbs.forEach(function (th, n) {
          var p = R ? seg(T, 0, 0.3) : EASE_IN(seg(T, 0.05 + n * 0.04, 0.28 + n * 0.04));
          th.el.style.transform = 'translate(' + (th.dx * p) + 'px,' + (th.dy * p) + 'px) scale(' + (1 - 0.8 * p) + ')';
          th.el.style.opacity = String(1 - p);
        });
      } else { E.env.style.display = 'none'; }

      // textos y controles de la hoja
      E.time.textContent = fmt(M.secs);
      E.time.style.opacity = M.audio === 'pause' && !R ? (Math.floor(now / 500) % 2 ? '0.35' : '1') : '1';
      E.time.style.color = M.audio === 'pause' ? '#565972' : '#1e1e2b';
      E.status.textContent = M.audio === 'rec' ? 'Grabando · bloqueado' : (M.audio === 'pause' ? 'En pausa' : (M.audio === 'done' ? 'Audio listo para enviar' : 'Sin audio'));
      E.piP.style.display = M.audio === 'rec' ? 'flex' : 'none';
      E.piM.style.display = M.audio === 'rec' ? 'none' : 'flex';
      E.pTx.textContent = M.audio === 'rec' ? 'Pausar' : (M.audio === 'pause' ? 'Seguir' : 'Grabar');
      for (var w = 0; w < 28; w++) W[w].style.height = (4 + 28 * (M.levels[w] || 0)) + 'px';
      // aviso y háptico
      if (M.toastT > 0) { M.toastT -= dtMs; if (M.toastT <= 0) M.toast.to(0, TOK.fast, EASE_IN); }
      E.toast.style.opacity = String(M.toast.x); E.toast.style.transform = 'translateY(' + ((1 - M.toast.x) * 12) + 'px)';
      if (M.hapT > 0) M.hapT -= dtMs / sp();
      E.hap.style.opacity = M.hapT > 0 ? '1' : '0';
      self.raf = requestAnimationFrame(frame);
    }
    self.raf = requestAnimationFrame(frame);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    var self = this;
    function call(n) { return function (e) { if (self.api) self.api[n](e); }; }
    var fotos = (this.state.fotos || []).map(function (f) {
      return { dom: 'mc-th-' + f.id, fill: f.fill, src: f.src || '', hasSrc: !!f.src, noSrc: !f.src, quitar: function () { if (self.api) self.api.removeFoto(f.id); } };
    });
    return {
      enPausa: !!this.props.maquina_en_pausa,
      down: call('down'), move: call('move'), up: call('up'), click: call('click'),
      cerrar: call('close'), descartar: call('discard'), pausar: call('pause'), terminar: call('finish'), guardar: call('save'),
      addFotos: call('addFotos'), fotos: fotos, sinFotos: fotos.length === 0
    };
  }

}
