<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","options":["formulario","enviando","error","sin_conexion","demasiados_intentos","comprobando_sesion"],"default":"formulario","section":"Estado"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPass: false };
  }
  renderVals() {
    var estado = this.props.estado || 'formulario';
    var show = !!this.state.showPass;
    var self = this;
    return {
      checking: estado === 'comprobando_sesion',
      form: estado !== 'comprobando_sesion',
      showError: estado === 'error',
      showOffline: estado === 'sin_conexion',
      showTooMany: estado === 'demasiados_intentos',
      canSubmit: estado !== 'demasiados_intentos' && estado !== 'enviando',
      locked: estado === 'demasiados_intentos' || estado === 'enviando',
      lockedLabel: estado === 'enviando' ? 'Entrando…' : 'Entrar',
      lockedStyle: estado === 'enviando' ? 'background: #0ff1ce; color: #1e1e2b' : 'background: #dedfd4; color: #565972',
      showPass: show,
      hidePass: !show,
      passType: show ? 'text' : 'password',
      passLabel: show ? 'Ocultar contraseña' : 'Mostrar contraseña',
      togglePass: function () { self.setState({ showPass: !self.state.showPass }); }
    };
  }
}
</script>
