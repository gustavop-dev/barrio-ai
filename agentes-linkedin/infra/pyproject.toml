[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-knowledge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "tiktoken>=0.9,<1",
    "python-dotenv>=1,<2",
    "anthropic>=1,<2",
    "pywebpush>=2,<3",
    "cryptography>=43",
]

[project.optional-dependencies]
test = [
    "coverage>=7,<8",
    "pytest>=8,<10",
]

[project.scripts]
knowledge = "knowledge.cli:main"

[tool.setuptools.package-data]
knowledge = ["schema.sql", "console.html"]
team_backend = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
