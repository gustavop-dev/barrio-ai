[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-knowledge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "tiktoken>=0.9,<1",
    "python-dotenv>=1,<2",
    "anthropic>=1,<2",
    "pywebpush>=2,<3",
    "cryptography>=43",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
test = [
    "coverage>=7,<8",
    "pytest>=8,<10",
]

[project.scripts]
knowledge = "knowledge.cli:main"

[tool.setuptools.package-data]
knowledge = ["schema.sql", "console.html"]
team_backend = ["migrations/*.sql", "recursos/*.md", "recursos/*.html", "recursos/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI: `coverage run manage.py test team_backend.tests`, then `coverage report` and `coverage xml`.
# Report-only (no fail_under). Every module under src/ counts, imported by the tests or not.
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]
relative_files = true

[tool.coverage.report]
skip_empty = true
