name: Barrio AI
# Tests on every PR; on main, builds the server images (linux/amd64) and publishes them to
# GHCR so the 1-vCPU production server only pulls them instead of compiling.
on:
  push:
    branches: [main]
    paths: ['agentes-linkedin/infra/**', 'oficina/**', 'deploy/**', '.github/workflows/barrio-ai.yml']
  pull_request:
    paths: ['agentes-linkedin/infra/**', 'oficina/**', 'deploy/**', '.github/workflows/barrio-ai.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barrio-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: knowledge
          POSTGRES_DB: knowledge
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://knowledge:test-only-ci-password@127.0.0.1:5432/knowledge
      DJANGO_SECRET_KEY: ci-only-non-production-secret-0123456789
      LIVE_PROVIDERS: 'false'
      LIVE_LINKEDIN: 'false'
    defaults:
      run:
        working-directory: agentes-linkedin/infra
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra test
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py test team_backend.tests --noinput
      # Corpus integration tests (pytest) need the private course files: run them locally.

  oficina:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "pwa=$([ -f oficina/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.pwa == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: oficina/package-lock.json
      - if: steps.present.outputs.pwa == 'true'
        working-directory: oficina
        run: npm ci && npm run typecheck && npm test -- --run && npm run build

  images:
    if: github.event_name != 'pull_request'
    needs: [backend, oficina]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: agentes-linkedin/infra
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: present
        run: echo "web=$([ -f oficina/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: oficina
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
