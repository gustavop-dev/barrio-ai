name: QA móvil
# UI QA of the 0ff1ce app on Android emulators, against a seeded demo backend on each runner.
# Nothing here reaches production, LinkedIn or a paid provider: the API runs with FakeConnector
# (LIVE_LINKEDIN=false, LIVE_PROVIDERS=false, OPERATOR_ALLOW_FAKE=true) and the app is built with
# EXPO_PUBLIC_API_URL=http://10.0.2.2:8787 (the runner, as the emulator sees it). See movil/.maestro/README.md.
#
# Jobs: plan (whether anything to test changed, which flows, split in up to 4 emulators) → apk (built once, cached by
# what affects the app) → flujos (one emulator + backend per shard, in parallel) → qa (one report, catalog coverage,
# visual regression against main, the PR comment and the verdict).
# `qa` runs on every PR, so it can be a required check: a PR that touches nothing of the app gets a green `qa` in
# seconds. Main runs on every push that touches the app and every night, and keeps the visual reference.
# Run only some flows: `[qa: 05-captura 09]` in the PR's head commit message, or the `flujos` input of a manual run.
on:
  workflow_dispatch:
    inputs:
      flujos:
        description: 'Flujos a correr (nombres o números separados por espacios, p. ej. «05 09-personas»); vacío = todos'
        required: false
        default: ''
  pull_request:
  push:
    branches: [main]
    paths: ['movil/**', 'compartido/**', 'agentes-linkedin/**', 'scripts/qa/**', '.github/workflows/qa-movil.yml']
  schedule:
    - cron: '0 8 * * *'  # 03:00 in Bogotá: the full run on main, every night
permissions:
  contents: read
concurrency:
  group: qa-movil-${{ github.ref }}
  # A newer push supersedes a PR run; main keeps every run (each one refreshes the visual reference).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Bump to rebuild the APK when the build steps change without touching movil/ or compartido/.
  APK_CACHE_VERSION: v1
  API_LEVEL: 35
  MAESTRO_VERSION: 2.12.0
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ejecutar: ${{ steps.plan.outputs.ejecutar }}
      matriz: ${{ steps.plan.outputs.matriz }}
      resumen: ${{ steps.plan.outputs.resumen }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          QA_SELECCION: ${{ inputs.flujos }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A PR is tested when it touches the app, the shared code, the API, the QA scripts or this workflow.
          if [ -n "$PR" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' \
                | grep -qE '^(movil|compartido|agentes-linkedin|scripts/qa)/|^\.github/workflows/qa-movil\.yml$'; then
              # A placeholder matrix: the skipped jobs still parse it.
              { echo "ejecutar=false"; echo 'matriz={"include":[{"shard":1,"flujos":""}]}'
                echo "resumen=El PR no toca la app, la API ni la QA: no hay flujos que correr."; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            export QA_MENSAJE="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq .commit.message || true)"
          fi
          echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          python3 scripts/qa/plan.py

  apk:
    needs: plan
    if: needs.plan.outputs.ejecutar == 'true'
    runs-on: ubuntu-24.04
    # A warm cache finishes in seconds; a cold build of the whole app takes about 17 minutes.
    timeout-minutes: 40
    outputs:
      key: ${{ steps.apk.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@v4
      # What goes into the APK: the app (not its flows or docs), compartido/, the lockfile and app.config.js (QA switch).
      - name: APK cache
        id: apk
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apk
          key: apk-${{ env.APK_CACHE_VERSION }}-${{ hashFiles('movil/**', '!movil/.maestro/**', '!movil/**/*.md', 'compartido/**') }}
          lookup-only: true
      - if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: movil/package-lock.json
      - if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: steps.apk.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          # Write the Gradle cache from PRs too, so the next build of the same branch starts warm.
          cache-read-only: false
      - name: APK · npm ci and expo prebuild (QA switch on)
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: movil
        env:
          OFFICE_QA_BUILD: '1'
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8787
        run: |
          npm ci
          npx expo prebuild --platform android --no-install --clean
          grep -n 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml
      - name: APK · gradle assembleRelease (x86_64)
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: movil/android
        env:
          OFFICE_QA_BUILD: '1'
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8787
          NODE_ENV: production
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/qa.apk"
          ls -la "$RUNNER_TEMP/apk"
      - if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apk
          key: ${{ steps.apk.outputs.cache-primary-key }}

  flujos:
    needs: [plan, apk]
    if: needs.plan.outputs.ejecutar == 'true'
    runs-on: ubuntu-24.04
    # Setup takes about 5 minutes and each flow is cut at QA_FLOW_TIMEOUT (8 minutes): a hang can't hold the run.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matriz) }}
    name: flujos (${{ matrix.shard }})
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: knowledge
          POSTGRES_DB: knowledge
          POSTGRES_PASSWORD: qa-only-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://knowledge:qa-only-ci-password@127.0.0.1:5432/knowledge
      DJANGO_SECRET_KEY: qa-only-non-production-secret-0123456789
      DJANGO_ALLOWED_HOSTS: 10.0.2.2,127.0.0.1,localhost
      LIVE_PROVIDERS: 'false'
      LIVE_LINKEDIN: 'false'
      LIVE_LINKEDIN_OFFICIAL: 'false'
      OPERATOR_ALLOW_FAKE: 'true'
      # The seeded inbox conversation shows as a Tu turno card only with the inbox on (nothing reads LinkedIn: no worker runs).
      INBOX_ENABLED: 'true'
      # The window is open all day so nothing in the QA world waits for 07:00.
      OPERATOR_WINDOW: '00:00-23:59'
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/agentes-linkedin/infra/assets/tiktoken
      # CI-only account created by seed_qa; it never exists outside this job.
      QA_SEED: permitido
      QA_PASSWORD: qa-0ff1ce-solo-ci
      QA_OUT: ${{ github.workspace }}/qa-artefactos
      INFRA_DIR: ${{ github.workspace }}/agentes-linkedin/infra
      QA_SHARD: ${{ matrix.shard }}
      QA_FLOWS: ${{ matrix.flujos }}
      QA_FLOW_TIMEOUT: '480'
      # The QA failure switch (team_backend.qa_fallos): only these settings load it. See movil/.maestro/README.md.
      QA_MODE: 'true'
      QA_FAULTS_FILE: /tmp/qa-fallos.json
      # One place for the AVD: avdmanager, the emulator, the runner action and the cache all use it.
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ---------------------------------------------------------------- the APK of this run (built by the apk job)
      - name: APK
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apk
          key: ${{ needs.apk.outputs.key }}
          fail-on-cache-miss: true

      # ---------------------------------------------------------------- demo backend of this emulator
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: agentes-linkedin/infra/uv.lock
          # The demo backend keeps a uv process alive until the job ends; pruning
          # would wait 300 s for its lock and fail the job (run 42459989978).
          prune-cache: false
      - name: Backend · migrate, bootstrap_local, seed_qa
        working-directory: agentes-linkedin/infra
        run: |
          mkdir -p "$QA_OUT"
          uv sync --frozen
          uv run python manage.py migrate --noinput
          uv run python manage.py bootstrap_local
          uv run python manage.py seed_qa
          uv run python manage.py collectstatic --noinput --verbosity 0
      - name: Backend · serve the API on 0.0.0.0:8787
        working-directory: agentes-linkedin/infra
        run: |
          DJANGO_SETTINGS_MODULE=linkedin_backend.settings_qa \
            nohup uv run gunicorn linkedin_backend.wsgi:application --bind 0.0.0.0:8787 --workers 3 --timeout 120 \
            --access-logfile - --error-logfile - --capture-output > "$QA_OUT/api-$QA_SHARD.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/health && exit 0
            sleep 1
          done
          echo "The API did not start"; cat "$QA_OUT/api-$QA_SHARD.log"; exit 1
      - name: Backend · the QA user can log in, and the failure switch answers
        run: |
          curl -fsS -X POST http://127.0.0.1:8787/api/v1/auth/token -H 'Content-Type: application/json' \
            -d "{\"username\":\"qa\",\"password\":\"$QA_PASSWORD\",\"device_name\":\"curl de CI\"}" -o /dev/null -w '%{http_code}\n'
          curl -fsS -X POST http://127.0.0.1:8787/api/v1/qa/fallos -H 'Content-Type: application/json' \
            -d '{"ruta":"^/health$","efecto":"503"}' > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/health)" = 503
          curl -fsS -X DELETE http://127.0.0.1:8787/api/v1/qa/fallos > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/health)" = 200

      # ---------------------------------------------------------------- emulator and Maestro
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Maestro, pinned and cached. get.maestro.mobile.dev answered 504 and handed back a corrupt zip
      # while the step still passed, so every flow died with exit 127 (runs 42463814844, 42466035998).
      - name: Maestro cache
        id: maestro
        uses: actions/cache/restore@v4
        with:
          path: ~/.maestro
          key: maestro-${{ env.MAESTRO_VERSION }}
      - name: Maestro
        run: |
          if ! "$HOME/.maestro/bin/maestro" --version > /dev/null 2>&1; then
            rm -rf "$HOME/.maestro" /tmp/maestro-zip && mkdir -p /tmp/maestro-zip
            url="https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
            for i in 1 2 3 4 5; do
              if curl -fsSL --retry 3 --retry-all-errors -o /tmp/maestro-zip/maestro.zip "$url" \
                 && unzip -tq /tmp/maestro-zip/maestro.zip > /dev/null; then
                break
              fi
              echo "::warning::Maestro download attempt $i failed; retrying"
              sleep $((i * 10))
            done
            unzip -q /tmp/maestro-zip/maestro.zip -d /tmp/maestro-zip
            mv /tmp/maestro-zip/maestro "$HOME/.maestro"
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Save Maestro cache
        if: steps.maestro.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.maestro
          key: maestro-${{ env.MAESTRO_VERSION }}
      # Restore and save apart: actions/cache only saves when the whole job succeeds, and this job fails on purpose
      # when a flow fails, so the AVD snapshot would never be kept.
      - name: AVD cache
        id: avd
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-390x844dp-320dpi-v3
      # The phone is defined at the design boards' size, 390x844 dp (780x1688 px at 320 dpi), instead of resizing a
      # pixel_6 after boot: a resize makes the launcher hang, and 2x instead of 3x halves the software rendering work.
      - name: AVD · define a 390x844 dp phone
        if: steps.avd.outputs.cache-hit != 'true'
        run: |
          image="system-images;android-$API_LEVEL;google_apis;x86_64"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          mkdir -p "$ANDROID_AVD_HOME"
          yes 2> /dev/null | "$sdk/sdkmanager" --install "$image" emulator platform-tools > /dev/null
          echo no | "$sdk/avdmanager" create avd --force -n test -k "$image" -d pixel_6 -p "$ANDROID_AVD_HOME/test.avd"
          "$sdk/avdmanager" list avd
          cfg="$ANDROID_AVD_HOME/test.avd/config.ini"
          sed -i -E '/^(hw\.lcd\.(width|height|density)|skin\.(name|path)|hw\.cpu\.ncore|hw\.ramSize)=/d' "$cfg"
          printf '%s\n' hw.lcd.width=780 hw.lcd.height=1688 hw.lcd.density=320 skin.name=780x1688 skin.path=_no_skin \
            hw.cpu.ncore=3 hw.ramSize=4096 >> "$cfg"
          grep -E '^(hw\.lcd|skin\.|hw\.cpu|hw\.ramSize)' "$cfg"
      - name: AVD · boot it once and save a snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated."
      - if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true  # another emulator job may have saved the same key first
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd.outputs.cache-primary-key }}
      - name: Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_APK: ${{ runner.temp }}/apk/qa.apk
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash scripts/qa/correr-maestro.sh
      - name: Upload this emulator's artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-flujos-${{ matrix.shard }}
          path: qa-artefactos
          retention-days: 3
          if-no-files-found: warn

  qa:
    needs: [plan, flujos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read         # the visual reference: an artifact of an earlier run on main
      checks: write         # the «QA visual» check
      pull-requests: write  # the PR comment
    env:
      QA_OUT: ${{ github.workspace }}/qa-artefactos
      QA_PLAN: ${{ needs.plan.outputs.resumen }}
      GH_TOKEN: ${{ github.token }}
      EJECUTAR: ${{ needs.plan.outputs.ejecutar }}
    steps:
      - uses: actions/checkout@v4
      - name: Nothing to test
        if: needs.plan.outputs.ejecutar != 'true'
        run: |
          echo "## QA móvil" >> "$GITHUB_STEP_SUMMARY"
          echo "$QA_PLAN" >> "$GITHUB_STEP_SUMMARY"
      - name: Gather the emulators' artifacts
        if: needs.plan.outputs.ejecutar == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: qa-flujos-*
          merge-multiple: true
          path: qa-artefactos
      # The visual reference is the screenshots of the latest run on main that kept one (artifact qa-movil-referencias).
      - name: Visual reference from main
        if: needs.plan.outputs.ejecutar == 'true'
        run: |
          mkdir -p referencias
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow qa-movil.yml --branch main --limit 30 \
                        --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                 --jq '.artifacts[] | select(.name == "qa-movil-referencias" and (.expired | not)) | .name' | grep -q .; then
              gh run download "$id" -R "$GITHUB_REPOSITORY" -n qa-movil-referencias -D referencias && break
            fi
          done
          echo "referencia: $(cat referencias/origen.txt 2> /dev/null || echo ninguna) · $(ls referencias/*.png 2> /dev/null | wc -l) capturas"
      - uses: astral-sh/setup-uv@v6
        if: needs.plan.outputs.ejecutar == 'true'
      - name: Visual regression
        if: needs.plan.outputs.ejecutar == 'true'
        run: uv run --no-project --with pillow==11.3.0 python scripts/qa/visual.py comparar "$QA_OUT" referencias || echo "La comparación visual no pudo correr."
      - name: Report
        if: needs.plan.outputs.ejecutar == 'true'
        run: |
          mkdir -p "$QA_OUT"
          python3 scripts/qa/informe.py "$QA_OUT" > "$QA_OUT/resumen.md" || echo "No se pudo escribir el resumen." > "$QA_OUT/resumen.md"
          cat "$QA_OUT/resumen.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        id: upload
        if: needs.plan.outputs.ejecutar == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qa-movil-${{ github.run_number }}
          path: qa-artefactos
          retention-days: 14
          if-no-files-found: warn
      # On main, this run's screenshots (over the previous reference, for flows that did not run) become the reference.
      - name: New visual reference (main)
        if: needs.plan.outputs.ejecutar == 'true' && github.ref == 'refs/heads/main'
        run: |
          uv run --no-project --with pillow==11.3.0 python scripts/qa/visual.py referencias "$QA_OUT/capturas" referencias nuevas-referencias \
            "main $(git rev-parse --short HEAD), ejecución $GITHUB_RUN_ID"
      - if: needs.plan.outputs.ejecutar == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: qa-movil-referencias
          path: nuevas-referencias
          retention-days: 90
      - name: Comment on the PR
        if: needs.plan.outputs.ejecutar == 'true' && github.event_name == 'pull_request'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$(cat "$QA_OUT/resumen.md")"
          body="$body"$'\n\n'"Artefactos: ${ARTIFACT_URL:-no se subieron} · [ejecución](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"$'\n'"<!-- qa-movil -->"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- qa-movil -->")) | .id' | tail -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
      # Visual changes never fail the run (they may be intended); they mark it: a warning and a neutral «QA visual» check.
      - name: Mark visual changes
        if: needs.plan.outputs.ejecutar == 'true'
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          result="$QA_OUT/visual/resultado.json"
          [ -f "$result" ] || exit 0
          changed=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))['cambian']))" "$result")
          if [ "$changed" -gt 0 ]; then
            echo "::warning title=Regresión visual::$changed capturas cambian más de su tolerancia frente a main (artefacto, carpeta visual/)."
            conclusion=neutral; title="$changed capturas cambian frente a main"
          else
            conclusion=success; title="Sin cambios visuales frente a main"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name="QA visual" -f head_sha="$SHA" -f status=completed \
            -f conclusion="$conclusion" -f "output[title]=$title" -f "output[summary]=Detalle en el resumen de la ejecución $GITHUB_RUN_ID (carpeta visual/ del artefacto)." > /dev/null \
            || echo "No se pudo crear el check «QA visual»."
      - name: Fail when a flow failed or the app crashed
        if: needs.plan.outputs.ejecutar == 'true'
        run: test -f "$QA_OUT/resultado.txt" && grep -qx 'ok' "$QA_OUT/resultado.txt"
