name: QA · sesión viva
# Long-lived, disposable QA runner. Source and results are separate branches; no repository secrets.
on:
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama de este repositorio que se vigila cada 15 s'
        required: true
        type: string
      minutos:
        description: 'Duración total desde el arranque del job (1–345 minutos, incluye preparación)'
        required: false
        type: number
        default: 330
      flujos:
        description: 'Selección inicial (p. ej. 05 09); después manda el tag [qa: ...] del head'
        required: false
        type: string
        default: ''
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: qa-sesion-${{ inputs.rama }}
  cancel-in-progress: true
env:
  API_LEVEL: 35
  MAESTRO_VERSION: 2.12.0
  UV_VERSION: 0.13.7
jobs:
  sesion:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Backend service, environment and startup copied from qa-movil.yml.
    # TODO: deduplicate these steps into a composite action shared by both workflows.
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: knowledge
          POSTGRES_DB: knowledge
          POSTGRES_PASSWORD: qa-only-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U knowledge -d knowledge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://knowledge:qa-only-ci-password@127.0.0.1:5432/knowledge
      DJANGO_SECRET_KEY: qa-only-non-production-secret-0123456789
      DJANGO_ALLOWED_HOSTS: 10.0.2.2,127.0.0.1,localhost
      LIVE_PROVIDERS: 'false'
      LIVE_LINKEDIN: 'false'
      LIVE_LINKEDIN_OFFICIAL: 'false'
      OPERATOR_ALLOW_FAKE: 'true'
      # The seeded inbox conversation shows as a Tu turno card only with the inbox on (nothing reads LinkedIn: no worker runs).
      INBOX_ENABLED: 'true'
      # The window is open all day so nothing in the QA world waits for 07:00.
      OPERATOR_WINDOW: '00:00-23:59'
      # A placeholder LinkedIn app, so Ajustes offers «Conectar LinkedIn» (AJU-07): the app only opens the office web on
      # this runner. Nothing here is a real credential, and no flow starts the OAuth or reaches LinkedIn.
      LINKEDIN_CLIENT_ID: qa-solo-ci
      LINKEDIN_CLIENT_SECRET: qa-solo-ci-no-es-un-secreto
      LINKEDIN_REDIRECT_URI: https://qa.invalid/api/v1/linkedin/oauth/callback
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/agentes-linkedin/infra/assets/tiktoken
      # CI-only account created by seed_qa; it never exists outside this job.
      QA_SEED: permitido
      QA_PASSWORD: qa-0ff1ce-solo-ci
      QA_OUT: ${{ runner.temp }}/qa-sesion/backend
      INFRA_DIR: ${{ github.workspace }}/agentes-linkedin/infra
      QA_SHARD: 'sesion'
      QA_FLOW_TIMEOUT: '480'
      # System animations on (scripts/qa/correr-maestro.sh): the entrance, the shell's push and pop between tabs (the blank
      # screen of Android back between two top-bar screens only happened with them) and the Oficina scene.
      QA_FLUJOS_ANIMADOS: '01-entrada 02-navegacion 03-oficina'
      # The QA failure switch (team_backend.qa_fallos): only these settings load it. See movil/.maestro/README.md.
      QA_MODE: 'true'
      QA_FAULTS_FILE: /tmp/qa-fallos.json
      # One place for the AVD: avdmanager, the emulator, the runner action and the cache all use it.
      ANDROID_AVD_HOME: /home/runner/.android/avd
      QA_RAMA: ${{ inputs.rama }}
      QA_MINUTOS: ${{ inputs.minutos }}
      QA_SELECCION: ${{ inputs.flujos }}
      QA_SESION_CI: '1'
      QA_SESION_ROOT: ${{ github.workspace }}
      QA_APK: ${{ runner.temp }}/qa-devclient/qa.apk
      GH_TOKEN: ${{ github.token }}
      OFFICE_QA_BUILD: '1'
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8787
      EXPO_NO_DOTENV: '1'
      EXPO_OFFLINE: '1'
    steps:
      - name: Validar inputs y fijar el plazo (incluye el arranque)
        run: |
          git check-ref-format "refs/heads/$QA_RAMA"
          case "$QA_RAMA" in qa-sesion/*) echo 'No se puede vigilar una rama de resultados'; exit 2 ;; esac
          [[ "$QA_MINUTOS" =~ ^[0-9]{1,3}$ ]] || { echo 'minutos debe ser un entero entre 1 y 345'; exit 2; }
          minutes=$((10#$QA_MINUTOS))
          (( minutes >= 1 && minutes <= 345 )) || { echo 'minutos debe estar entre 1 y 345'; exit 2; }
          echo "QA_DEADLINE=$(($(date +%s) + minutes * 60))" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/qa-sesion/bin"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama }}
          fetch-depth: 0
          # The controller uses the ephemeral job token to push results and update the PR comment.
          persist-credentials: true
      - name: Guardar el controlador fuera del checkout y calcular huella nativa
        id: native
        run: |
          # These syntax checks run on GitHub before spending time on the APK/emulator.
          bash -n scripts/qa/sesion.sh
          bash -n scripts/qa/sesion-resultado.sh
          python3 -m py_compile scripts/qa/sesion-util.py
          cp scripts/qa/sesion.sh scripts/qa/sesion-util.py "$RUNNER_TEMP/qa-sesion/bin/"
          cp movil/.maestro/comun/sesion-abrir.yaml "$RUNNER_TEMP/qa-sesion/bin/"
          fingerprint=$(python3 scripts/qa/sesion-util.py huella "$GITHUB_WORKSPACE" HEAD)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "QA_NATIVE_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: movil/package-lock.json
      # Metro needs JS dependencies even when the APK cache hits.
      - name: Dependencias de Metro
        working-directory: movil
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: APK dev client · caché por huella nativa
        id: apk
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/qa-devclient
          key: qa-devclient-${{ steps.native.outputs.fingerprint }}
      - if: steps.apk.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: APK dev client · prebuild QA
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: movil
        run: |
          # app.config.js: usesCleartextTraffic=true and updates.enabled=false, also for this debug APK.
          npx expo prebuild --platform android --no-install --clean
          grep -n 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml
      - name: APK dev client · debug x86_64 (includes expo-dev-client)
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: movil/android
        run: |
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64
          mkdir -p "$RUNNER_TEMP/qa-devclient"
          cp app/build/outputs/apk/debug/app-debug.apk "$QA_APK"
      - if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/qa-devclient
          key: ${{ steps.apk.outputs.cache-primary-key }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: astral-sh/setup-uv@v6
        id: uv
        continue-on-error: true
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: agentes-linkedin/infra/uv.lock
          # The demo backend keeps a uv process alive until the job ends; pruning
          # would wait 300 s for its lock and fail the job (run 42459989978).
          prune-cache: false
      # GitHub release downloads answered 504 (run on PR #54): fall back to uv from PyPI.
      - name: uv fallback (PyPI)
        if: steps.uv.outcome == 'failure'
        run: |
          python3 -m pip install --user --break-system-packages "uv==${{ env.UV_VERSION }}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Backend · migrate, bootstrap_local, seed_qa
        working-directory: agentes-linkedin/infra
        run: |
          mkdir -p "$QA_OUT"
          uv sync --frozen
          uv run python manage.py migrate --noinput
          uv run python manage.py bootstrap_local
          uv run python manage.py seed_qa
          uv run python manage.py collectstatic --noinput --verbosity 0
      - name: Backend · serve the API on 0.0.0.0:8787
        working-directory: agentes-linkedin/infra
        run: |
          DJANGO_SETTINGS_MODULE=linkedin_backend.settings_qa \
            nohup uv run gunicorn linkedin_backend.wsgi:application --bind 0.0.0.0:8787 --workers 3 --timeout 120 \
            --pid "$RUNNER_TEMP/qa-sesion/gunicorn.pid" --access-logfile - --error-logfile - --capture-output > "$QA_OUT/api-$QA_SHARD.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/health && exit 0
            sleep 1
          done
          echo "The API did not start"; cat "$QA_OUT/api-$QA_SHARD.log"; exit 1
      - name: Backend · the QA user can log in, and the failure switch answers
        run: |
          curl -fsS -X POST http://127.0.0.1:8787/api/v1/auth/token -H 'Content-Type: application/json' \
            -d "{\"username\":\"qa\",\"password\":\"$QA_PASSWORD\",\"device_name\":\"curl de CI\"}" -o /dev/null -w '%{http_code}\n'
          curl -fsS -X POST http://127.0.0.1:8787/api/v1/qa/fallos -H 'Content-Type: application/json' \
            -d '{"ruta":"^/health$","efecto":"503"}' > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/health)" = 503
          curl -fsS -X DELETE http://127.0.0.1:8787/api/v1/qa/fallos > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/health)" = 200

      # Maestro, pinned and cached. get.maestro.mobile.dev answered 504 and handed back a corrupt zip
      # while the step still passed, so every flow died with exit 127 (runs 42463814844, 42466035998).
      - name: Maestro cache
        id: maestro
        uses: actions/cache/restore@v4
        with:
          path: ~/.maestro
          key: maestro-${{ env.MAESTRO_VERSION }}
      - name: Maestro
        run: |
          if ! "$HOME/.maestro/bin/maestro" --version > /dev/null 2>&1; then
            rm -rf "$HOME/.maestro" /tmp/maestro-zip && mkdir -p /tmp/maestro-zip
            url="https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
            for i in 1 2 3 4 5; do
              if curl -fsSL --retry 3 --retry-all-errors -o /tmp/maestro-zip/maestro.zip "$url" \
                 && unzip -tq /tmp/maestro-zip/maestro.zip > /dev/null; then
                break
              fi
              echo "::warning::Maestro download attempt $i failed; retrying"
              sleep $((i * 10))
            done
            if unzip -tq /tmp/maestro-zip/maestro.zip > /dev/null 2>&1; then
              unzip -q /tmp/maestro-zip/maestro.zip -d /tmp/maestro-zip
              mv /tmp/maestro-zip/maestro "$HOME/.maestro"
            else
              echo "::warning::GitHub release download failed; trying get.maestro.mobile.dev"
              for i in 1 2 3; do
                curl -fsSL --retry 3 "https://get.maestro.mobile.dev" | bash && "$HOME/.maestro/bin/maestro" --version > /dev/null 2>&1 && break
                sleep $((i * 15))
              done
            fi
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Save Maestro cache
        if: steps.maestro.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.maestro
          key: maestro-${{ env.MAESTRO_VERSION }}
      # Restore and save apart: actions/cache only saves when the whole job succeeds, and this job fails on purpose
      # when a flow fails, so the AVD snapshot would never be kept.
      - name: AVD cache
        id: avd
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-390x844dp-320dpi-v3
      # The phone is defined at the design boards' size, 390x844 dp (780x1688 px at 320 dpi), instead of resizing a
      # pixel_6 after boot: a resize makes the launcher hang, and 2x instead of 3x halves the software rendering work.
      - name: AVD · define a 390x844 dp phone
        if: steps.avd.outputs.cache-hit != 'true'
        run: |
          image="system-images;android-$API_LEVEL;google_apis;x86_64"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          mkdir -p "$ANDROID_AVD_HOME"
          yes 2> /dev/null | "$sdk/sdkmanager" --install "$image" emulator platform-tools > /dev/null
          echo no | "$sdk/avdmanager" create avd --force -n test -k "$image" -d pixel_6 -p "$ANDROID_AVD_HOME/test.avd"
          "$sdk/avdmanager" list avd
          cfg="$ANDROID_AVD_HOME/test.avd/config.ini"
          sed -i -E '/^(hw\.lcd\.(width|height|density)|skin\.(name|path)|hw\.cpu\.ncore|hw\.ramSize)=/d' "$cfg"
          printf '%s\n' hw.lcd.width=780 hw.lcd.height=1688 hw.lcd.density=320 skin.name=780x1688 skin.path=_no_skin \
            hw.cpu.ncore=3 hw.ramSize=4096 >> "$cfg"
          grep -E '^(hw\.lcd|skin\.|hw\.cpu|hw\.ramSize)' "$cfg"
      - name: AVD · boot it once and save a snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated."
      - if: steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true  # another emulator job may have saved the same key first
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd.outputs.cache-primary-key }}
      - name: Sesión · un emulador, Metro y sondeo de la rama
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash "$RUNNER_TEMP/qa-sesion/bin/sesion.sh"
      - name: Cerrar el backend antes de los post steps de caché
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/qa-sesion/gunicorn.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/qa-sesion/gunicorn.pid")" 2> /dev/null || true
          fi
